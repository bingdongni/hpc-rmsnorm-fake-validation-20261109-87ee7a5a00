name: Loro map edit provenance
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native:
    name: native
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v4
      with:
        repository: bingdongni/loro
        ref: eeee9274af4dc06fea4e3d513ddee846761a3c44
        persist-credentials: false
    - name: Check Rust formatting
      run: cargo fmt --all -- --check
    - name: Test full and trimmed history
      run: cargo test --locked -p loro --test shallow_checkout_equal_value
  typescript:
    name: typescript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v4
      with:
        repository: bingdongni/loro
        ref: eeee9274af4dc06fea4e3d513ddee846761a3c44
        persist-credentials: false
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install locked dependencies
      run: pnpm install --frozen-lockfile
    - name: Check TypeScript package
      run: pnpm -C loro-js check
  wasm:
    name: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v4
      with:
        repository: bingdongni/loro
        ref: eeee9274af4dc06fea4e3d513ddee846761a3c44
        persist-credentials: false
    - name: Enable WebAssembly target
      run: rustup target add wasm32-unknown-unknown
    - uses: jetli/wasm-bindgen-action@v0.2.0
      with:
        version: 0.2.100
    - name: Build bindings from the branch
      run: 'cargo build --locked --target wasm32-unknown-unknown -p loro-wasm

        wasm-bindgen --target nodejs --out-dir "$RUNNER_TEMP/binding" --out-name index
        target/wasm32-unknown-unknown/debug/loro_wasm.wasm'
    - name: Exercise two peers through the compiled Node bindings
      run: "node <<'JS'\nconst assert = require('node:assert/strict');\nconst {LoroDoc,\
        \ LoroMap} = require(process.env.RUNNER_TEMP+'/binding/index.js');\nconst\
        \ a = new LoroDoc(), b = new LoroDoc();\na.setPeerId('1'); b.setPeerId('2');\n\
        const detached = new LoroMap(); detached.set('k', 1); assert.equal(detached.getLastEditId('k'),\
        \ undefined);\nconst m=a.getMap('m'); assert.equal(m.getLastEditId('unset'),\
        \ undefined);\nm.set('k','initial'); a.commit({message:'initial'}); const\
        \ first=a.frontiers();\nb.import(a.export({mode:'snapshot'}));\nm.set('k','left');\
        \ a.commit({message:'left'});\nb.getMap('m').set('k','right'); b.commit({message:'right'});\n\
        const updatesA=a.export({mode:'update'}), updatesB=b.export({mode:'update'});\n\
        a.import(updatesB); b.import(updatesA);\nfor(const doc of [a,b]) {\n  const\
        \ map=doc.getMap('m'), id=map.getLastEditId('k');\n  assert.deepEqual(id,{peer:'2',lamport:1});\n\
        \  assert.equal(doc.getChangeAtLamport(id.peer,id.lamport).message,'right');\n\
        \  doc.checkout(first); assert.deepEqual(map.getLastEditId('k'),{peer:'1',lamport:0});\
        \ doc.checkoutToLatest();\n}\nm.delete('k'); a.commit({message:'removed'});\n\
        const deletion=m.getLastEditId('k'); assert.equal(a.getChangeAtLamport(deletion.peer,deletion.lamport).message,'removed');\n\
        assert.equal(m.get('k'),undefined);\nconsole.log('Verified winning concurrent\
        \ edit, commit message, checkout, retained deletion, and detached/missing\
        \ keys');\nJS"
