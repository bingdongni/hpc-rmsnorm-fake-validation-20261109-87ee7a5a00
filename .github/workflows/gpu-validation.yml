name: Check VICReg on PyTorch 1.10, 1.11 and two Gloo ranks
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux-lightly:
    name: Linux lightly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      SCIPY_ARRAY_API: '1'
      CUBLAS_WORKSPACE_CONFIG: :4096:8
    steps:
    - &id001
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - &id002
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: lightly
        repository: bingdongni/lightly
        ref: bc373282eb88abef49e3734d7d0c8a587aa0a9ff
        persist-credentials: false
        fetch-depth: 3
    - name: Check out upstream parent
      run: git -C lightly worktree add --detach ../pli84244 4340fa42392e65eadbe8e5411b63aea9f7fb2596
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install CPU PyTorch and Lightly
      run: 'python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install ./lightly pytest pytest-mock'
    - name: Compare the public API and run neighboring regressions
      run: 'python -m torch.distributed.run --standalone --nproc-per-node=2 validation/compare.py
        lightly pli84244 cpu base

        python -m torch.distributed.run --standalone --nproc-per-node=2 validation/compare.py
        lightly lightly cpu candidate

        python validation/test_suite.py lightly'
  legacy1100:
    name: Linux torch 1.10.0 lightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
    - *id001
    - *id002
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.9'
    - name: Install the legacy CPU wheels
      run: 'python -m pip install ''numpy<2'' ''torch==1.10.0+cpu'' ''torchvision==0.11.1+cpu''
        -f https://download.pytorch.org/whl/cpu/torch_stable.html

        python -m pip install pytest pytest-mock scipy ''pytorch-lightning==1.6.5.post0''
        ''torchmetrics==0.9.3'' ''setuptools<80'' hydra-core'
    - name: Check public VICReg loss, gradients and second derivatives
      run: 'PYTHONPATH=lightly python validation/compare.py lightly lightly cpu candidate

        python validation/test_suite.py lightly'
  legacy1110:
    name: Linux torch 1.11.0 lightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
    - *id001
    - *id002
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.9'
    - name: Install the legacy CPU wheels
      run: 'python -m pip install ''numpy<2'' ''torch==1.11.0+cpu'' ''torchvision==0.12.0+cpu''
        -f https://download.pytorch.org/whl/cpu/torch_stable.html

        python -m pip install pytest pytest-mock scipy ''pytorch-lightning==1.6.5.post0''
        ''torchmetrics==0.9.3'' ''setuptools<80'' hydra-core'
    - name: Check public VICReg loss, gradients and second derivatives
      run: 'PYTHONPATH=lightly python validation/compare.py lightly lightly cpu candidate

        python validation/test_suite.py lightly'
