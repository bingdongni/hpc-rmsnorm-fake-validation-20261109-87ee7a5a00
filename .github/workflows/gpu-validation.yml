name: AgentWorldBench checkpoint regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: QwenLM/Qwen-AgentWorld
          ref: cd0aa83dc7a9c733695eb9c4652e0a68b6e6ecde
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Apply patch and run regression tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 'cd0aa83dc7a9c733695eb9c4652e0a68b6e6ecde'
          git -C candidate apply --check "$GITHUB_WORKSPACE/harness/qwen-agentworld-checkpoint.patch"
          git -C candidate apply "$GITHUB_WORKSPACE/harness/qwen-agentworld-checkpoint.patch"
          python -m pip install 'openai==3.49.0'
          cd candidate
          python -m unittest discover -s tests -v
