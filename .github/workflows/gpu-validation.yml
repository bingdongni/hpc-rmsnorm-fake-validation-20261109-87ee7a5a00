name: MineAgent PR 2 compatibility validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/MineAgent
          ref: refs/pull/2/merge
          path: candidate
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Apply compatibility patch
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = 975b091808f766af88592ac3deaec9a0c0f0af8f
          git apply --check "$GITHUB_WORKSPACE/harness/mineagent-pr2-compat.patch"
          git apply "$GITHUB_WORKSPACE/harness/mineagent-pr2-compat.patch"
      - name: Run release verification
        working-directory: candidate
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon prepareReleaseNotes verifyReleaseArtifacts
  real-mods:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [storage, industry, combined]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/MineAgent
          ref: refs/pull/2/merge
          path: candidate
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Apply compatibility patch
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = 975b091808f766af88592ac3deaec9a0c0f0af8f
          git apply --check "$GITHUB_WORKSPACE/harness/mineagent-pr2-compat.patch"
          git apply "$GITHUB_WORKSPACE/harness/mineagent-pr2-compat.patch"
      - name: Provision checksum-locked public dependencies
        working-directory: candidate
        run: python scripts/provision-modpack-tests.py --profile '${{ matrix.profile }}'
      - name: Run real-mod GameTests
        working-directory: candidate
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon '-Pmodpack_profile=${{ matrix.profile }}' :fabric:verifyModpackGameTests
