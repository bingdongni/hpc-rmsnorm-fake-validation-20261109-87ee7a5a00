name: Validate iql-paired algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  policy:
    name: IQL ${{ matrix.version }} seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        version:
        - v1
        - v2
        seed:
        - 17
        - 37
        - 73
    env:
      VERSION: ${{ matrix.version }}
      SEED: ${{ matrix.seed }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
    - name: Install pinned evaluation and training runtime
      run: 'set -euo pipefail

        python -m pip -q install uv

        uv venv --python 3.11

        uv pip install --python .venv torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu

        uv pip install --python .venv numpy==1.26.4 h5py==3.12.1 gymnasium==1.0.0
        gymnasium-robotics==1.3.1 mujoco==3.1.6'
    - name: Fetch fixed data and common evaluation specification
      run: 'set -euo pipefail

        curl -fsSL --retry 3 "https://huggingface.co/datasets/farama-minari/D4RL/resolve/a0fd465d1d9d253b075d532b270e03d8fb4f46e6/antmaze/medium-play-$VERSION/data/main_data.hdf5?download=true"
        -o /tmp/ant.h5

        curl -fsSL --retry 3 "https://huggingface.co/datasets/farama-minari/D4RL/resolve/a0fd465d1d9d253b075d532b270e03d8fb4f46e6/antmaze/medium-play-v2/data/metadata.json"
        -o /tmp/eval.json

        sha256sum /tmp/ant.h5 /tmp/eval.json

        echo 
        | base64 -d > /tmp/train.py'
    - name: Train and evaluate the policy
      run: .venv/bin/python -u /tmp/train.py "$VERSION" /tmp/ant.h5 /tmp/eval.json
        "$SEED"
