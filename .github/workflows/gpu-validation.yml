name: DeepJIT precompilation validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/DeepJIT
          ref: c6a65639829487269ff91af7be10864a90aeba37
          path: patched
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: deepseek-ai/DeepJIT
          ref: 6e4bba88ee9e73a0986714f7f6bb45590ebeb04d
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libdw-dev
          python -m pip install pytest pybind11==2.13.6
          c++ --version | head -1
      - name: Reproduce explicit finish failure on base
        shell: bash
        run: |
          cat > /tmp/deepjit-precompiler-base.cpp <<'EOF'
          #include <deep_jit/runtime/precompiler.hpp>
          int main() {
              deep_jit::Precompiler precompiler(1);
              precompiler.enqueue("test", [] {});
              precompiler.finish();
          }
          EOF
          c++ -std=c++20 -O2 -pthread -Wall -Wextra -Werror -I baseline/include /tmp/deepjit-precompiler-base.cpp -o /tmp/deepjit-precompiler-base
          set +e
          /tmp/deepjit-precompiler-base 2>/tmp/deepjit-precompiler-base.log
          status=$?
          set -e
          cat /tmp/deepjit-precompiler-base.log
          test "$status" = 1
          grep -F 'DeepJIT precompilation failed:' /tmp/deepjit-precompiler-base.log
          grep -F 'No associated state' /tmp/deepjit-precompiler-base.log
      - name: Test C++, runtime and Python binding
        working-directory: patched
        run: python -m pytest -q tests/test_precompiler.py tests/test_precompiler_runtime.py tests/test_executor.py
      - name: Test current pybind11
        working-directory: patched
        run: |
          python -m pip install pybind11==3.0.1
          python -m pytest -q tests/test_precompiler_runtime.py
