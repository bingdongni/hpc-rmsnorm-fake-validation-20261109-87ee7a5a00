name: Tantivy mixed integer and float TopDocs
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  collector:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: quickwit-oss/tantivy
        ref: 0aa896fe29417107ad0bbab502c1a9fd1077f272
        persist-credentials: false
    - name: Reproduce mixed numeric top-1 error and validate collector suite
      run: 'echo 
        | base64 -d | git apply -

        set +e

        cargo test -p tantivy --lib test_mixed_numeric_top_docs_beyond_float_precision
        > /tmp/baseline.log 2>&1

        rc=$?

        set -e

        tail -15 /tmp/baseline.log

        test "$rc" = 101

        grep -F "left: U64(1)" /tmp/baseline.log

        git restore src/collector/sort_key/sort_by_erased_type.rs

        echo 
        | base64 -d | git apply -

        cargo test -p tantivy --lib collector::

        '
