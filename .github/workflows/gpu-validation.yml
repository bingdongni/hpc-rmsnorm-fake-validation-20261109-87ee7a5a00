name: Check VICReg return and test types
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  lightly:
    name: Lightly upstream format and type checks
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: lightly
        persist-credentials: false
        repository: bingdongni/lightly
        ref: 02a70964d01423d9dd5660485774a2e1539752a8
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install the upstream toolchain
      run: 'python -m pip install uv==0.12.3

        make lock-check

        make install-maximal'
      working-directory: lightly
    - name: Run upstream format and type checks
      run: 'make format-check

        make type-check'
      working-directory: lightly
    - name: Check the VICReg loss tests
      run: uv run --frozen pytest -q tests/loss/test_vicreg_loss.py
      working-directory: lightly
