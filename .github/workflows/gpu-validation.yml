name: Verify volumetric packets, table-free FSQ and Bosh3
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux:
    name: Public API comparisons (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      SCIPY_ARRAY_API: '1'
      CUBLAS_WORKSPACE_CONFIG: :4096:8
    steps:
    - &id001
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: wave
        repository: bingdongni/PyTorch-Wavelet-Toolbox
        ref: 747316ef7a9af90dd09842ae53e2fa1e09369c7d
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for wave
      run: git -C wave worktree add --detach ../bwad591 dd2d6f5dffa29625fa443256618484c21f3ab5c7
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: vt
        repository: bingdongni/vector-quantize-pytorch
        ref: c3d225fb269b2e053c3168756b7105d41e411f01
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for vt
      run: git -C vt worktree add --detach ../bvtd591 738009b2786ec65bfce9a07034e6defba10cad77
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: torchode
        repository: bingdongni/torchode
        ref: 3489e8877f11000c686ea279be1e45a80060da1b
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for torchode
      run: git -C torchode worktree add --detach ../btod591 9d397ee179f9d63d7e1e716afe67cceefd6d3d08
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install test dependencies
      run: 'python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install pytest numpy scipy PyWavelets more-itertools pooch torchtyping
        typeguard==2.13.3 einx==0.3.0 torch-einops-utils loguru'
    - name: wave public API comparison and regression tests
      run: 'python validation/compare.py wave bwad591 cpu base

        python validation/compare.py wave wave cpu candidate

        python validation/test_suite.py wave'
    - name: vt public API comparison and regression tests
      run: 'python validation/compare.py vt bvtd591 cpu base

        python validation/compare.py vt vt cpu candidate

        python validation/test_suite.py vt'
    - name: torchode public API comparison and regression tests
      run: 'python validation/compare.py torchode btod591 cpu base

        python validation/compare.py torchode torchode cpu candidate

        python validation/test_suite.py torchode'
  gpu:
    name: Public API comparisons (RTX 4060)
    runs-on:
    - self-hosted
    - Windows
    - X64
    - volume-fsq-bosh3-5fb8b224a7
    timeout-minutes: 40
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      SCIPY_ARRAY_API: '1'
      CUBLAS_WORKSPACE_CONFIG: :4096:8
    steps:
    - *id001
    - name: Mask runner identifiers
      run: 'Write-Output "::add-mask::$env:MASK_MACHINE"

        Write-Output "::add-mask::$env:MASK_USER"'
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: wave
        repository: bingdongni/PyTorch-Wavelet-Toolbox
        ref: 747316ef7a9af90dd09842ae53e2fa1e09369c7d
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for wave
      run: git -C wave worktree add --detach ../bwad591 dd2d6f5dffa29625fa443256618484c21f3ab5c7
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: vt
        repository: bingdongni/vector-quantize-pytorch
        ref: c3d225fb269b2e053c3168756b7105d41e411f01
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for vt
      run: git -C vt worktree add --detach ../bvtd591 738009b2786ec65bfce9a07034e6defba10cad77
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: torchode
        repository: bingdongni/torchode
        ref: 3489e8877f11000c686ea279be1e45a80060da1b
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for torchode
      run: git -C torchode worktree add --detach ../btod591 9d397ee179f9d63d7e1e716afe67cceefd6d3d08
    - name: wave public API comparison and regression tests
      run: '& ''C:\PR\pr-followup-20261117-frontier\deps\Scripts\python.exe'' validation/compare.py
        wave bwad591 cuda base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261117-frontier\deps\Scripts\python.exe'' validation/compare.py
        wave wave cuda candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261117-frontier\deps\Scripts\python.exe'' validation/test_suite.py
        wave'
    - name: vt public API comparison and regression tests
      run: '& ''C:\PR\pr-followup-20261117-frontier\deps\Scripts\python.exe'' validation/compare.py
        vt bvtd591 cuda base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261117-frontier\deps\Scripts\python.exe'' validation/compare.py
        vt vt cuda candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261117-frontier\deps\Scripts\python.exe'' validation/test_suite.py
        vt'
    - name: torchode public API comparison and regression tests
      run: '& ''C:\PR\pr-followup-20261117-frontier\deps\Scripts\python.exe'' validation/compare.py
        torchode btod591 cuda base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261117-frontier\deps\Scripts\python.exe'' validation/compare.py
        torchode torchode cuda candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261117-frontier\deps\Scripts\python.exe'' validation/test_suite.py
        torchode'
