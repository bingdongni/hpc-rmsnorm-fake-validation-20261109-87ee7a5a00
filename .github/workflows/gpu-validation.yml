name: Codex Universal nvm workspace validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: openai/codex-universal
          ref: 47f4f0eb5337083e2f610db0d15558932cb4901d
          path: candidate
          persist-credentials: false
      - name: Install the image's nvm and actual Node runtimes
        shell: bash
        run: |
          set -euo pipefail
          export NVM_DIR="$RUNNER_TEMP/codex-nvm"
          git clone --quiet --depth 1 --branch v0.40.2 https://github.com/nvm-sh/nvm.git "$NVM_DIR"
          . "$NVM_DIR/nvm.sh" --no-use
          nvm install 20
          nvm install 22
          nvm alias default 22
          echo "NVM_DIR=$NVM_DIR" >> "$GITHUB_ENV"
      - name: Reproduce on upstream and verify the patch
        shell: bash
        run: |
          set -euo pipefail
          export CANDIDATE="$GITHUB_WORKSPACE/candidate"
          bash "$GITHUB_WORKSPACE/harness/codex-universal-nvm-validation.sh"
