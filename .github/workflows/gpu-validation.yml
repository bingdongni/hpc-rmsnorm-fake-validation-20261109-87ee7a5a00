name: Fused KL distillation and SGLang router validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpu:
    runs-on: [self-hosted, Windows, X64, fused-kl-router-43c35ec193]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      HF_HUB_OFFLINE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONUTF8: '1'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: validation
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/Liger-Kernel
          ref: 38724f59ad2e89cd3ada16662674942146ae8f96
          persist-credentials: false
          path: liger
      - name: Check Liger source and style
        working-directory: liger
        run: |
          if ((git rev-parse HEAD) -ne '38724f59ad2e89cd3ada16662674942146ae8f96') { throw 'Unexpected Liger commit' }
          & 'C:\PR\sglang-ruff-0151-20261110\bin\ruff.exe' check .
          if ($LASTEXITCODE) { throw 'Lint failed' }
          & 'C:\PR\sglang-ruff-0151-20261110\bin\ruff.exe' format --check .
          if ($LASTEXITCODE) { throw 'Formatting check failed' }
      - name: Fused linear KL tests and public API reference
        working-directory: liger
        run: |
          $env:PYTHONPATH = "$PWD\src;C:\PR\fla-research-deps-20261110;C:\PR\fla-model-deps-20261110"
          $env:CUDA_PATH = 'C:\PR\fla-research-deps-20261110\triton\backends\nvidia'
          $env:CC = 'C:\PR\fla-research-deps-20261110\triton\runtime\tcc\tcc.exe'
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -m pytest test/ops/test_fused_linear_kl_div.py test/transformers/test_fused_linear_kl_div.py -q --tb=short --disable-warnings
          if ($LASTEXITCODE) { throw 'KL tests failed' }
      - name: Compare memory, step time and 30 distillation updates
        working-directory: liger
        run: |
          $env:PYTHONPATH = "$PWD\src;C:\PR\fla-research-deps-20261110;C:\PR\fla-model-deps-20261110"
          $env:CUDA_PATH = 'C:\PR\fla-research-deps-20261110\triton\backends\nvidia'
          $env:CC = 'C:\PR\fla-research-deps-20261110\triton\runtime\tcc\tcc.exe'
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' ..\validation\distillation_probe.py
          if ($LASTEXITCODE) { throw 'Benchmark or optimization parity failed' }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/sglang
          ref: 6a0d8f291031ae0e1c0e015581aaae89a9c5c6ee
          persist-credentials: false
          path: sglang
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /python/sglang/kernels/ops/moe/moe_fused_gate.py
            /python/sglang/kernels/ops/moe/moe_route_warp.py
            /python/sglang/kernels/ops/moe/moe_route_radix.py
            /python/sglang/kernels/kernel_api_logging.py
            /python/sglang/srt/layers/moe/topk.py
            /test/registered/kernels/ops/moe/test_moe_fused_gate.py
            /test/registered/kernels/ops/moe/test_moe_route_warp.py
      - name: Router fallback and pinned-host bias tests with adapter
        working-directory: sglang
        run: |
          if ((git rev-parse HEAD) -ne '6a0d8f291031ae0e1c0e015581aaae89a9c5c6ee') { throw 'Unexpected router commit' }
          $env:SGLANG_ROUTER_SOURCE_ROOT = "$PWD"
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\validation;C:\PR\flashinfer-triton-windows-20261108"
          $env:CUDA_PATH = 'C:\PR\flashinfer-triton-windows-20261108\triton\backends\nvidia'
          $env:CC = 'C:\PR\flashinfer-triton-windows-20261108\triton\runtime\tcc\tcc.exe'
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -m pytest -p sglang_router_test_adapter_20261110 --noconftest -o addopts='' test/registered/kernels/ops/moe -k 'strided_scores_fall_back or aligned_padded_scores_keep_fast_path or cpu_offloaded_bias_falls_back' -q --tb=short
          if ($LASTEXITCODE) { throw 'Router tests failed' }
