name: Masked multitask GP training
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux:
    name: ExactGP likelihood and missing observations (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
    - &id001
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - &id002
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cornellius-gp/gpytorch
        ref: e1302d24cbd334649ada70608cbe98e903a47a83
        path: base
        persist-credentials: false
    - &id003
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/gpytorch
        ref: 1231ab597aebea5e31fdb2c40b9b3487f6600df7
        path: candidate
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install CPU PyTorch and GPyTorch
      run: 'python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install -e ./candidate pytest'
    - name: Compare training objective and gradients
      run: 'python validation/masked_training.py base cpu baseline

        python validation/masked_training.py candidate cpu candidate'
    - name: Run MLL, multitask distribution and missing-data tests
      working-directory: candidate
      run: python -m pytest -q test/mlls test/examples/test_missing_data.py test/distributions/test_multitask_multivariate_normal.py
  gpu:
    name: Masked multitask ExactGP training (RTX 4060)
    runs-on:
    - self-hosted
    - Windows
    - X64
    - masked-training-1712dc1c98
    timeout-minutes: 30
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
    - *id001
    - *id002
    - *id003
    - name: Check baseline on CUDA
      run: '& ''C:\PR\pr-followup-20261116-0100\gp-env\Scripts\python.exe'' validation/masked_training.py
        base cuda baseline

        if ($LASTEXITCODE) { throw ''Training comparison failed'' }'
    - name: Check candidate on CUDA
      run: '& ''C:\PR\pr-followup-20261116-0100\gp-env\Scripts\python.exe'' validation/masked_training.py
        candidate cuda candidate

        if ($LASTEXITCODE) { throw ''Training comparison failed'' }'
