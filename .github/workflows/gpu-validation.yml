name: mcap native feature validation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: foxglove/mcap
        ref: d330d56fe7725bd08b8e93b47480fd04f04d0553
        persist-credentials: false
    - name: Build and test normal feature entry points
      run: "echo \
        \ | base64 -d | git apply -\nset -euxo pipefail\nsudo apt-get -qq update\n\
        sudo apt-get -qq install -y protobuf-compiler\ngit lfs pull\ncargo fmt --all\
        \ -- --check\ncargo test -p mcap-cli --locked\ncargo build -p mcap-cli --locked\n\
        python3 -m venv /tmp/mcap-env\n/tmp/mcap-env/bin/pip install -q mcap\n/tmp/mcap-env/bin/python\
        \ - <<'PY'\n\"\"\"Exercise the Rust CLI over HTTP, inspect actual range traffic\
        \ and reread the output.\"\"\"\nimport random,subprocess,tempfile,threading\n\
        from pathlib import Path\nfrom http.server import HTTPServer,BaseHTTPRequestHandler\n\
        from mcap.writer import Writer,CompressionType,IndexType\nfrom mcap.reader\
        \ import make_reader\ndef read(p):\n    with p.open('rb') as f:\n        r=make_reader(f)\n\
        \        return ([(s.name,c.topic,m.sequence,m.log_time,m.publish_time,m.data)\
        \ for s,c,m in r.iter_messages(topics=['/lidar'])],\n                [(m.name,m.metadata)\
        \ for m in r.iter_metadata()],\n                [(a.name,a.data) for a in\
        \ r.iter_attachments()])\ndef exercise(root,index):\n    infile=root/'recording.mcap';outfile=root/'filtered.mcap'\n\
        \    with infile.open('wb') as out:\n        w=Writer(out,chunk_size=100000,compression=CompressionType.NONE,index_types=IndexType.ALL\
        \ if index else IndexType.NONE)\n        w.start();schema=w.register_schema('sample','text',b'bytes')\n\
        \        ids=[w.register_channel(t,'opaque',schema) for t in ('/lidar','/imu')]\n\
        \        rng=random.Random(283)\n        for i in range(3072):w.add_message(ids[int(i>=64)],i,rng.randbytes(4096),i+10,i)\n\
        \        w.add_metadata('config',{'unit':'mm'});w.add_attachment(12,11,'note','text/plain',b'run\
        \ 1');w.finish()\n    size=infile.stat().st_size; traffic=[]\n    class Serve(BaseHTTPRequestHandler):\n\
        \        def log_message(self,*args):pass\n        def do_HEAD(self):\n  \
        \          self.send_response(200);self.send_header('Content-Length',str(size));self.send_header('Accept-Ranges','bytes');self.end_headers()\n\
        \        def do_GET(self):\n            value=self.headers.get('Range')\n\
        \            start,end=0,size-1\n            if value:\n                left,right=value[6:].split('-')\n\
        \                if left:start=int(left);end=min(size-1,int(right)) if right\
        \ else size-1\n                else:start=max(0,size-int(right))\n       \
        \     traffic.append((start,end,value))\n            self.send_response(206\
        \ if value else 200)\n            self.send_header('Content-Length',str(end-start+1));self.send_header('Accept-Ranges','bytes')\n\
        \            if value:self.send_header('Content-Range',f'bytes {start}-{end}/{size}')\n\
        \            self.end_headers()\n            with infile.open('rb') as handle:handle.seek(start);self.wfile.write(handle.read(end-start+1))\n\
        \    with HTTPServer(('127.0.0.1',0),Serve) as server:\n        t=threading.Thread(target=server.serve_forever,daemon=True);t.start()\n\
        \        try:\n            url=f'http://127.0.0.1:{server.server_port}/input.mcap'\n\
        \            cmd=['target/debug/mcap','filter',url,'-o',str(outfile),'-y','/lidar']\n\
        \            if not index:outfile.write_bytes(b'keep me')\n            p=subprocess.run(cmd,capture_output=True,text=True)\n\
        \            if not index:\n                assert p.returncode!=0 and '--allow-remote-scan'\
        \ in p.stderr and outfile.read_bytes()==b'keep me',p.stderr\n            \
        \    assert all(r for _,_,r in traffic)\n                cmd.insert(1,'--allow-remote-scan');subprocess.run(cmd,check=True)\n\
        \            else:\n                assert p.returncode==0,p.stderr\n    \
        \            transferred=sum(e-s+1 for s,e,_ in traffic)\n               \
        \ assert all(r for _,_,r in traffic) and transferred<size//3,(traffic,size)\n\
        \                print('indexed bytes',transferred,'of',size,'requests',len(traffic))\n\
        \            actual=read(outfile);assert len(actual[0])==64 and actual[1]\
        \ and actual[2]\n            if index:assert actual==read(infile)\n      \
        \      with outfile.open('rb') as f:assert {c.topic for _,c,_ in make_reader(f).iter_messages()}=={'/lidar'}\n\
        \        finally:server.shutdown();t.join()\nwith tempfile.TemporaryDirectory()\
        \ as d:\n    for index in (True,False):exercise(Path(d),index)\n\n\nPY\n\n"
