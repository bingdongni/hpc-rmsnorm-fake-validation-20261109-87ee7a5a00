name: Check 3D packets on the updated PR commit
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux:
    name: Public API comparisons (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      SCIPY_ARRAY_API: '1'
      CUBLAS_WORKSPACE_CONFIG: :4096:8
    steps:
    - &id001
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: wave
        repository: bingdongni/PyTorch-Wavelet-Toolbox
        ref: 9930f4825b35c05133b0eae5d7f88ff30e75b2bb
        fetch-depth: 3
        persist-credentials: false
    - name: Check out upstream parent
      run: git -C wave worktree add --detach ../w8645c0 dd2d6f5dffa29625fa443256618484c21f3ab5c7
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install runtime and CI dependencies
      run: 'python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install ./wave[tests] mypy ruff doc8 matplotlib'
    - name: Compare against PyWavelets and check gradients
      run: 'python validation/compare.py wave w8645c0 cpu base

        python validation/compare.py wave wave cpu candidate

        python validation/test_suite.py wave'
    - name: Check typing and project lint
      working-directory: wave
      run: 'python -m mypy --strict --ignore-missing-imports --no-warn-return-any
        --explicit-package-bases src/ptwt/packets.py tests/test_packets_3d.py

        python -m ruff check src tests noxfile.py

        doc8 --max-line-length 120 docs/'
    - name: Run the upstream fast-test selection
      working-directory: wave
      run: python -m pytest -q -m 'not slow'
  gpu:
    name: Public API comparisons (RTX 4060)
    runs-on:
    - self-hosted
    - Windows
    - X64
    - volumetric-packets-typed-3f628e979e
    timeout-minutes: 40
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      SCIPY_ARRAY_API: '1'
      CUBLAS_WORKSPACE_CONFIG: :4096:8
    steps:
    - *id001
    - name: Mask runner identifiers
      run: 'Write-Output "::add-mask::$env:MASK_MACHINE"

        Write-Output "::add-mask::$env:MASK_USER"'
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: wave
        repository: bingdongni/PyTorch-Wavelet-Toolbox
        ref: 9930f4825b35c05133b0eae5d7f88ff30e75b2bb
        fetch-depth: 3
        persist-credentials: false
    - name: Check out upstream parent
      run: git -C wave worktree add --detach ../w8645c0 dd2d6f5dffa29625fa443256618484c21f3ab5c7
    - name: Compare against PyWavelets and check gradients
      run: '& ''C:\PR\pr-followup-20261117-frontier\deps\Scripts\python.exe'' validation/compare.py
        wave w8645c0 cuda base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261117-frontier\deps\Scripts\python.exe'' validation/compare.py
        wave wave cuda candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261117-frontier\deps\Scripts\python.exe'' validation/test_suite.py
        wave'
