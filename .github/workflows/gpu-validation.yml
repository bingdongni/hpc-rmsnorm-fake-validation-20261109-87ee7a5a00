name: Tantivy dynamic attribute sorting baseline
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  sorting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v4
      with:
        repository: quickwit-oss/tantivy
        ref: 0aa896fe29417107ad0bbab502c1a9fd1077f272
        persist-credentials: false
    - name: Verify the reported public search APIs
      run: "cat > tests/selection_json_sort.rs <<'RUST'\nuse tantivy::collector::{sort_key::SortByErasedType,\
        \ TopDocs};\nuse tantivy::indexer::NoMergePolicy;\nuse tantivy::query::AllQuery;\n\
        use tantivy::schema::{Schema, FAST};\nuse tantivy::{Index, Order, TantivyDocument,\
        \ TantivyError};\n\n#[test]\nfn dynamic_attributes_across_three_segments()\
        \ -> tantivy::Result<()> {\n    let mut builder = Schema::builder();\n   \
        \ builder.add_json_field(\"attrs\", FAST);\n    let schema = builder.build();\n\
        \    let index = Index::create_in_ram(schema.clone());\n    let mut writer\
        \ = index.writer_with_num_threads(1, 50_000_000)?;\n    writer.set_merge_policy(Box::new(NoMergePolicy));\n\
        \    for doc in [\n        r#\"{\"attrs\":{\"due\":30,\"prio\":\"b\"}}\"#,\n\
        \        r#\"{\"attrs\":{\"due\":10,\"prio\":\"a\"}}\"#,\n        r#\"{\"\
        attrs\":{\"prio\":\"c\"}}\"#,\n    ] {\n        writer.add_document(TantivyDocument::parse_json(&schema,\
        \ doc).unwrap())?;\n        writer.commit()?;\n    }\n    let reader = index.reader()?;\n\
        \    let searcher = reader.searcher();\n    assert_eq!(searcher.segment_readers().len(),\
        \ 3);\n    let strings = TopDocs::with_limit(3).order_by_string_fast_field(\"\
        attrs.prio\", Order::Asc);\n    let keys: Vec<_> = searcher.search(&AllQuery,\
        \ &strings)?.into_iter().map(|(k,_)| k.unwrap()).collect();\n    assert_eq!(keys,\
        \ [\"a\", \"b\", \"c\"]);\n    let numeric = TopDocs::with_limit(3).order_by_fast_field::<i64>(\"\
        attrs.due\", Order::Asc);\n    let typed_error = searcher.search(&AllQuery,\
        \ &numeric).unwrap_err();\n    assert!(matches!(typed_error, TantivyError::FieldNotFound(ref\
        \ f) if f == \"attrs.due\"));\n    let dynamic = TopDocs::with_limit(3).order_by((SortByErasedType::for_field(\"\
        attrs.due\"), Order::Asc));\n    let missing = searcher.search(&AllQuery,\
        \ &dynamic).unwrap_err();\n    assert!(missing.to_string().contains(\"Fast\
        \ field not available\"), \"{missing}\");\n    println!(\"String sort returned\
        \ {keys:?}; numeric sort returned {typed_error}; dynamic sort returned {missing}\"\
        );\n    Ok(())\n}\nRUST\ncargo test -p tantivy --test selection_json_sort\
        \ -- --nocapture"
