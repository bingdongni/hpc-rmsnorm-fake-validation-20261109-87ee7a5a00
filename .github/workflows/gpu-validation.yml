name: Test structured products, grouped attention and Lobatto quadrature
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  cpu:
    timeout-minutes: 45
    env: &id005
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
    name: CPU public API and analytic tests
    runs-on: ubuntu-latest
    steps:
    - &id001
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - &id002
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: lin
        persist-credentials: false
        repository: bingdongni/linear_operator
        ref: 5c3ded875c30ab18d0f2989a0e6b6e1e44e11a5d
        fetch-depth: 2
    - &id003
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: xt
        persist-credentials: false
        repository: bingdongni/x-transformers
        ref: b6adf0f2c4ea3d933527dc1998c9215be6921749
        fetch-depth: 2
    - &id004
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: quad
        persist-credentials: false
        repository: bingdongni/torchquad
        ref: 8935090d8b04109e7929563bc17777e8ef4ad185
        fetch-depth: 2
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install PyTorch CPU and projects
      run: 'python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install ./xt ./lin ./quad pytest'
    - name: Compare upstream and candidate
      run: 'git -C lin worktree add --detach ../base_lin 1c5e24bc774352461be818b9d347e93ddee7d7f7

        python validation/compare.py lin base_lin cpu base

        python validation/compare.py lin lin cpu candidate

        python validation/test_suite.py lin

        git -C xt worktree add --detach ../base_xt b840af1a56690c08cb246a53c6582d39e52cb64b

        python validation/compare.py xt base_xt cpu base

        python validation/compare.py xt xt cpu candidate

        python validation/test_suite.py xt

        git -C quad worktree add --detach ../base_quad 4d39f8950d1e35c0b06e2a35f3c4612985c541df

        python validation/compare.py quad base_quad cpu base

        python validation/compare.py quad quad cpu candidate

        python validation/test_suite.py quad'
  gpu:
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
    name: RTX 4060 public API and regression tests
    runs-on:
    - self-hosted
    - Windows
    - X64
    - grouped-toeplitz-lobatto-3e64e7aaa9
    steps:
    - name: Mask runner identifiers
      run: 'Write-Output "::add-mask::$env:MASK_MACHINE"

        Write-Output "::add-mask::$env:MASK_USER"'
    - *id001
    - *id002
    - *id003
    - *id004
    - name: Compare upstream and candidate
      run: 'git -C lin worktree add --detach ../base_lin 1c5e24bc774352461be818b9d347e93ddee7d7f7

        & ''C:\PR\pr-followup-20261117-2120\env\Scripts\python.exe'' validation/compare.py
        lin base_lin cuda base

        if ($LASTEXITCODE) { throw ''Validation failed'' }

        & ''C:\PR\pr-followup-20261117-2120\env\Scripts\python.exe'' validation/compare.py
        lin lin cuda candidate

        if ($LASTEXITCODE) { throw ''Validation failed'' }

        & ''C:\PR\pr-followup-20261117-2120\env\Scripts\python.exe'' validation/test_suite.py
        lin

        if ($LASTEXITCODE) { throw ''Validation failed'' }

        git -C xt worktree add --detach ../base_xt b840af1a56690c08cb246a53c6582d39e52cb64b

        & ''C:\PR\pr-followup-20261117-2120\env\Scripts\python.exe'' validation/compare.py
        xt base_xt cuda base

        if ($LASTEXITCODE) { throw ''Validation failed'' }

        & ''C:\PR\pr-followup-20261117-2120\env\Scripts\python.exe'' validation/compare.py
        xt xt cuda candidate

        if ($LASTEXITCODE) { throw ''Validation failed'' }

        & ''C:\PR\pr-followup-20261117-2120\env\Scripts\python.exe'' validation/test_suite.py
        xt

        if ($LASTEXITCODE) { throw ''Validation failed'' }

        git -C quad worktree add --detach ../base_quad 4d39f8950d1e35c0b06e2a35f3c4612985c541df

        & ''C:\PR\pr-followup-20261117-2120\env\Scripts\python.exe'' validation/compare.py
        quad base_quad cuda base

        if ($LASTEXITCODE) { throw ''Validation failed'' }

        & ''C:\PR\pr-followup-20261117-2120\env\Scripts\python.exe'' validation/compare.py
        quad quad cuda candidate

        if ($LASTEXITCODE) { throw ''Validation failed'' }

        & ''C:\PR\pr-followup-20261117-2120\env\Scripts\python.exe'' validation/test_suite.py
        quad

        if ($LASTEXITCODE) { throw ''Validation failed'' }'
  science:
    timeout-minutes: 45
    env: *id005
    name: Lobatto ${{ matrix.backend }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend:
        - jax
        - tensorflow
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: quad
        persist-credentials: false
        repository: bingdongni/torchquad
        ref: 8935090d8b04109e7929563bc17777e8ef4ad185
        fetch-depth: 2
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install analytic test dependencies
      run: python -m pip install ./quad pytest ${{ matrix.backend }}
    - name: Check the endpoint rule against the analytic collection
      working-directory: quad/tests
      run: PYTHONPATH=.. python -m pytest -q gauss_test.py -k "lobatto_${{ matrix.backend
        }}"
