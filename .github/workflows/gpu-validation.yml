name: Distributed loss normalization validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    runs-on: [self-hosted, Windows, X64, unirl-validation-d43dbd28de]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Tencent-Hunyuan/UniRL
          ref: 5fe89b3d1aedc9f0dde8f1ce94c74dc1721e4422
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Tencent-Hunyuan/UniRL
          ref: 5fe89b3d1aedc9f0dde8f1ce94c74dc1721e4422
          path: candidate
          persist-credentials: false
      - name: Apply and verify candidate privately
        env:
          UNIRL_PATCH_B64: ${{ secrets.UNIRL_PATCH_B64 }}
        run: |
          $env:UNIRL_PROBE_ROOT = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' (Join-Path $env:GITHUB_WORKSPACE 'harness/unirl_apply_validation_patch.py')
          if ($LASTEXITCODE -ne 0) { throw 'Candidate verification failed' }
      - name: Confirm baseline gradient mismatch
        run: |
          $env:UNIRL_PROBE_ROOT = Join-Path $env:GITHUB_WORKSPACE 'baseline'
          $env:PYTHONPATH = "$env:UNIRL_PROBE_ROOT;C:\PR\unirl-research-deps-20261110"
          $env:UNIRL_PROBE_DEVICE = 'cuda'
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -c "import torch; assert torch.cuda.is_available(); print('GPU:', torch.cuda.get_device_name(0), 'PyTorch:', torch.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'CUDA unavailable' }
          $output = & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' (Join-Path $env:GITHUB_WORKSPACE 'harness/unirl_gloo_probe.py') 2>&1 | Out-String
          $code = $LASTEXITCODE
          if ($code -ne 1 -or $output -notmatch 'Expected -1.0 but got -0.5') { throw 'Unexpected baseline result' }
          Write-Host 'Baseline mismatch reproduced: expected -1.0, got -0.5'
          exit 0
      - name: Compare CUDA gradients across two Gloo processes
        run: |
          $env:UNIRL_PROBE_ROOT = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $env:PYTHONPATH = "$env:UNIRL_PROBE_ROOT;C:\PR\unirl-research-deps-20261110"
          $env:UNIRL_PROBE_DEVICE = 'cuda'
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' (Join-Path $env:GITHUB_WORKSPACE 'harness/unirl_gloo_probe.py')
          if ($LASTEXITCODE -ne 0) { throw 'Two-process CUDA comparison failed' }
      - name: Measure CPU Gloo loss scaling
        run: |
          $env:UNIRL_PROBE_ROOT = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $env:PYTHONPATH = "$env:UNIRL_PROBE_ROOT;C:\PR\unirl-research-deps-20261110"
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' (Join-Path $env:GITHUB_WORKSPACE 'harness/unirl_scale_benchmark.py')
          if ($LASTEXITCODE -ne 0) { throw 'Scaling benchmark failed' }
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Tencent-Hunyuan/UniRL
          ref: 5fe89b3d1aedc9f0dde8f1ce94c74dc1721e4422
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply and verify candidate privately
        env:
          UNIRL_PATCH_B64: ${{ secrets.UNIRL_PATCH_B64 }}
          UNIRL_PROBE_ROOT: ${{ github.workspace }}/candidate
        run: python harness/unirl_apply_validation_patch.py
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.13.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pillow pre-commit
      - name: Compare gradients across two CPU Gloo processes
        env:
          UNIRL_PROBE_ROOT: ${{ github.workspace }}/candidate
          PYTHONPATH: ${{ github.workspace }}/candidate
          UNIRL_PROBE_DEVICE: cpu
        run: python harness/unirl_gloo_probe.py
      - name: Run project pre-commit checks
        working-directory: candidate
        env:
          SKIP: no-commit-to-branch
        run: |
          git add unirl
          git -c user.name='Validation' -c user.email='validation@example.invalid' commit -m 'Validate candidate'
          pre-commit run --from-ref 5fe89b3d1aedc9f0dde8f1ce94c74dc1721e4422 --to-ref HEAD
