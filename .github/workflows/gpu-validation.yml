name: DeepSeek Superagent pagination validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [candidate]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: deepseek-ai/dsh-superagent-prototype
          ref: 8c32a9dc5d72c033816c6a8110b37f40cf94fba4
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Apply the candidate patch
        if: matrix.variant == 'candidate'
        shell: bash
        run: |
          test "$(git -C candidate rev-parse HEAD)" = 8c32a9dc5d72c033816c6a8110b37f40cf94fba4
          git -C candidate apply --check "$GITHUB_WORKSPACE/harness/deepseek-pagination.patch"
          git -C candidate apply "$GITHUB_WORKSPACE/harness/deepseek-pagination.patch"
      - name: Install pinned dependencies
        working-directory: candidate
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Type check
        working-directory: candidate
        run: pnpm typecheck
      - name: Build
        working-directory: candidate
        run: pnpm build
      - name: Test except the baseline Feishu timing failure
        working-directory: candidate
        run: >-
          pnpm exec vitest run --maxWorkers=1
          --testNamePattern='^(?!.*takes in the event lines it reads, records each chat as direct or not, and reports a malformed line without stopping)'
