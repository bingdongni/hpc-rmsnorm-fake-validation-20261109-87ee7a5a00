name: Native PyVRP constrained relocation benchmark
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: PyVRP/PyVRP
        ref: b9225e43ec51cc1f41fddeb75e7ba22b8440cf07
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Build and measure RelocatePickup and RelocateDelivery
      run: "cat > pyvrp/cpp/search/RideTimeExperiment.h <<'TASK_FILE'\n// Benchmark\
        \ instrumentation for the two intra-route shipment operators on lrc206.\n\
        // IDs are positions in the incumbent, including separate start and end depots.\n\
        #pragma once\n#include \"Route.h\"\n#include <algorithm>\n#include <functional>\n\
        #include <map>\n#include <numeric>\n#include <queue>\n#include <stdexcept>\n\
        #include <vector>\n\nnamespace pyvrp::search::ride_experiment {\nusing I =\
        \ std::int64_t;\nusing Arc = std::pair<int, I>;\nusing Graph = std::vector<std::vector<Arc>>;\n\
        using Times = std::vector<I>;\n\nstruct Reference {\n    std::vector<int>\
        \ lookup, locations, previous, pending;\n    Times pendingWitness;\n    std::vector<I>\
        \ service;\n    Graph fixed;\n    Times witness;\n};\ninline int mode = 0;\n\
        inline Times caps;\ninline std::map<Route const *, Reference> references;\n\
        inline I checked = 0, rejected = 0;\n\ninline void configure(int newMode,\
        \ Times limits) {\n    mode = newMode;\n    caps = std::move(limits);\n  \
        \  references.clear();\n    checked = rejected = 0;\n}\ninline std::vector<I>\
        \ statistics() { return {checked, rejected}; }\n\ntemplate<class Weight>\n\
        inline Times full(Graph const &fixed, std::vector<int> const &prev,\n    \
        \              Weight const &weight) {\n    int n = static_cast<int>(fixed.size());\n\
        \    Times pot(n, 0);\n    for (int pass = 0; pass < n; ++pass) {\n      \
        \  bool changed = false;\n        auto relax = [&](int u,int v,I w) {\n  \
        \          if (pot[u]+w < pot[v]) { pot[v]=pot[u]+w; changed=true; }\n   \
        \     };\n        for (int u = 0; u < n; ++u)\n            for (auto [v,w]\
        \ : fixed[u]) relax(u,v,w);\n        for (int u = n-1; u >= 0; --u)\n    \
        \        if (prev[u]>=0) relax(u,prev[u],weight(u,prev[u]));\n        if (!changed)\
        \ return pot;\n    }\n    return {};\n}\n\ntemplate<class Weight>\ninline\
        \ bool incremental(Reference &ref, std::vector<int> const &old,\n        \
        \                std::vector<int> const &next,\n                        Weight\
        \ const &weight) {\n    bool reusable=true;\n    for (int u=0;u<static_cast<int>(next.size());++u)\
        \ {\n        int pred=next[u];\n        if (pred>=0 && old[u]!=pred && ref.witness[pred]>ref.witness[u]+weight(u,pred))\
        \ {\n            reusable=false;break;\n        }\n    }\n    if (reusable)\
        \ {\n        ref.pending=next;\n        ref.pendingWitness=ref.witness;\n\
        \        return true;\n    }\n    Times pot = ref.witness;\n    std::vector<int>\
        \ active = old;\n    for (size_t i=0; i<active.size(); ++i)\n        if (old[i]!=next[i])\
        \ active[i]=-1;\n    for (int u=0; u<static_cast<int>(next.size()); ++u) {\n\
        \        int v=next[u];\n        if (v<0 || active[u]==v) continue;\n    \
        \    I deficit=pot[v]-pot[u]-weight(u,v);\n        if (deficit>0) {\n    \
        \        using Entry=std::pair<I,int>;\n            std::priority_queue<Entry,std::vector<Entry>,std::greater<Entry>>\
        \ queue;\n            Times dist(pot.size(),deficit);\n            dist[v]=0;\n\
        \            queue.emplace(0,v);\n            while (!queue.empty()) {\n \
        \               auto [d,k]=queue.top(); queue.pop();\n                if (d!=dist[k])\
        \ continue;\n                if (k==u) return false;\n                auto\
        \ visit = [&](int target,I cost) {\n                    I reduced=d+cost+pot[k]-pot[target];\n\
        \                    if (reduced<dist[target]) {\n                       \
        \ dist[target]=reduced; queue.emplace(reduced,target);\n                 \
        \   }\n                };\n                for (auto [target,cost]:ref.fixed[k])\
        \ visit(target,cost);\n                if (active[k]>=0) visit(active[k],weight(k,active[k]));\n\
        \            }\n            for (size_t i=0; i<pot.size(); ++i) pot[i]-=deficit-dist[i];\n\
        \        }\n        active[u]=v;\n    }\n    ref.pending=next; ref.pendingWitness=std::move(pot);\n\
        \    return true;\n}\n\ninline bool permits(ProblemData const &data, Route\
        \ const &route,\n                    int moving, int before) {\n    if (!mode)\
        \ return true;\n    ++checked;\n    int end=static_cast<int>(route.size());\n\
        \    auto &ref=references[&route];\n    auto const &matrix=data.durationMatrix(route.profile());\n\
        \    auto weight = [&](int u,int v)->I {\n        return -ref.service[v]-matrix(ref.locations[v],ref.locations[u]).get();\n\
        \    };\n    if (ref.locations.empty()) {\n        ref.lookup.assign(2*caps.size(),-1);\n\
        \        ref.fixed.resize(end+1);\n        std::vector<int> pickup(caps.size(),-1);\n\
        \        for (int i=0;i<end;++i) {\n            auto node=route[i];\n    \
        \        auto add=[&](auto const &s) {\n                ref.locations.push_back(s.location);ref.service.push_back(s.serviceDuration.get());\n\
        \                ref.fixed[end].emplace_back(i,s.twLate.get());\n        \
        \        ref.fixed[i].emplace_back(end,-s.twEarly.get());\n            };\n\
        \            if (!node->isDepot())\n                ref.lookup.at(2*node->idx()+node->isDelivery())=i;\n\
        \            if (node->isDepot()) add(data.depot(node->idx()));\n        \
        \    else if (node->isPickup()) {\n                pickup.at(node->idx())=i;add(data.shipment(node->idx()).pickup);\n\
        \            } else {\n                int p=pickup.at(node->idx());\n   \
        \             if (p<0) throw std::runtime_error(\"Unpaired delivery in benchmark\"\
        );\n                add(data.shipment(node->idx()).delivery);\n          \
        \      ref.fixed[p].emplace_back(i,ref.service[p]+caps.at(node->idx()));\n\
        \            }\n        }\n    }\n    std::vector<int> order(end), old(end+1,-1);\n\
        \    order.front()=0; order.back()=end-1;\n    for (int i=1;i<end-1;++i) {\n\
        \        auto node=route[i];\n        int id=ref.lookup.at(2*node->idx()+node->isDelivery());\n\
        \        if (id<0) throw std::runtime_error(\"Membership changed in intra-route\
        \ benchmark\");\n        order[i]=id;\n    }\n    for (int i=1;i<end;++i)\
        \ old[order[i]]=order[i-1];\n    if (mode>=2 && old!=ref.previous) {\n   \
        \     if (old==ref.pending) ref.witness=ref.pendingWitness;\n        else\
        \ ref.witness=full(ref.fixed,old,weight);\n        ref.previous=old;\n   \
        \ }\n    int moved=order[moving];\n    order.erase(order.begin()+moving);\n\
        \    order.insert(order.begin()+before-(moving<before),moved);\n    std::vector<int>\
        \ prev(end+1,-1);\n    for (int i=1;i<end;++i) prev[order[i]]=order[i-1];\n\
        \    bool feasible;\n    if (mode==1 || ref.witness.empty()) feasible=!full(ref.fixed,prev,weight).empty();\n\
        \    else feasible=incremental(ref,old,prev,weight);\n    if (mode==3 && feasible!=!full(ref.fixed,prev,weight).empty())\n\
        \        throw std::runtime_error(\"Native incremental decision disagrees\
        \ with full rebuild\");\n    rejected+=!feasible;\n    return feasible;\n\
        }\n}\nTASK_FILE\ncat > /tmp/instrument.py <<'TASK_FILE'\nfrom pathlib import\
        \ Path\nf=Path('pyvrp/cpp/search')\nfor name,src,dest in [('RelocatePickup','U->pos()','node->pos()'),('RelocateDelivery','delivery->pos()','after->pos()+1')]:\n\
        \    path=f/(name+'.cpp');s=path.read_text()\n    assert s.count('if (deltaCost\
        \ < -TOL)')==1\n    s='#include \"RideTimeExperiment.h\"\\n'+s.replace('if\
        \ (deltaCost < -TOL)',f'if (deltaCost < -TOL && ride_experiment::permits(data,\
        \ *route, {src}, {dest}))')\n    path.write_text(s)\npath=f/'bindings.cpp';s=path.read_text().replace('\
        \    pyvrp::registerLogger(\"pyvrp.search\");','''    m.def(\"_ride_bench_configure\"\
        , &pyvrp::search::ride_experiment::configure);\n    m.def(\"_ride_bench_stats\"\
        , &pyvrp::search::ride_experiment::statistics);\n    pyvrp::registerLogger(\"\
        pyvrp.search\");''');path.write_text('#include \"RideTimeExperiment.h\"\\\
        n'+s)\nTASK_FILE\npython /tmp/instrument.py\npython -m pip install \"pyvrp==0.14.1\"\
        \ meson ninja docblock pybind11\nmeson setup build-native --buildtype release\
        \ -Db_lto=false -Dpython.platlibdir=\"$PWD\" -Dpython.purelibdir=\"$PWD\"\n\
        meson compile -C build-native -j 3\nmeson install -C build-native --skip-subprojects\n\
        cat > /tmp/benchmark_instances.py <<'TASK_FILE'\n\"\"\"Compare the real PyVRP\
        \ single-route shipment operators on identical starting solutions.\"\"\"\n\
        import json,statistics,time,sys\nfrom pathlib import Path\nimport pyvrp as\
        \ p\nfrom pyvrp.stop import MaxIterations\nfrom pyvrp import search\nfrom\
        \ pyvrp.search import _search\nfrom search_benchmark import prepare\nfrom\
        \ ride_time import RouteBounds\n\ndef dataset():\n    data=p.read(sys.argv[1])\n\
        \    seeds=[2,7,17]\n    inputs=[]\n    for seed in seeds:\n        _search._ride_bench_configure(0,[])\n\
        \        sol=p.solve(data,MaxIterations(100),seed=seed,collect_stats=False).best\n\
        \        groups=prepare(data,sol,seed)\n        routes=[];caps=[0]*data.num_shipments\n\
        \        for native,(graph,_,_,_,order) in zip(sol.routes(),groups,strict=True):\n\
        \            sch=native.schedule()\n            for pick,delivery,cap in graph.limits:caps[sch[pick].idx]=cap\n\
        \            routes.append(p.Route(data,[p.Activity(sch[i].type,sch[i].idx)\
        \ for i in order[1:-1]],native.vehicle_type()))\n        initial=p.Solution(data,routes);assert\
        \ initial.is_feasible()\n        inputs.append((seed,initial,caps,groups,sol))\n\
        \    return data,inputs\n\ndef main():\n    data,inputs=dataset()\n    ce=p.CostEvaluator([10000.0],10000.0,10000.0)\n\
        \    neighbors=search.compute_neighbours(data)\n    def run(mode,step):\n\
        \        ends=[];duration=0;checks=rejects=0\n        for seed,solution,caps,graphs,original\
        \ in inputs:\n            ls=search.LocalSearch(data,p.RandomNumberGenerator(seed+step),neighbors)\n\
        \            ls.add_operator(search.RelocatePickup(data));ls.add_operator(search.RelocateDelivery(data))\n\
        \            _search._ride_bench_configure(mode,caps)\n            t=time.perf_counter_ns();out=ls(solution,ce,True);duration+=time.perf_counter_ns()-t\n\
        \            c,r=_search._ride_bench_stats();checks+=c;rejects+=r\n      \
        \      assert out.is_feasible()\n            ranges={frozenset(str(a) for\
        \ a in route.schedule()[1:-1]):(route,graph)\n                    for route,(graph,*_)\
        \ in zip(original.routes(),graphs,strict=True)}\n            signature=[]\n\
        \            for route in out.routes():\n                seq=[str(x) for x\
        \ in route.schedule()[1:-1]];signature.append(seq)\n                if mode:\n\
        \                    ref,graph=ranges[frozenset(seq)]\n                  \
        \  index={str(x):i for i,x in enumerate(ref.schedule()[1:-1],1)}\n       \
        \             order=(0,*(index[x] for x in seq),len(graph.stops)-1)\n    \
        \                state=graph.full(order);assert state and graph.valid(state)\n\
        \            ends.append((out.distance(),signature))\n        return duration,(ends,checks,rejects)\n\
        \    # Audit decisions inside the C++ operator and independently certify each\
        \ exported route in Python.\n    for step in range(8):\n        assert run(3,step)[1]==run(1,step)[1]\n\
        \    batch=25;rounds=9;metrics={m:[] for m in range(3)};counts={}\n    for\
        \ i in range(rounds):\n        for mode in [(i+j)%3 for j in range(3)]:\n\
        \            elapsed=0;examined=denied=objective=0\n            for j in range(batch):\n\
        \                ns,(ends,cc,rr)=run(mode,j%8);elapsed+=ns;examined+=cc;denied+=rr\n\
        \                objective+=sum(v for v,_ in ends)\n            metrics[mode].append(elapsed/1e6);counts[mode]=dict(checked=examined,rejected=denied,sum_distance=objective)\n\
        \    assert counts[1]==counts[2]\n    names=['cap_disabled','full','incremental']\n\
        \    print(json.dumps(dict(instance=Path(sys.argv[1]).stem,native_calls_per_round=len(inputs)*batch,rounds=rounds,median_ms={names[k]:round(statistics.median(v),3)\
        \ for k,v in metrics.items()},counts={names[k]:v for k,v in counts.items()},times_ms=metrics)))\n\
        if __name__=='__main__':main()\nTASK_FILE\ncat > /tmp/ride_time.py <<'TASK_FILE'\n\
        \"\"\"Exact service-start feasibility for fixed-order pickup/delivery route\
        \ edits.\"\"\"\nfrom dataclasses import dataclass\nfrom heapq import heappop,\
        \ heappush\nfrom itertools import chain, pairwise\n\n\n@dataclass\nclass Schedule:\n\
        \    order: tuple\n    previous: list  # backward travel constraint indexed\
        \ by destination stop\n    potential: list\n\n\nclass RouteBounds:\n    def\
        \ __init__(self, stops, duration, limits):\n        self.stops = stops\n \
        \       self.duration = duration\n        self.limits = limits\n        origin\
        \ = len(stops)\n        self.static = [[] for _ in range(origin + 1)]\n  \
        \      for node, stop in enumerate(stops):\n            self.static[origin].append((node,\
        \ stop.tw_late))\n            self.static[node].append((origin, -stop.tw_early))\n\
        \        for pickup, delivery, cap in limits:\n            self.static[pickup].append((delivery,\
        \ stops[pickup].service_duration + cap))\n\n    def edge(self, first, second):\n\
        \        return (first, -self.stops[first].service_duration - self.duration[first][second])\n\
        \n    def full(self, order):\n        # Rebuild all difference constraints.\
        \ A relaxation on pass |V| implies a negative cycle.\n        n = len(self.static)\n\
        \        edges = [(u, v, w) for u, bounds in enumerate(self.static) for v,\
        \ w in bounds]\n        previous = [None] * n\n        for a, b in reversed(list(pairwise(order))):\n\
        \            previous[b] = self.edge(a, b)\n            edges.append((b, *previous[b]))\n\
        \        pot = [0] * n\n        for _ in range(n):\n            changed =\
        \ False\n            for u, v, weight in edges:\n                if pot[u]\
        \ + weight < pot[v]:\n                    pot[v] = pot[u] + weight\n     \
        \               changed = True\n            if not changed:\n            \
        \    return Schedule(order, previous, pot)\n        return None\n\n    def\
        \ edit(self, old, order):\n        \"\"\"Keep the feasible potential after\
        \ cuts, then repair only violated new arcs.\"\"\"\n        previous = old.previous.copy()\n\
        \        potential = old.potential.copy()\n        if order:\n           \
        \ previous[order[0]] = None\n        added = []\n        for a, b in pairwise(order):\n\
        \            if previous[b] is None or previous[b][0] != a:\n            \
        \    previous[b] = None\n                added.append((b, self.edge(a, b)))\n\
        \        for u, (v, weight) in added:\n            deficit = potential[v]\
        \ - potential[u] - weight\n            if deficit > 0:\n                #\
        \ Before this insertion all reduced costs are nonnegative.\n             \
        \   # A return path shorter than deficit closes a negative cycle.\n      \
