name: Validate segmented-uem-style algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: segmented-uem-style
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: pyannote/pyannote-metrics
        ref: 2b02d04586bad4dedb7ad05ea01a987c7021bf12
        persist-credentials: false
    - name: Apply verified change
      shell: bash
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        git diff --check'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run tests
      shell: bash
      run: 'set -euo pipefail

        export MPLBACKEND=Agg

        python -m pip install ".[test,cli,plot,transcription]" ruff

        ruff check src tests

        ruff format --check src tests

        python -m pytest -q tests


        echo 
        | base64 -d > /tmp/independent-check.py

        python /tmp/independent-check.py

        '
