name: cad native feature validation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: gumyr/build123d
        ref: 9276a3b15c1dcf2cfcda879b2dff316cafd5ca63
        persist-credentials: false
    - name: Build and test normal feature entry points
      run: 'echo 
        | base64 -d | git apply -

        set -euxo pipefail

        python3 -m venv /tmp/cad-env

        source /tmp/cad-env/bin/activate

        pip install -q -e ''.[development,stubs]''

        python -m pytest -q -n 2 --benchmark-disable

        mypy --config-file mypy.ini src/build123d

        pylint --rcfile=.pylintrc --fail-under=9.5 --fail-on=E,F src/build123d


        '
