name: ColossalAI sharded AdamW resume
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  checkpoint:
    name: ColossalAI AdamW sharded checkpoint round trip (RTX 4060)
    runs-on:
    - self-hosted
    - Windows
    - X64
    - adamw-resume-5b20342450
    timeout-minutes: 30
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: hpcaitech/ColossalAI
        ref: 297c8cf6d91cb0bff795cba961d3aea1e66fa370
        path: base
        sparse-checkout: 'colossalai

          tests/test_checkpoint_io'
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/ColossalAI
        ref: 1eccd14af127cdb91417d9e7f00c07c6ba2e1805
        path: candidate
        sparse-checkout: 'colossalai

          tests/test_checkpoint_io'
        persist-credentials: false
    - name: Show the upstream step device after loading
      run: '& ''C:\PR\pr-followup-20261115-2326\clip-env\Scripts\python.exe'' validation/colossal_gpu_check.py
        base candidate baseline

        if ($LASTEXITCODE) { throw ''Checkpoint validation failed'' }'
    - name: Compare the resumed update and both moments
      run: '& ''C:\PR\pr-followup-20261115-2326\clip-env\Scripts\python.exe'' validation/colossal_gpu_check.py
        candidate candidate candidate

        if ($LASTEXITCODE) { throw ''Checkpoint validation failed'' }'
