name: torchft quantization large-index regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    runs-on: [self-hosted, Windows, X64, torchft-large-index-dc1dfe3adf]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    env:
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONIOENCODING: utf-8
      PYTHONPATH: 'C:\PR\fla-research-deps-20261110;C:\PR\torchft-test-deps-20261111'
      CC: 'C:\PR\fla-research-deps-20261110\triton\runtime\tcc\tcc.exe'
      CUDA_PATH: 'C:\PR\fla-research-deps-20261110\triton\backends\nvidia'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: meta-pytorch/torchft
          ref: 43e3b6d3557194ff1eea3c3217e94ef7f6308bc2
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: meta-pytorch/torchft
          ref: 43e3b6d3557194ff1eea3c3217e94ef7f6308bc2
          path: candidate
          persist-credentials: false
      - name: Apply candidate and validate on CUDA
        run: |
          if ((git -C baseline rev-parse HEAD) -ne '43e3b6d3557194ff1eea3c3217e94ef7f6308bc2') { throw 'Wrong baseline' }
          if ((git -C candidate rev-parse HEAD) -ne '43e3b6d3557194ff1eea3c3217e94ef7f6308bc2') { throw 'Wrong candidate base' }
          $patch = Join-Path $env:GITHUB_WORKSPACE 'harness/torchft-large-index.patch'
          git -C candidate apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch does not apply cleanly' }
          git -C candidate apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch application failed' }
          $env:TORCHFT_BASE = Join-Path $env:GITHUB_WORKSPACE 'baseline'
          $env:TORCHFT_CANDIDATE = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $env:TORCHFT_HARNESS = Join-Path $env:GITHUB_WORKSPACE 'harness'
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' (Join-Path $env:GITHUB_WORKSPACE 'harness/torchft_validation_runner.py')
          if ($LASTEXITCODE -ne 0) { throw 'Quantization GPU validation failed' }
