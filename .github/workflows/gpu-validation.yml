name: Check graph counts and optimization model interfaces
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  igraph:
    name: Build native igraph and verify incident triangle counts
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/python-igraph
        ref: afbabc01bb43c8531f147428f5fb497375655658
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Build, exercise the public interface and compare results
      run: "sudo apt-get update -qq\nsudo apt-get install -y flex bison libxml2-dev\
        \ libglpk-dev libcairo2-dev\ngit submodule update --init vendor/source/igraph\n\
        git -C vendor/source/igraph fetch --tags\ngit -C vendor/source/igraph describe\
        \ --tags\npython -m pip install . pytest networkx numpy\npython -m pytest\
        \ -q tests/test_motifs.py tests/test_structural.py\npython - <<'PY'\nimport\
        \ igraph as ig\nimport tracemalloc\nfrom math import comb\nn=120\ng=ig.Graph.Full(n)\n\
        def peak(fn):\n    tracemalloc.start()\n    try:\n        out=fn()\n     \
        \   return out,tracemalloc.get_traced_memory()[1]\n    finally:\n        tracemalloc.stop()\n\
        counts,small=peak(g.count_adjacent_triangles)\ntri,large=peak(g.list_triangles)\n\
        assert len(tri)==comb(n,3) and counts==[comb(n-1,2)]*n\nprint('Python allocations\
        \ on K120:',len(tri),'triangles, count',small,'bytes vs list',large,'bytes')\n\
        assert small<large//10\nPY"
