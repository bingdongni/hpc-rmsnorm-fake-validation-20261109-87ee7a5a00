name: PatchCore search and MACE Cartesian vibrations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patchcore:
    name: PatchCore dynamic export and bounded search (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/anomalib
          ref: e152dfe00da8b267fb0e57b9ebdc3d89ee9307fc
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install PatchCore and run the project tests
        run: |
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install . pytest pytest-mock ruff==0.12.0
          ruff check src/anomalib/models/image/patchcore/torch_model.py tests/unit/models/image/patchcore/test_torch_model.py
          ruff format --check src/anomalib/models/image/patchcore/torch_model.py tests/unit/models/image/patchcore/test_torch_model.py
          python -m pytest -q tests/unit/models/image/patchcore
  mace:
    name: MACE vibrations, force derivatives and checkpoint references (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/mace
          ref: 812261ac1e6a1ebdbf0fc812458bb25edef3155e
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch and run the numerical regression suites
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[test]' black==26.5.1 isort==8.0.1
          black --check mace/calculators/vibrations tests/unit/vibrations
          isort --check-only mace/calculators/vibrations tests/unit/vibrations
          python -m pytest -q tests/unit/vibrations tests/unit/test_physics_glue.py tests/golden/test_tiny_anchors.py
  gpu:
    name: Exact PatchCore search and analytical MACE products (RTX 4060)
    runs-on: [self-hosted, Windows, X64, patchcore-mace-fa3192ce00]
    timeout-minutes: 30
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: open-edge-platform/anomalib
          ref: 437669f437b0d552c7d8382316e49cbaff574ce8
          path: base
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/anomalib
          ref: e152dfe00da8b267fb0e57b9ebdc3d89ee9307fc
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/mace
          ref: 812261ac1e6a1ebdbf0fc812458bb25edef3155e
          path: mace
          persist-credentials: false
      - name: Compare PatchCore memory, latency, indices and full ResNet18 output
        run: |
          & 'C:\PR\pr-followup-20261115-2027\patchcore-env\Scripts\python.exe' validation\patchcore_gpu.py base candidate
          if ($LASTEXITCODE) { throw 'PatchCore CUDA verification failed' }
      - name: Compare MACE to the dense CUDA Hessian and check a periodic normal mode
        env:
          TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: '1'
        run: |
          & 'C:\PR\pr-followup-20261115-2027\mace-env\Scripts\python.exe' validation\mace_gpu.py mace
          if ($LASTEXITCODE) { throw 'MACE CUDA verification failed' }
