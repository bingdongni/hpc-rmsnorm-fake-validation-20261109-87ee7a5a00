name: Verify large Fold, packed RoPE and odd-width whitening
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux:
    name: Public API comparisons (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      SCIPY_ARRAY_API: '1'
      CUBLAS_WORKSPACE_CONFIG: :4096:8
    steps:
    - &id001
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: conv
        repository: bingdongni/unfoldNd
        ref: fefc53783727fd79ac1ddfa4f41b3b25c7e66b7b
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for conv
      run: git -C conv worktree add --detach ../conv-base-2ec11988 7478b339e7bf14f0f9fc22deac9b7b7e2c9e6566
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: rot
        repository: bingdongni/rotary-embedding-torch
        ref: f35db5f50f4bb638afbb515a1a41acf28db2ac51
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for rot
      run: git -C rot worktree add --detach ../rot-base-2ec11988 6d7071e10d8aefa651526b797c00d33d106f1473
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: psd
        repository: bingdongni/torch-fourier-filter
        ref: b87b7885dd04c4d3768169de53b615dfd07dccfc
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for psd
      run: git -C psd worktree add --detach ../psd-base-2ec11988 3e83430105ee22a1f7a38da56d9020a3d297d4bd
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install test dependencies
      run: 'python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install pytest numpy scipy einops packaging torch-grid-utils'
    - name: conv public API comparison and regression tests
      run: 'python validation/compare.py conv conv-base-2ec11988 cpu base

        python validation/compare.py conv conv cpu candidate

        python validation/test_suite.py conv'
    - name: rot public API comparison and regression tests
      run: 'python validation/compare.py rot rot-base-2ec11988 cpu base

        python validation/compare.py rot rot cpu candidate

        python validation/test_suite.py rot'
    - name: psd public API comparison and regression tests
      run: 'python validation/compare.py psd psd-base-2ec11988 cpu base

        python validation/compare.py psd psd cpu candidate

        python validation/test_suite.py psd'
  gpu:
    name: Public API comparisons (RTX 4060)
    runs-on:
    - self-hosted
    - Windows
    - X64
    - large-fold-packed-rope-spectrum-ca334b633d
    timeout-minutes: 40
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      SCIPY_ARRAY_API: '1'
      CUBLAS_WORKSPACE_CONFIG: :4096:8
    steps:
    - *id001
    - name: Mask runner identifiers
      run: 'Write-Output "::add-mask::$env:MASK_MACHINE"

        Write-Output "::add-mask::$env:MASK_USER"'
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: conv
        repository: bingdongni/unfoldNd
        ref: fefc53783727fd79ac1ddfa4f41b3b25c7e66b7b
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for conv
      run: git -C conv worktree add --detach ../conv-base-2ec11988 7478b339e7bf14f0f9fc22deac9b7b7e2c9e6566
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: rot
        repository: bingdongni/rotary-embedding-torch
        ref: f35db5f50f4bb638afbb515a1a41acf28db2ac51
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for rot
      run: git -C rot worktree add --detach ../rot-base-2ec11988 6d7071e10d8aefa651526b797c00d33d106f1473
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: psd
        repository: bingdongni/torch-fourier-filter
        ref: b87b7885dd04c4d3768169de53b615dfd07dccfc
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for psd
      run: git -C psd worktree add --detach ../psd-base-2ec11988 3e83430105ee22a1f7a38da56d9020a3d297d4bd
    - name: conv public API comparison and regression tests
      run: '& ''C:\PR\pr-followup-20261116-six\deps\Scripts\python.exe'' validation/compare.py
        conv conv-base-2ec11988 cuda base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-six\deps\Scripts\python.exe'' validation/compare.py
        conv conv cuda candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-six\deps\Scripts\python.exe'' validation/test_suite.py
        conv'
    - name: rot public API comparison and regression tests
      run: '& ''C:\PR\pr-followup-20261116-six\deps\Scripts\python.exe'' validation/compare.py
        rot rot-base-2ec11988 cuda base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-six\deps\Scripts\python.exe'' validation/compare.py
        rot rot cuda candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-six\deps\Scripts\python.exe'' validation/test_suite.py
        rot'
    - name: psd public API comparison and regression tests
      run: '& ''C:\PR\pr-followup-20261116-six\deps\Scripts\python.exe'' validation/compare.py
        psd psd-base-2ec11988 cuda base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-six\deps\Scripts\python.exe'' validation/compare.py
        psd psd cuda candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-six\deps\Scripts\python.exe'' validation/test_suite.py
        psd'
