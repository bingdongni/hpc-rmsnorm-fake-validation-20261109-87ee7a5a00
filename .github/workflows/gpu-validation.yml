name: Validate vespa-docs algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  docs:
    name: Build Vespa cross-encoder guide and verify rendered guidance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: vespa-engine/documentation
        ref: 735ba3a5663d1e036e37a89a40038fec79865974
        persist-credentials: false
    - name: Apply guide change
      run: echo 
        | base64 -d | git apply -
    - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18
      with:
        ruby-version: '4.0'
        bundler-cache: true
    - name: Run documentation checks
      env:
        JEKYLL_ENV: production
      run: 'set -euo pipefail

        bundle exec ruby test/test_rouge_lexers.rb

        bundle exec jekyll build

        grep -q ''253 tokens in total'' _site/en/ranking/cross-encoders.html'
