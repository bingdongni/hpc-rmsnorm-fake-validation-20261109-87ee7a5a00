name: Check graph counts and optimization model interfaces
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  pywt:
    name: Wavelet refinement matrices and full native suite
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/pywt
        ref: 572b29ce0c88568b3b5ffb362d6249f78580c559
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Build, exercise the public interface and compare results
      run: "python -m pip install . pytest scipy matplotlib\ncd \"$RUNNER_TEMP\"\n\
        python -m pytest -q --pyargs pywt.tests\npython - <<'PY'\nimport doctest\n\
        import numpy as np\nimport pywt\nrunner = doctest.DocTestRunner()\nrunner.run(doctest.DocTestParser().get_doctest(pywt.refinement_matrix.__doc__,\
        \ {}, \"refinement_matrix\", None, 0))\nassert runner.summarize().failed ==\
        \ 0\nnames = pywt.wavelist(kind=\"discrete\")\nrng = np.random.default_rng(179)\n\
        for name in names:\n    wavelet = pywt.Wavelet(name)\n    for dual, h in [(False,\
        \ wavelet.rec_lo), (True, wavelet.inverse_filter_bank[2])]:\n        x = rng.standard_normal(len(h))\n\
        \        np.testing.assert_allclose(pywt.refinement_matrix(wavelet, dual=dual)\
        \ @ x, np.sqrt(2)*np.convolve(h, x)[::2], atol=1e-14)\nprint(\"built-in wavelets:\"\
        ,len(names),\"filters:\",len(names)*2)\nPY"
