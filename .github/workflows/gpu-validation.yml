name: CLIP attention pooling and AceFF torsion scans
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timm:
    name: timm pooling and rotary reference tests (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/pytorch-image-models
          ref: 5c8687a8737d2dae67135e6afbd243baae6398e1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install . -r requirements-dev.txt
          python -m pytest -q tests/test_layers_pool.py tests/test_layers.py tests/test_layers_pos_embed.py -k pool
  torchmd:
    name: TorchMD-Net ASE calculator and compiled force requests (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TORCHINDUCTOR_COMPILE_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/torchmd-net
          ref: 0966f94f51a3dce7b8d0c9b918d13be935bf838e
          path: torchmd
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - working-directory: torchmd
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install . pytest
          python -m pytest -q tests/test_calculator.py -k 'forces_on_demand or ase_calculator or compare_forward'
          python ../validation/compile_ase.py .
  gpu:
    name: Pretrained CLIP image encoders and AceFF-2.0 torsion energies (RTX 4060)
    runs-on: [self-hosted, Windows, X64, clip-aceff-b99cfeb1ec]
    timeout-minutes: 30
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/pytorch-image-models
          ref: 5c8687a8737d2dae67135e6afbd243baae6398e1
          path: timm
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: huggingface/pytorch-image-models
          ref: 43b549bfe9d680bc94284cfd0b611152d18e97d7
          path: timm-base
          sparse-checkout: timm/layers
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/torchmd-net
          ref: 0966f94f51a3dce7b8d0c9b918d13be935bf838e
          path: torchmd
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: torchmd/torchmd-net
          ref: 93de4eb9922fc7a1e9ac1ea6f33c842102937dcc
          path: torchmd-base
          sparse-checkout: torchmdnet
          persist-credentials: false
      - name: Check the real CLIP image encoder, outputs, gradients and peak allocation
        run: |
          $assets = 'C:\PR\pr-followup-20261115-2130'
          & 'C:\PR\pr-followup-20261115-2027\patchcore-env\Scripts\python.exe' validation\clip_gpu.py timm timm-base\timm\layers\attention_pool2d.py "$assets\clip-model.safetensors" "$assets\dog.jpg" --wide "$assets\clip-x16.safetensors"
          if ($LASTEXITCODE) { throw 'CLIP CUDA validation failed' }
      - name: Compare a 24-angle rigid butane scan and on-demand forces with the released AceFF-2.0 model
        run: |
          $assets = 'C:\PR\pr-followup-20261115-2130'
          & "$assets\torchmd-env\Scripts\python.exe" validation\aceff_gpu.py torchmd torchmd-base\torchmdnet\calculators.py "$assets\aceff_v2.0.ckpt"
          if ($LASTEXITCODE) { throw 'AceFF CUDA validation failed' }
      - name: Run calculator and pooling regressions on CUDA
        run: |
          Push-Location torchmd
          & 'C:\PR\pr-followup-20261115-2130\torchmd-env\Scripts\python.exe' -m pytest -q tests/test_calculator.py -k forces_on_demand
          if ($LASTEXITCODE) { throw 'Calculator regression failed' }
          Pop-Location
          Push-Location timm
          $env:TORCH_DEVICE = 'cuda'
          & 'C:\PR\pr-followup-20261115-2027\patchcore-env\Scripts\python.exe' -m pytest -q tests/test_layers_pool.py tests/test_layers_pos_embed.py -k 'attention_pool or mrope_attention_pool'
          if ($LASTEXITCODE) { throw 'Pooling regression failed' }
