name: Validate ease-dual algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: ease-dual
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: PreferredAI/cornac
        ref: 8923b8b0074b38d20a28c38df31a2bd83249ca03
        persist-credentials: false
    - name: Apply verified change
      shell: bash
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        git diff --check'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run tests
      shell: bash
      run: 'set -euo pipefail

        export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1

        python -m pip install -q -e .[tests]

        python -m pytest -q tests/cornac/models/test_ease.py tests/cornac/models/test_recommender.py

        python docs/check_listings.py

        echo 
        | base64 -d > /tmp/check-ease.py

        python /tmp/check-ease.py

        '
