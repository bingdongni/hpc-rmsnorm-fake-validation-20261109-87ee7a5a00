name: Validate tree-gain-style algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: tree-gain-style
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: dmlc/treelite
        ref: 4740ad7e2a027a56321bdf2d90bab64a3526ebc9
        persist-credentials: false
    - name: Apply verified change
      shell: bash
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        git diff --check'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run tests
      shell: bash
      run: 'set -euo pipefail

        export CMAKE_BUILD_PARALLEL_LEVEL=3 OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1

        python -m pip install -q pytest hypothesis pandas scikit-learn black==26.10.1
        clang-format==22.1.8

        clang-format --dry-run --Werror src/model_loader/sklearn.cc src/model_loader/sklearn_bulk.cc

        python -m black --check tests/python/test_sklearn_integration.py

        git diff -- src/model_loader > /tmp/gain.patch

        git apply -R /tmp/gain.patch

        python -m pip install --no-deps -q ./python

        set +e

        python -m pytest -q tests/python/test_sklearn_integration.py -k weighted_split_gain
        > /tmp/base.log 2>&1

        base_status=$?

        set -e

        cat /tmp/base.log

        test "$base_status" -eq 1

        grep -q ''2 failed'' /tmp/base.log

        git apply /tmp/gain.patch

        python -m pip install -q --force-reinstall --no-deps ./python

        python -m pytest -q tests/python/test_sklearn_integration.py -k ''weighted_split_gain
        or iforest_round_trip'' tests/python/test_sklearn_trees_missing_values.py

        python -m pytest -q tests/python/test_sklearn_trees_missing_values.py

        echo 
        | base64 -d > /tmp/tree-oracle.py

        python /tmp/tree-oracle.py

        '
