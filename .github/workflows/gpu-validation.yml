name: JEPA world model planner optimizer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/jepa-wms
          ref: a7457b0aa3dcea7f563fe5e2705dcadf169e43e9
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Install planner and lint dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'tensordict==0.9.1' 'nevergrad==1.0.12' black==25.1.0 isort==6.0.1 flake8==7.2.0
          python -c "import sys, torch; print(sys.version, torch.__version__)"
      - name: Reproduce both regressions on the upstream commit
        run: |
          git worktree add --detach "$RUNNER_TEMP/planner-base" 13cf1d9c7e476f53c17714d2e0f1dc239a883ce0
          cp tests/test_gradient_planner.py "$RUNNER_TEMP/planner-base/tests/"
          cd "$RUNNER_TEMP/planner-base"
          if python -m unittest discover -s tests -p test_gradient_planner.py -v > "$RUNNER_TEMP/baseline.txt" 2>&1; then
            echo "Expected baseline to fail"; exit 1
          fi
          cat "$RUNNER_TEMP/baseline.txt"
          grep -F 'Trying to backward through the graph a second time' "$RUNNER_TEMP/baseline.txt"
          grep -F "planner='AdamPlanner'" "$RUNNER_TEMP/baseline.txt"
          grep -F 'FAILED (failures=1, errors=1)' "$RUNNER_TEMP/baseline.txt"
      - name: Verify action trajectories, gradient isolation and style
        run: |
          python -m unittest discover -s tests -p test_gradient_planner.py -v
          files=(evals/simu_env_planning/planning/planning/planner.py tests/test_gradient_planner.py)
          python -m black --check "${files[@]}"
          python -m isort --check "${files[@]}"
          python -m flake8 "${files[@]}"
  gpu:
    runs-on: [self-hosted, Windows, X64, jepa-planner-d7928270d8]
    timeout-minutes: 12
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: validation
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/jepa-wms
          ref: a7457b0aa3dcea7f563fe5e2705dcadf169e43e9
          persist-credentials: false
          path: jepa
      - name: Run both planning regressions and the evaluation agent on CUDA
        shell: powershell
        working-directory: jepa
        run: |
          if ((git rev-parse HEAD) -ne 'a7457b0aa3dcea7f563fe5e2705dcadf169e43e9') { throw 'Unexpected planner commit' }
          $env:PYTHONPATH = "$PWD;C:\PR\jepa-planner-deps-20261115"
          $python = 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe'
          & $python -c "import sys, unittest, torch; sys.path.append(r'D:\Python\Lib\site-packages'); assert torch.cuda.is_available(); print(sys.version, torch.__version__, torch.cuda.get_device_name()); unittest.main(module=None, argv=['unittest','discover','-s','tests','-p','test_gradient_planner.py','-v'])"
          if ($LASTEXITCODE) { throw 'CUDA planner regressions failed' }
          & $python -c "import sys, runpy; sys.path.append(r'D:\Python\Lib\site-packages'); runpy.run_path(sys.argv[1], run_name='__main__')" ..\validation\jepa_agent_probe.py
          if ($LASTEXITCODE) { throw 'Goal-conditioned planning integration failed' }
