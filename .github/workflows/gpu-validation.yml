name: Check distribution, change-point and tile solvers
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  pot:
    name: POT exact barycenter (NumPy, JAX and PyTorch)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/POT
        ref: c00a032b7e5b2a68f4ded33bafac6a7925faccb4
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Build and test the candidate
      run: 'python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

        python -m pip install -e . pytest jax

        python -m pytest -q test/test_1d_solver.py'
  ruptures:
    name: Poisson cost and full ruptures suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/ruptures
        ref: bc87634b6602d51658fd22c62881133ed3a2cd8d
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Build and test the candidate
      run: 'python -m pip install -e . pytest matplotlib

        python -m pytest -q -o addopts="" tests'
  tiles:
    name: Python PMTiles converters and range reads
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/PMTiles
        ref: 4e654533570a5e951f24474c19c8f947d05adad2
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Build and test the candidate
      run: 'cd python/pmtiles

        python -m pip install .

        python -m unittest discover -v'
  patchcore:
    name: PatchCore dynamic export and bounded search (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/anomalib
        ref: ed710681b425cdc79394840f129c1f63b6766987
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install PatchCore and run the project tests
      run: 'python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install . pytest pytest-mock ruff==0.12.0

        ruff check src/anomalib/models/image/patchcore/torch_model.py tests/unit/models/image/patchcore/test_torch_model.py

        ruff format --check src/anomalib/models/image/patchcore/torch_model.py tests/unit/models/image/patchcore/test_torch_model.py

        python -m pytest -q tests/unit/models/image/patchcore

        '
  gpu:
    name: Exact barycenter vs NumPy quantiles (RTX 4060)
    runs-on:
    - self-hosted
    - Windows
    - X64
    - quantile-poisson-tiles-a6edcf3dac
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/POT
        ref: c00a032b7e5b2a68f4ded33bafac6a7925faccb4
        path: candidate
        persist-credentials: false
    - name: Test the public API on CUDA float32 and float64
      working-directory: candidate
      shell: pwsh
      run: '$py = ''C:/PR/pr-followup-20261119-1746/env/Scripts/python.exe''

        & $py ../validation/pot_native.py

        if ($LASTEXITCODE) { throw ''Native extension setup failed'' }

        $env:PYTHONPATH=(Get-Location).Path

        & $py ../validation/cuda.py

        if ($LASTEXITCODE) { throw ''CUDA comparison failed'' }'
