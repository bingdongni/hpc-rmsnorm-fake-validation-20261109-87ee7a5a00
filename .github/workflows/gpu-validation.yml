name: Float8 cast configuration validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    runs-on: [self-hosted, Windows, X64, torchao-fp8-config-d83db03df6]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pytorch/ao
          ref: 82c6889c4a33041a7023467746b6a91da3e691d1
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/ao
          ref: 2558f234bba453ca1e64c2d423147cee0aea86c9
          path: patched
          persist-credentials: false
      - name: Verify source and CUDA device
        run: |
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -c "import hashlib,pathlib; pairs=[('patched/torchao/float8/config.py','3a4dda06df487c21de63d96e4a774fed26d9c6d00a13a0329a22d6dbd1dbf1df'),('patched/test/float8/test_config_defaults.py','6521100ec31451e18933c8022c3d770200a5a1930942e8c09738f0f7aaaf947a'),('baseline/torchao/float8/config.py','5344950f2a3e7d438ea24ccb47ccc3b7e71bc3d59d883e010569f72c7da5611a')]; assert all(hashlib.sha256(pathlib.Path(p).read_bytes().replace(b'\r\n',b'\n')).hexdigest()==h for p,h in pairs); print('Source hashes verified')"
          if ($LASTEXITCODE -ne 0) { throw 'Source hash verification failed' }
          Write-Host 'Patched commit: 2558f234bba453ca1e64c2d423147cee0aea86c9'
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -c "import torch; assert torch.cuda.is_available(); print('GPU:',torch.cuda.get_device_name(0),'PyTorch:',torch.__version__,'CUDA:',torch.version.cuda)"
          if ($LASTEXITCODE -ne 0) { throw 'CUDA device check failed' }
      - name: Confirm baseline configuration failures
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'baseline'
          $env:TORCHAO_EXPECT_ROOT = $env:PYTHONPATH
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -c "import os,pathlib,torchao; assert pathlib.Path(torchao.__file__).resolve().is_relative_to(pathlib.Path(os.environ['TORCHAO_EXPECT_ROOT']).resolve()); print('Baseline import verified')"
          if ($LASTEXITCODE -ne 0) { throw 'Baseline import verification failed' }
          $test = Join-Path $env:GITHUB_WORKSPACE 'patched/test/float8/test_config_defaults.py'
          $output = & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -m pytest -q --noconftest --tb=no --import-mode=importlib $test -k 'not gpu' 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 1 -or $output -notmatch '5 failed, 1 passed, 1 deselected') { throw 'Unexpected baseline result' }
          $output = & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -m pytest -q --noconftest --tb=short --import-mode=importlib "${test}::test_shared_cast_config_gpu_forward_and_backward" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 1 -or $output -notmatch 'Mismatched elements:' -or $output -notmatch '1 failed') { throw 'Unexpected baseline GPU result' }
          exit 0
      - name: Run patched configuration and native FP8 tests
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'patched'
          $env:TORCHAO_EXPECT_ROOT = $env:PYTHONPATH
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -c "import os,pathlib,torchao; assert pathlib.Path(torchao.__file__).resolve().is_relative_to(pathlib.Path(os.environ['TORCHAO_EXPECT_ROOT']).resolve()); print('Patched import verified')"
          if ($LASTEXITCODE -ne 0) { throw 'Patched import verification failed' }
          $test = Join-Path $env:GITHUB_WORKSPACE 'patched/test/float8/test_config_defaults.py'
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -m pytest -q --noconftest --tb=short --import-mode=importlib $test
          if ($LASTEXITCODE -ne 0) { throw 'Patched regression tests failed' }
          $base = Join-Path $env:GITHUB_WORKSPACE 'patched/test/float8/test_base.py'
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -m pytest -q --noconftest --tb=short --import-mode=importlib "${base}::TestFloat8Linear::test_repr" "${base}::TestFloat8Linear::test_mixed_precision_operands_raise"
          if ($LASTEXITCODE -ne 0) { throw 'Existing config tests failed' }
