name: OpenRLHF multi-turn budget validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DS_BUILD_OPS: '0'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRLHF/OpenRLHF
          ref: 26494490bc237f6c3af62dab6117e6bbb0a78dba
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRLHF/OpenRLHF
          ref: 26494490bc237f6c3af62dab6117e6bbb0a78dba
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply and verify candidate
        run: |
          test "$(git -C candidate rev-parse HEAD)" = 26494490bc237f6c3af62dab6117e6bbb0a78dba
          git -C candidate apply --check "$GITHUB_WORKSPACE/harness/openrlhf-budget.patch"
          git -C candidate apply "$GITHUB_WORKSPACE/harness/openrlhf-budget.patch"
          cp candidate/tests/test_agent.py baseline/tests/test_agent.py
      - name: Install CPU test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libaio-dev
          python -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'deepspeed==0.19.6' 'transformers==5.15.0' datasets aiohttp pytest tqdm peft torchdata accelerate einops jsonlines optree pynvml
      - name: Reproduce the baseline bug
        run: |
          cd baseline
          set +e
          python -m pytest -q -o addopts='' tests/test_agent.py -k 'multiturn_respects_generation_budget or multiturn_concurrent_samples_do_not_share_sampling_state' --tb=no > "$RUNNER_TEMP/baseline.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/baseline.log"
          test "$code" = 1
          grep -q '8 failed' "$RUNNER_TEMP/baseline.log"
      - name: Run full CPU suite and compile sources
        working-directory: candidate
        run: |
          python -m compileall -q openrlhf examples tests
          python -m pytest -q -o addopts='' tests --tb=short
  precommit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRLHF/OpenRLHF
          ref: 26494490bc237f6c3af62dab6117e6bbb0a78dba
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run project hooks on changed files
        working-directory: candidate
        run: |
          git apply --check "$GITHUB_WORKSPACE/harness/openrlhf-budget.patch"
          git apply "$GITHUB_WORKSPACE/harness/openrlhf-budget.patch"
          python -m pip install pre-commit
          pre-commit run --files openrlhf/utils/agent.py tests/test_agent.py
