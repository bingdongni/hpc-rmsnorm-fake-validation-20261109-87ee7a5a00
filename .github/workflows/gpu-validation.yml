name: Validate network-doc algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: network-doc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/networkit
        ref: 0ece1dc2ff0d100c6a7eedb6691b92536ad8424a
        persist-credentials: false
    - name: Apply verified change
      shell: bash
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        git diff --check'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run tests
      shell: bash
      run: "set -euo pipefail\npython -m pip -q install 'cython>=3,<4'\ncython -3\
        \ --cplus -I . networkit/community.pyx -o /tmp/networkit_community.cpp\npython\
        \ - <<'PY'\nfrom pathlib import Path\nfrom fractions import Fraction as F\n\
        import re\nfrom itertools import product\nfrom ast import literal_eval\ns=Path('networkit/community.pyx').read_text()\n\
        doc=literal_eval(re.search(r'cdef class Modularity:\\s*(\"\"\".*?\"\"\")',s,re.S)[1])\n\
        assert r'\\frac{vol^{out}(C) \\cdot vol^{in}(C)}' in doc\nedges=[(0,0,1),(0,1,2),(1,2,3),(2,1,1)]\n\
        labels=(0,0,2,3)\nfor directed in [True,False]:\n    total=sum(w for _,_,w\
        \ in edges)\n    vol_out=[sum(w*((labels[u]==c) if directed else F((labels[u]==c)+(labels[v]==c),2))\
        \ for u,v,w in edges) for c in range(4)]\n    vol_in=[sum(w*((labels[v]==c)\
        \ if directed else F((labels[u]==c)+(labels[v]==c),2)) for u,v,w in edges)\
        \ for c in range(4)]\n    if directed:\n        assert list(zip(vol_out,vol_in))==[(6,4),(0,0),(1,3),(0,0)]\n\
        \    cov=F(sum(w for u,v,w in edges if labels[u]==labels[v]),total)\n    mod=cov-sum(F(o*i,total**2)\
        \ for o,i in zip(vol_out,vol_in))\n    assert mod == (F(-6,49) if directed\
        \ else F(3,7)-F(29,49))\nprint(\"Cython docstring and directed/undirected\
        \ formula checks passed\")\nPY\n"
