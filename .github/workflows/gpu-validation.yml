name: Check SSIM maps, time-varying smoothing and rollout dynamics
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux:
    name: Public API comparisons (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      SCIPY_ARRAY_API: '1'
      CUBLAS_WORKSPACE_CONFIG: :4096:8
    steps:
    - &id001
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: ms
        repository: bingdongni/pytorch-msssim
        ref: 3ebf91b52f5e79ce18dace33348f9a6f21405dbd
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for ms
      run: git -C ms worktree add --detach ../ms-base-37f078a7 b057b072dd869ae3f6b88543786f44d008315f69
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: torchkf
        repository: bingdongni/torch-kf
        ref: 68f0a49e86a4a7d77396784612d4e10496a54739
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for torchkf
      run: git -C torchkf worktree add --detach ../torchkf-base-37f078a7 1cf3daf88c9f04223483f96e9b9de18521754a5b
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: mppi
        repository: bingdongni/pytorch_mppi
        ref: f79363d21317e888c068601857f73c38b1994666
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for mppi
      run: git -C mppi worktree add --detach ../mppi-base-37f078a7 e04a569cd4215e705f9013145c496fc59cb25ed6
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install test dependencies
      run: 'python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install pytest numpy scipy matplotlib arm-pytorch-utilities==0.5.0
        pytorch-seed

        python -m pip install --no-deps ./torchkf'
    - name: ms public API comparison and regression tests
      run: 'python validation/compare.py ms ms-base-37f078a7 cpu base

        python validation/compare.py ms ms cpu candidate

        python validation/test_suite.py ms'
    - name: torchkf public API comparison and regression tests
      run: 'python validation/compare.py torchkf torchkf-base-37f078a7 cpu base

        python validation/compare.py torchkf torchkf cpu candidate

        python validation/test_suite.py torchkf'
    - name: mppi public API comparison and regression tests
      run: 'python validation/compare.py mppi mppi-base-37f078a7 cpu base

        python validation/compare.py mppi mppi cpu candidate

        python validation/test_suite.py mppi'
  gpu:
    name: Public API comparisons (RTX 4060)
    runs-on:
    - self-hosted
    - Windows
    - X64
    - similarity-smoothing-rollouts-3cb7d1487f
    timeout-minutes: 40
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      SCIPY_ARRAY_API: '1'
      CUBLAS_WORKSPACE_CONFIG: :4096:8
    steps:
    - *id001
    - name: Mask runner identifiers
      run: 'Write-Output "::add-mask::$env:MASK_MACHINE"

        Write-Output "::add-mask::$env:MASK_USER"'
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: ms
        repository: bingdongni/pytorch-msssim
        ref: 3ebf91b52f5e79ce18dace33348f9a6f21405dbd
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for ms
      run: git -C ms worktree add --detach ../ms-base-37f078a7 b057b072dd869ae3f6b88543786f44d008315f69
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: torchkf
        repository: bingdongni/torch-kf
        ref: 68f0a49e86a4a7d77396784612d4e10496a54739
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for torchkf
      run: git -C torchkf worktree add --detach ../torchkf-base-37f078a7 1cf3daf88c9f04223483f96e9b9de18521754a5b
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: mppi
        repository: bingdongni/pytorch_mppi
        ref: f79363d21317e888c068601857f73c38b1994666
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for mppi
      run: git -C mppi worktree add --detach ../mppi-base-37f078a7 e04a569cd4215e705f9013145c496fc59cb25ed6
    - name: ms public API comparison and regression tests
      run: '& ''C:\PR\pr-followup-20261116-batch-c\deps\Scripts\python.exe'' validation/compare.py
        ms ms-base-37f078a7 cuda base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-batch-c\deps\Scripts\python.exe'' validation/compare.py
        ms ms cuda candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-batch-c\deps\Scripts\python.exe'' validation/test_suite.py
        ms'
    - name: torchkf public API comparison and regression tests
      run: '& ''C:\PR\pr-followup-20261116-batch-c\deps\Scripts\python.exe'' validation/compare.py
        torchkf torchkf-base-37f078a7 cuda base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-batch-c\deps\Scripts\python.exe'' validation/compare.py
        torchkf torchkf cuda candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-batch-c\deps\Scripts\python.exe'' validation/test_suite.py
        torchkf'
    - name: mppi public API comparison and regression tests
      run: '& ''C:\PR\pr-followup-20261116-batch-c\deps\Scripts\python.exe'' validation/compare.py
        mppi mppi-base-37f078a7 cuda base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-batch-c\deps\Scripts\python.exe'' validation/compare.py
        mppi mppi cuda candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-batch-c\deps\Scripts\python.exe'' validation/test_suite.py
        mppi'
