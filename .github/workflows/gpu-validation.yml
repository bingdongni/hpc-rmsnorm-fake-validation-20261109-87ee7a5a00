name: Tool budgets, streaming token windows and defensive coverage
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  attackdata:
    name: attackdata Linux validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: attackdata
        persist-credentials: false
        repository: bingdongni/mitreattack-python
        ref: 02c1e158e0e1be2e80059866afccacb67ccf47c4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Install locked dependencies
      run: 'python -m pip install uv

        uv sync --frozen --extra dev'
      working-directory: attackdata
    - name: Lint, then run exporter and CLI tests
      run: 'uv run --frozen ruff check

        uv run --frozen ruff format --check

        uv run --frozen pytest -q tests/test_to_excel.py tests/test_cli.py -m ''not
        slow and not integration'''
      working-directory: attackdata
    - name: Check published ICS release against an independent traversal
      run: 'curl --fail --location --retry 3 --output /tmp/ics.json https://raw.githubusercontent.com/mitre-attack/attack-stix-data/a8db2f52eb933c9c99060c123e088b3326d3a607/ics-attack/ics-attack.json

        uv run --frozen python ../validation/check_coverage.py /tmp/ics.json'
      working-directory: attackdata
