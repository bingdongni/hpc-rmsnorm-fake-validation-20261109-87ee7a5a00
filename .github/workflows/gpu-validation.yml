name: Check fixed and time-varying RTS process models
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  gpu:
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      CUBLAS_WORKSPACE_CONFIG: :4096:8
    name: RTX 4060 RTS smoothing
    runs-on:
    - self-hosted
    - Windows
    - X64
    - kalman-process-overrides-2fcab8e424
    steps:
    - name: Mask runner identifiers
      run: 'Write-Output "::add-mask::$env:MASK_MACHINE"

        Write-Output "::add-mask::$env:MASK_USER"'
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/torch-kf
        ref: 3671d303fdd9469df2070466e5de9b32c84f9a20
        path: torchkf
        persist-credentials: false
    - name: Check constant overrides and the project test suite
      run: '& ''C:\PR\pr-followup-20261117-2120\env\Scripts\python.exe'' validation/kf_gpu_test.py

        if ($LASTEXITCODE) { throw ''Tests failed'' }

        & ''C:\PR\pr-followup-20261117-2120\env\Scripts\python.exe'' validation/compare.py
        torchkf torchkf cuda candidate

        if ($LASTEXITCODE) { throw ''Reference calculation failed'' }'
