name: Validate mcp-review algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  tests:
    name: Build, typecheck, lint and test the pagination review fix
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/conformance
        ref: c69c46dbef3083ab4e87b06a6b0e066cc487e214
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Build and exercise scenario and full suite
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        npm ci

        npm run build

        npm run check

        npm test

        '
