name: KDA model generation validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    runs-on: [self-hosted, Windows, X64, fla-kda-model-979ca404b3]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      FLA_CI_ENV: '0'
      CC: 'C:\PR\fla-research-deps-20261110\triton\runtime\tcc\tcc.exe'
      CUDA_PATH: 'C:\PR\fla-research-deps-20261110\triton\backends\nvidia'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: fla-org/flash-linear-attention
          ref: b8da4873fa0834849b64938af9f89bc35a347d90
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/flash-linear-attention
          ref: 9ac47b38bd6a6e6cd4071c05d3b5dc544ea4114d
          path: candidate
          persist-credentials: false
      - name: Compare training failure against baseline
        run: |
          if ((git -C baseline rev-parse HEAD) -ne 'b8da4873fa0834849b64938af9f89bc35a347d90') { throw 'Wrong baseline' }
          if ((git -C candidate rev-parse HEAD) -ne '9ac47b38bd6a6e6cd4071c05d3b5dc544ea4114d') { throw 'Wrong candidate' }
          $env:FLA_PROBE_BASE = Join-Path $env:GITHUB_WORKSPACE 'baseline'
          $env:FLA_PROBE_CANDIDATE = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $env:FLA_PROBE_EXTRA_PATH = 'C:\PR\fla-research-deps-20261110;C:\PR\fla-model-deps-20261110'
          $env:PYTHONPATH = "$env:FLA_PROBE_EXTRA_PATH;$env:FLA_PROBE_CANDIDATE"
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -c "import torch,triton; assert torch.cuda.is_available(); print('GPU:',torch.cuda.get_device_name(0),'PyTorch:',torch.__version__,'Triton:',triton.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'CUDA unavailable' }
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' (Join-Path $env:GITHUB_WORKSPACE 'harness/fla_kda_model_baseline_compare.py')
          if ($LASTEXITCODE -ne 0) { throw 'Baseline comparison failed' }
      - name: Run model generation test
        run: |
          $env:PYTHONPATH = "C:\PR\fla-research-deps-20261110;C:\PR\fla-model-deps-20261110;$env:GITHUB_WORKSPACE\candidate"
          Set-Location candidate
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -m pytest tests/models/test_modeling_kda.py::test_generation -q -o log_cli=false --disable-warnings --tb=short
          if ($LASTEXITCODE -ne 0) { throw 'KDA generation test failed' }
