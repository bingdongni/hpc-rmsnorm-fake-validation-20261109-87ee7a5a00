name: Check weighted sampling, Nystrom attention and irregular change points
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux:
    name: Public API comparisons (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      SCIPY_ARRAY_API: '1'
    steps:
    - &id001
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: nys
        repository: bingdongni/nystrom-attention
        ref: 0c29690f71760be80e8e8287e8ec59dad9925758
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for nys
      run: git -C nys worktree add --detach ../nys-base-86717707 fbe9ebad6bae24143d7930d6c2b82d6a12d68f76
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: lhotse
        repository: bingdongni/lhotse
        ref: 95d2719171e1bd8b72d2b48b5bb33a56f3e3094c
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for lhotse
      run: git -C lhotse worktree add --detach ../lhotse-base-86717707 3a4f0971f4f05c3d012e36b85097ddb5cb235c33
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: rupt
        repository: bingdongni/ruptures
        ref: 6df29fcb7a143b04346a5dd8e0a738c5ac9c5ba2
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for rupt
      run: git -C rupt worktree add --detach ../rupt-base-86717707 ee1c8ff8a548d54c641b2bb471562165931f31c7
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install test dependencies
      run: 'python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install numpy scipy matplotlib pytest hypothesis setuptools
        wheel setuptools-scm cython einops click cytoolz intervaltree soundfile audioread
        pyyaml tabulate tqdm packaging lilcom typing-extensions'
    - name: Compile upstream and candidate ruptures extensions
      env:
        SETUPTOOLS_SCM_PRETEND_VERSION: 1.1.99
      run: '(cd rupt-base-86717707 && python setup.py build_ext --inplace)

        (cd rupt && python setup.py build_ext --inplace)'
    - name: nys public API comparison and regression tests
      run: 'python validation/compare.py nys nys-base-86717707 cpu base

        python validation/compare.py nys nys cpu candidate

        python validation/test_suite.py nys'
    - name: lhotse public API comparison and regression tests
      run: 'python validation/compare.py lhotse lhotse-base-86717707 cpu base

        python validation/compare.py lhotse lhotse cpu candidate

        python validation/test_suite.py lhotse'
    - name: rupt public API comparison and regression tests
      run: 'python validation/compare.py rupt rupt-base-86717707 cpu base

        python validation/compare.py rupt rupt cpu candidate

        python validation/test_suite.py rupt'
  gpu:
    name: Public API comparisons (RTX 4060)
    runs-on:
    - self-hosted
    - Windows
    - X64
    - weighted-sampling-landmarks-76157a86b7
    timeout-minutes: 40
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      SCIPY_ARRAY_API: '1'
    steps:
    - *id001
    - name: Mask runner identifiers
      run: 'Write-Output "::add-mask::$env:MASK_MACHINE"

        Write-Output "::add-mask::$env:MASK_USER"'
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: nys
        repository: bingdongni/nystrom-attention
        ref: 0c29690f71760be80e8e8287e8ec59dad9925758
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for nys
      run: git -C nys worktree add --detach ../nys-base-86717707 fbe9ebad6bae24143d7930d6c2b82d6a12d68f76
    - name: nys public API comparison and regression tests
      run: '& ''C:\PR\pr-followup-20261116-batch-b\deps\Scripts\python.exe'' validation/compare.py
        nys nys-base-86717707 cuda base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-batch-b\deps\Scripts\python.exe'' validation/compare.py
        nys nys cuda candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-batch-b\deps\Scripts\python.exe'' validation/test_suite.py
        nys'
