name: FP8 block checkpoint conversion
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: vllm-project/compressed-tensors
          ref: 70e7167581860af0807546879e3cd0357085e246
          path: ct
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check the patch, eager converter and checkpoint tests
        working-directory: ct
        run: |
          test "$(git rev-parse HEAD)" = 70e7167581860af0807546879e3cd0357085e246
          echo '96715df8ef807615ebb8a67fbdf697080d68c89524606475ca1abf9c877e6f94  ../validation/fp8.patch' | sha256sum --check
          git apply ../validation/fp8.patch
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install . pytest accelerate 'black==22.12.0' 'isort==5.8.0' flake8
          files=(src/compressed_tensors/entrypoints/convert/converters/fp8block_dequantizer.py tests/test_entrypoints/convert/converters/test_fp8block_dequantizer.py)
          python -m black --target-version py311 --check "${files[@]}"
          python -m isort --check-only "${files[@]}"
          python -m flake8 "${files[@]}"
          python -m pytest -q --tb=short tests/test_entrypoints/convert/converters/test_fp8block_dequantizer.py tests/test_entrypoints/convert/test_convert_checkpoint.py
  cuda:
    runs-on: [self-hosted, Windows, X64, fp8-block-dequant-f3c5c6756a]
    timeout-minutes: 15
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: vllm-project/compressed-tensors
          ref: 70e7167581860af0807546879e3cd0357085e246
          path: ct
          persist-credentials: false
      - name: Validate the CUDA kernel and full conversion of a Qwen checkpoint layer
        working-directory: ct
        run: |
          if ((git rev-parse HEAD) -ne '70e7167581860af0807546879e3cd0357085e246') { throw 'Unexpected upstream commit' }
          if ((Get-FileHash ..\validation\fp8.patch).Hash -ne '96715df8ef807615ebb8a67fbdf697080d68c89524606475ca1abf9c877e6f94') { throw 'Unexpected patch' }
          git apply ..\validation\fp8.patch
          if ($LASTEXITCODE) { throw 'Patch application failed' }
          $python = 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe'
          & uv pip install --python $python --no-deps --target "$env:RUNNER_TEMP\ct-wheel" .
          if ($LASTEXITCODE) { throw 'Build failed' }
          $env:PYTHONPATH = "$PWD\src;C:\PR\pr-followup-20261115-evening\ct-deps;C:\PR\fla-research-deps-20261110;C:\PR\fla-model-deps-20261110"
          $env:CUDA_PATH = 'C:\PR\fla-research-deps-20261110\triton\backends\nvidia'
          $env:CC = 'C:\PR\fla-research-deps-20261110\triton\runtime\tcc\tcc.exe'
          & $python -c "from pathlib import Path; import compressed_tensors,torch; assert Path(compressed_tensors.__file__).resolve().is_relative_to(Path.cwd() / 'src'); assert torch.cuda.is_available(); print(torch.__version__, torch.cuda.get_device_name())"
          if ($LASTEXITCODE) { throw 'Source or GPU check failed' }
          & $python -m pytest -q --tb=short tests/test_entrypoints/convert/converters/test_fp8block_dequantizer.py tests/test_entrypoints/convert/test_convert_checkpoint.py
          if ($LASTEXITCODE) { throw 'CUDA tests failed' }
          & $python ..\validation\qwen_fp8_probe.py
          if ($LASTEXITCODE) { throw 'Checkpoint parity or memory check failed' }
