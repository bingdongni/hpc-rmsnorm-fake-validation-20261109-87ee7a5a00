name: Soft-DTW, Sinkhorn and dense ODE regression tests
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux:
    name: Public API regressions (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      PYTHONUTF8: '1'
    steps:
    - &id001
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/tslearn
        ref: bded6edf13d3618ecde2f25dcc1435253a56b26a
        fetch-depth: 3
        path: tslearn
        persist-credentials: false
    - name: Check out parent of tslearn
      run: git -C tslearn worktree add --detach ../tslearn-base d848642f5c8219126a22b500a975611a38607f20
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/POT
        ref: 11e278f822e27314310d8fe00ef8c736af63cdfd
        fetch-depth: 3
        path: pot
        persist-credentials: false
    - name: Check out parent of POT
      run: git -C pot worktree add --detach ../pot-base 3367480db2b0861a2c5d61b091d661529e7558a8
    - name: Check out first device-native implementation
      run: git -C pot worktree add --detach ../pot-first HEAD^
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/torchdiffeq
        ref: 13c831899d19b963cd144b6160b992c79589382e
        fetch-depth: 3
        path: diffeq
        persist-credentials: false
    - name: Check out parent of torchdiffeq
      run: git -C diffeq worktree add --detach ../diffeq-base 657943acefa826ef04c025ebeb1ff5e9d60dc268
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Build POT from source and install test dependencies
      run: 'sudo apt-get update -qq && sudo apt-get install -y libeigen3-dev

        python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

        CPLUS_INCLUDE_PATH=/usr/include/eigen3 python -m pip install -e ./pot

        python -m pip install pytest numba statsmodels scikit-learn h5py'
    - name: 'tslearn: compare parent, candidate and run tests'
      run: 'python validation/compare.py tslearn tslearn-base cpu base

        python validation/compare.py tslearn tslearn cpu candidate

        python validation/test_suite.py tslearn'
    - name: 'POT: compare parent, candidate and run tests'
      run: 'python validation/compare.py pot pot-base cpu base

        python validation/compare.py pot pot cpu candidate

        python validation/compare.py autocast pot-base cpu base

        python validation/compare.py autocast pot-first cpu first

        python validation/compare.py autocast pot cpu candidate

        python validation/test_suite.py pot'
    - name: 'torchdiffeq: compare parent, candidate and run tests'
      run: 'python validation/compare.py diffeq diffeq-base cpu base

        python validation/compare.py diffeq diffeq cpu candidate

        python validation/test_suite.py diffeq'
  gpu:
    name: Public API regressions (RTX 4060)
    runs-on:
    - self-hosted
    - Windows
    - X64
    - research-solvers-b7fcb8373e
    timeout-minutes: 40
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
    - *id001
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/tslearn
        ref: bded6edf13d3618ecde2f25dcc1435253a56b26a
        fetch-depth: 3
        path: tslearn
        persist-credentials: false
    - name: Check out parent of tslearn
      run: git -C tslearn worktree add --detach ../tslearn-base d848642f5c8219126a22b500a975611a38607f20
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/POT
        ref: 11e278f822e27314310d8fe00ef8c736af63cdfd
        fetch-depth: 3
        path: pot
        persist-credentials: false
    - name: Check out parent of POT
      run: git -C pot worktree add --detach ../pot-base 3367480db2b0861a2c5d61b091d661529e7558a8
    - name: Check out first device-native implementation
      run: git -C pot worktree add --detach ../pot-first HEAD^
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/torchdiffeq
        ref: 13c831899d19b963cd144b6160b992c79589382e
        fetch-depth: 3
        path: diffeq
        persist-credentials: false
    - name: Check out parent of torchdiffeq
      run: git -C diffeq worktree add --detach ../diffeq-base 657943acefa826ef04c025ebeb1ff5e9d60dc268
    - name: 'tslearn: compare parent, candidate and run tests'
      run: '& ''C:\PR\pr-followup-20261116-0830\work-env\Scripts\python.exe'' validation/compare.py
        tslearn tslearn-base cuda base

        if ($LASTEXITCODE) { throw ''Public entry point comparison failed'' }

        & ''C:\PR\pr-followup-20261116-0830\work-env\Scripts\python.exe'' validation/compare.py
        tslearn tslearn cuda candidate

        if ($LASTEXITCODE) { throw ''Public entry point comparison failed'' }

        & ''C:\PR\pr-followup-20261116-0830\work-env\Scripts\python.exe'' validation/test_suite.py
        tslearn

        if ($LASTEXITCODE) { throw ''Regression tests failed'' }'
    - name: 'POT: compare parent, candidate and run tests'
      run: '& ''C:\PR\pr-followup-20261116-0830\work-env\Scripts\python.exe'' validation/compare.py
        pot pot-base cuda base

        if ($LASTEXITCODE) { throw ''Public entry point comparison failed'' }

        & ''C:\PR\pr-followup-20261116-0830\work-env\Scripts\python.exe'' validation/compare.py
        pot pot cuda candidate

        if ($LASTEXITCODE) { throw ''Public entry point comparison failed'' }

        & ''C:\PR\pr-followup-20261116-0830\work-env\Scripts\python.exe'' validation/compare.py
        autocast pot-base cuda base

        if ($LASTEXITCODE) { throw ''Mixed precision comparison failed'' }

        & ''C:\PR\pr-followup-20261116-0830\work-env\Scripts\python.exe'' validation/compare.py
        autocast pot-first cuda first

        if ($LASTEXITCODE) { throw ''Mixed precision comparison failed'' }

        & ''C:\PR\pr-followup-20261116-0830\work-env\Scripts\python.exe'' validation/compare.py
        autocast pot cuda candidate

        if ($LASTEXITCODE) { throw ''Mixed precision comparison failed'' }

        & ''C:\PR\pr-followup-20261116-0830\work-env\Scripts\python.exe'' validation/test_suite.py
        pot

        if ($LASTEXITCODE) { throw ''Regression tests failed'' }'
    - name: 'torchdiffeq: compare parent, candidate and run tests'
      run: '& ''C:\PR\pr-followup-20261116-0830\work-env\Scripts\python.exe'' validation/compare.py
        diffeq diffeq-base cuda base

        if ($LASTEXITCODE) { throw ''Public entry point comparison failed'' }

        & ''C:\PR\pr-followup-20261116-0830\work-env\Scripts\python.exe'' validation/compare.py
        diffeq diffeq cuda candidate

        if ($LASTEXITCODE) { throw ''Public entry point comparison failed'' }

        & ''C:\PR\pr-followup-20261116-0830\work-env\Scripts\python.exe'' validation/test_suite.py
        diffeq

        if ($LASTEXITCODE) { throw ''Regression tests failed'' }'
