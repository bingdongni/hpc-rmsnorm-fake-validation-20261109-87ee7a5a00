name: Validate sketch search, SAT projection and forecasting scores
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  sketch:
    name: Ranked MinHash forest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/datasketch
        ref: afe17965ae89bde477f977d9b4d1787892c9d145
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Run source tests and exercise the public interface
      run: "python -m pip install . pytest pytest-asyncio\npython -m pytest -q test/test_lshforest.py\
        \ test/test_minhash.py test/test_weighted_minhash.py\nPYTHONPATH=. python\
        \ - <<'PY'\nfrom datasketch import MinHash, MinHashLSHForest\nimport random\n\
        rng = random.Random(103)\ndef signature(tokens):\n    m = MinHash(num_perm=64)\n\
        \    m.update_batch([s.to_bytes(4,'little') for s in tokens])\n    return\
        \ m\nforest = MinHashLSHForest(num_perm=64, l=8)\nsketches = {}\nqueries =\
        \ []\nfor family in range(64):\n    base = rng.sample(range(200_000), 96)\n\
        \    queries.append(signature(base))\n    for variant in range(8):\n     \
        \   key = (family, variant)\n        sketch = signature(base[variant+1:] +\
        \ rng.sample(range(200_000,400_000),variant+1))\n        sketches[key] = sketch\n\
        \        forest.add(key, sketch)\nforest.index()\ncount=0\nfor q in queries:\n\
        \    candidates=forest.query(q,16)\n    expected=sorted((q.jaccard(sketches[k])\
        \ for k in candidates), reverse=True)[:4]\n    ranked=forest.query_ranked(q,4,num_candidates=16)\n\
        \    assert [s for _,s in ranked]==expected\n    assert all(s==q.jaccard(sketches[k])\
        \ for k,s in ranked)\n    count+=len(ranked)\nprint('Compared',count,'ranked\
        \ scores for',len(queries),'held-out queries against externally retained sketches\
        \ on',len(sketches),'indexed documents.')\nPY"
  sat:
    name: Projected SAT enumeration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/pysat
        ref: 9ba0895731b7249ab37edb43184b71bd135754c9
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Run source tests and exercise the public interface
      run: "python -m pip install python-sat pytest\npython -m pytest -q tests/test_projected_models.py\
        \ tests/test_unique_model.py\nPYTHONPATH=. python - <<'PY'\nfrom subprocess\
        \ import run\nfrom pathlib import Path\nfrom tempfile import TemporaryDirectory\n\
        import sys\nwith TemporaryDirectory() as tmp:\n    p=Path(tmp)/'witness.cnf'\n\
        \    p.write_text('p cnf 14 13\\n1 2 0\\n'+''.join(f'1 {i} 0\\n' for i in\
        \ range(3,15)))\n    def enum(opts):\n        text=run([sys.executable,'examples/models.py','-e','all',*opts,str(p)],capture_output=True,text=True,check=True).stdout\n\
        \        return [tuple(map(int,line.split()[1:-1])) for line in text.splitlines()\
        \ if line.startswith('v ')]\n    full=enum([])\n    projected=enum(['--project=1,2'])\n\
        \    assert len(full)==8193\n    assert set(projected)=={m[:2] for m in full}=={(1,2),(1,-2),(-1,2)}\n\
        \    assert len(projected)==3\n    print('Compared',len(full),'complete models\
        \ with',len(projected),'distinct CLI projections.')\nPY"
  mapie:
    name: Multi-level forecast scoring
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/MAPIE
        ref: 278076d881312085c4c6bfbc592fb696528de872
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Run source tests and exercise the public interface
      run: "python -m pip install . pytest typing_extensions\npython -m pytest -q\
        \ mapie/tests/test_metrics.py --doctest-modules mapie/metrics/regression.py\n\
        PYTHONPATH=. python - <<'PY'\nfrom mapie.regression import SplitConformalRegressor\n\
        from mapie.metrics.regression import regression_wis_score\nfrom sklearn.dummy\
        \ import DummyRegressor\nfrom sklearn.metrics import mean_pinball_loss\nimport\
        \ numpy as np\nrng=np.random.default_rng(18)\nX=rng.normal(size=(450,4))\n\
        y=X.sum(axis=1)+rng.normal(size=450)\nlevels=[.8,.9,.95]\nmodel=SplitConformalRegressor(estimator=DummyRegressor(strategy='median'),confidence_level=levels,prefit=False)\n\
        model.fit(X[:150],y[:150]).conformalize(X[150:300],y[150:300])\nmed,intervals=model.predict_interval(X[300:])\n\
        score=regression_wis_score(y[300:],med,intervals,levels)\nlosses=[mean_pinball_loss(y[300:],med,alpha=.5)]\n\
        for i,level in enumerate(levels):\n    tail=(1-level)/2\n    losses.extend([mean_pinball_loss(y[300:],intervals[:,0,i],alpha=tail),mean_pinball_loss(y[300:],intervals[:,1,i],alpha=1-tail)])\n\
        np.testing.assert_allclose(score,2*np.mean(losses))\nprint('Compared the three-level\
        \ predictive score with seven independent quantile losses for',len(med),'held-out\
        \ samples:',score)\nPY"
  coverage:
    name: MAPIE upstream coverage and quality
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/MAPIE
        ref: 278076d881312085c4c6bfbc592fb696528de872
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Check the development suite
      run: 'python -m pip install --index-url https://download.pytorch.org/whl/cpu
        torch

        python -m pip install -e ''.[dev]''

        make lint format type-check

        make coverage'
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
