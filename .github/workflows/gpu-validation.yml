name: Validate ir-eval algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: ir-eval
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: terrierteam/ir_measures
        ref: cbd73f5dd8013f30deb41581e2c66596cd0db84f
        persist-credentials: false
    - name: Apply verified change
      shell: bash
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        git diff --check'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run tests
      shell: bash
      run: 'set -euo pipefail

        python -m pip install -q -e . -r requirements-dev.txt scikit-learn requests
        pyarrow

        python -m pytest -q tests/

        python -m mypy --disable-error-code=import-untyped ir_measures

        python -m ruff check ir_measures

        echo 
        | base64 -d > /tmp/ir-oracle.py

        python /tmp/ir-oracle.py

        '
