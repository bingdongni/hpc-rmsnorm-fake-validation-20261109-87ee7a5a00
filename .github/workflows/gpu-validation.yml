name: POT PR 931 upstream lint
'on':
  workflow_dispatch: {}
env:
  PY_VERSION: '3.13'
permissions:
  contents: read
jobs:
  Lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - name: Checking Out Repository
      uses: actions/checkout@v7
      with:
        submodules: true
        repository: bingdongni/POT
        ref: 9f7ba6087deeef759e79f7197ccbd2216278f9ce
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PY_VERSION }}
    - run: which python
    - name: Lint with pre-commit
      run: 'pip install pre-commit

        pre-commit install --install-hooks

        pre-commit run --all-files

        '
    timeout-minutes: 10
