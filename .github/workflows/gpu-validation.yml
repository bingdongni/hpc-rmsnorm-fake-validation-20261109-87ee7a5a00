name: LM training loss, atomistic forces, SQLite and telemetry
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  mstic:
    name: MSTICPy signed time-series anomalies (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: mstic
        persist-credentials: false
        repository: bingdongni/msticpy
        ref: 56524754fce7388ac6389fc6dbd419df99039337
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - working-directory: mstic
      run: 'python -m pip install . pytest pytest-check nbformat nbconvert filelock

        python -m pytest -q tests/analysis/test_timeseries.py'
  langgraph:
    name: LangGraph SQLite conformance and interrupted graph forks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: langgraph
        persist-credentials: false
        repository: bingdongni/langgraph
        ref: 9ae4721b7c12a1bdb4e9204958fb75ae89a0560f
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - working-directory: langgraph
      run: 'python -m pip install ./libs/checkpoint ./libs/sdk-py ./libs/prebuilt ./libs/langgraph ./libs/checkpoint-sqlite ./libs/checkpoint-conformance pytest pytest-asyncio pytest-mock pytest-retry

        python -m pytest -q libs/checkpoint-sqlite/tests

        python ../validation/graph_fork.py'
  vesin:
    name: Vesin native PyTorch neighbor lists (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: vesin
        persist-credentials: false
        repository: bingdongni/vesin
        ref: aa85c03c989023208472d396364c96e933f1708c
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - working-directory: vesin
      run: 'python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install -U setuptools wheel cmake ninja pytest ase

        python -m pip install --no-build-isolation --no-deps ./python/vesin_torch

        python -m pytest -q python/vesin_torch/tests/test_neighbors.py'
  olmo:
    name: OLMo-core LM head and loss tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: olmo
        persist-credentials: false
        repository: bingdongni/Olmo-core
        ref: 3ad410ec2828393178d7a8830f350ae2d352c07c
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - working-directory: olmo
      run: 'python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install . pytest

        python -m pytest -q src/test/nn/functional/cross_entropy_loss_test.py src/test/nn/lm_head_test.py -k ''not tp'''
  gpu:
    name: OLMo fused LM losses and Vesin force derivatives (RTX 4060)
    runs-on:
    - self-hosted
    - Windows
    - X64
    - training-and-forces-bdb449c77a
    timeout-minutes: 30
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: olmo
        persist-credentials: false
        repository: bingdongni/Olmo-core
        ref: 3ad410ec2828393178d7a8830f350ae2d352c07c
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: vesin
        persist-credentials: false
        repository: bingdongni/vesin
        ref: aa85c03c989023208472d396364c96e933f1708c
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: olmo-base
        persist-credentials: false
        repository: allenai/Olmo-core
        ref: 704625ad94a7c8bc93f9bea7a0b865b9a0c3d44e
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: vesin-base
        persist-credentials: false
        repository: Luthaf/vesin
        ref: 8074d9a716fa39e62218020f25ed3533859df843
    - name: Check the unpatched four-output Liger failure
      run: '& ''C:\PR\pr-followup-20261115-2225\olmo-env\Scripts\python.exe'' validation/olmo_gpu.py olmo-base --baseline

        if ($LASTEXITCODE) { throw ''Validation failed'' }'
    - name: Compare fused LMHead to eager forward and gradients with Liger 0.8.5
      run: '& ''C:\PR\pr-followup-20261115-2225\olmo-env\Scripts\python.exe'' validation/olmo_gpu.py olmo

        if ($LASTEXITCODE) { throw ''Validation failed'' }'
    - name: Compare fused LMHead to eager forward and gradients with Liger 0.6.4
      run: '& ''C:\PR\pr-followup-20261115-2225\olmo-env\Scripts\python.exe'' validation/olmo_gpu.py olmo --legacy C:\PR\pr-followup-20261115-2225\liger-064

        if ($LASTEXITCODE) { throw ''Validation failed'' }'
    - name: Check the upstream padded neighbor-list baseline
      run: '& ''C:\PR\pr-followup-20261115-2225\olmo-env\Scripts\python.exe'' validation/vesin_gpu.py vesin-base --baseline

        if ($LASTEXITCODE) { throw ''Validation failed'' }'
    - name: Compare padded and unpadded first and second derivatives on CPU and CUDA
      run: '& ''C:\PR\pr-followup-20261115-2225\olmo-env\Scripts\python.exe'' validation/vesin_gpu.py vesin

        if ($LASTEXITCODE) { throw ''Validation failed'' }'
