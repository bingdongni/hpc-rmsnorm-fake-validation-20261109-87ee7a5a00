name: Uni-Agent router LRU validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stores:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cachetools: ['5.5.2', '6.2.6', '8.0.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/uni-agent
          ref: 13328b241be45fab6f70efb597933e0518ae5821
          path: patched
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: matrix.cachetools == '5.5.2'
        with:
          repository: verl-project/uni-agent
          ref: 661f387ce1dfacf6aefa5e441a6b9569ad71bbc3
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install router test dependencies
        run: python -m pip install pytest pytest-asyncio "cachetools==${{ matrix.cachetools }}" ray==2.54.1 hydra-core xxhash msgpack pyzmq httpx
      - name: Confirm regression on base commit
        if: matrix.cachetools == '5.5.2'
        shell: bash
        run: |
          cp patched/tests/uni_agent/agent_aware_router/store/test_per_request_store.py baseline/tests/uni_agent/agent_aware_router/store/
          cd baseline
          set +e
          python -m pytest -q tests/uni_agent/agent_aware_router/store/test_per_request_store.py --tb=short 2>&1 | tee ../baseline-result.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" = 1
          grep -F '4 failed, 11 passed' ../baseline-result.txt
      - name: Run router store tests
        working-directory: patched
        run: python -m pytest -q tests/uni_agent/agent_aware_router/store --tb=short
  precommit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/uni-agent
          ref: 13328b241be45fab6f70efb597933e0518ae5821
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
