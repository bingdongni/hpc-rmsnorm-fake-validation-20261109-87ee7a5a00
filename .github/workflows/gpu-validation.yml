name: Check distribution, change-point and tile solvers
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  pot:
    name: POT exact barycenter (NumPy, JAX and PyTorch)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/POT
        ref: c00a032b7e5b2a68f4ded33bafac6a7925faccb4
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Build and test the candidate
      run: 'git submodule update --init --depth=1 deps/eigen || { sudo apt-get update
        -qq && sudo apt-get install -y libeigen3-dev && export CPLUS_INCLUDE_PATH=/usr/include/eigen3;
        }

        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

        python -m pip install -e . pytest jax

        python -m pytest -q test/test_1d_solver.py

        python examples/barycenters/plot_free_support_1d.py'
  ruptures:
    name: Poisson cost and full ruptures suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/ruptures
        ref: bc87634b6602d51658fd22c62881133ed3a2cd8d
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Build and test the candidate
      run: 'python -m pip install -e . pytest matplotlib typing_extensions

        python -m pytest -q -o addopts="" tests'
