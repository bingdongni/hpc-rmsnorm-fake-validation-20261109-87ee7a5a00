name: Checkpoint tensor registration validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    runs-on: [self-hosted, Windows, X64, checkpoint-tensor-gpu-5129ad4ef9]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    env:
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: MoonshotAI/checkpoint-engine
          ref: 0ac607299eb711cdd6b164e9eba04a7ade9cf98b
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/checkpoint-engine
          ref: 8d5f2a6ad37a13a1f8556286c8971b2632495fe7
          path: patched
          persist-credentials: false
      - name: Verify sources and CUDA device
        run: |
          if ((git -C baseline rev-parse HEAD) -ne '0ac607299eb711cdd6b164e9eba04a7ade9cf98b') { throw 'Wrong baseline' }
          if ((git -C patched rev-parse HEAD) -ne '8d5f2a6ad37a13a1f8556286c8971b2632495fe7') { throw 'Wrong patch' }
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -c "import torch; assert torch.cuda.is_available(); print('GPU:', torch.cuda.get_device_name(0))"
          if ($LASTEXITCODE -ne 0) { throw 'CUDA unavailable' }
      - name: Confirm baseline failures
        run: |
          Copy-Item -LiteralPath patched\tests\test_strided_pin_memory.py -Destination baseline\tests\test_strided_pin_memory.py
          $env:PYTHONPATH = "C:\PR\checkpoint-engine-deps-20261109;$env:GITHUB_WORKSPACE\baseline"
          Set-Location baseline
          $output = & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -m pytest -q --tb=no tests\test_strided_pin_memory.py 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 1 -or $output -notmatch '3 failed') { throw 'Unexpected baseline result' }
          exit 0
      - name: Test PyTorch 2.6 and 2.11
        run: |
          $env:PYTHONPATH = "C:\PR\checkpoint-engine-deps-20261109;$env:GITHUB_WORKSPACE\patched"
          Set-Location patched
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -c "import torch; print('PyTorch:', torch.__version__, 'CUDA:', torch.version.cuda)"
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -m pytest -q tests\test_strided_pin_memory.py
          if ($LASTEXITCODE -ne 0) { throw 'PyTorch 2.6 regression failed' }
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -c "import torch; print('PyTorch:', torch.__version__, 'CUDA:', torch.version.cuda)"
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -m pytest -q tests\test_strided_pin_memory.py
          if ($LASTEXITCODE -ne 0) { throw 'PyTorch 2.11 regression failed' }
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            torch: '2.5.1'
          - python: '3.12'
            torch: '2.6.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/checkpoint-engine
          ref: 8d5f2a6ad37a13a1f8556286c8971b2632495fe7
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[p2p]' pytest
      - name: Run CPU suite
        run: python -m pytest -q -m 'not gpu' tests
