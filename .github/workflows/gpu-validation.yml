name: POT documentation for rectangular barycenter grids
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  docs:
    name: Build POT and all documentation examples
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '3'
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
    steps:
    - name: Check out POT with its pinned Eigen dependency
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/POT
        ref: 8108ebfd6b5edfdb14d9a2df23e0182ddbcbc04c
        persist-credentials: false
        submodules: recursive
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install the source package and documentation dependencies
      run: "python -m pip install --upgrade pip\npython -m pip install torch --index-url\
        \ https://download.pytorch.org/whl/cpu\npython -m pip install -e . -r docs/requirements.txt\
        \ ipython\nif ! command -v ffmpeg; then\n  python -m pip install imageio-ffmpeg\n\
        \  mkdir -p \"$RUNNER_TEMP/pot-media\"\n  ln -s \"$(python -c 'import imageio_ffmpeg;\
        \ print(imageio_ffmpeg.get_ffmpeg_exe())')\" \"$RUNNER_TEMP/pot-media/ffmpeg\"\
        \n  echo \"$RUNNER_TEMP/pot-media\" >> \"$GITHUB_PATH\"\n  export PATH=\"\
        $RUNNER_TEMP/pot-media:$PATH\"\nfi\nffmpeg -version\npython -c \"import ot;\
        \ print(ot.__file__)\"\n"
    - name: Build the complete upstream gallery and HTML manual
      working-directory: docs
      run: 'make html > "$RUNNER_TEMP/pot-html.log" 2>&1 || { tail -n 160 "$RUNNER_TEMP/pot-html.log";
        exit 1; }

        tail -n 28 "$RUNNER_TEMP/pot-html.log"'
    - name: Check the rendered user guide and generated example
      run: 'python - <<''PY''

        from pathlib import Path

        root = Path(''docs/build/html'')

        name = ''plot_barycenter_output_grid''

        example = root / ''auto_examples'' / ''barycenters'' / (name + ''.html'')

        guide = (root / ''user_guide.html'').read_text()

        assert example.is_file() and ''barycenters/'' + name + ''.html'' in guide

        assert any(name in f.name and f.suffix == ''.png'' for f in (root / ''_images'').iterdir())

        print(''Verified user guide hyperlink, example page, and rendered grid figure'')

        PY'
    - name: Keep the Sphinx build output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pot-documentation-log
        path: ${{ runner.temp }}/pot-html.log
        if-no-files-found: ignore
        retention-days: 4
