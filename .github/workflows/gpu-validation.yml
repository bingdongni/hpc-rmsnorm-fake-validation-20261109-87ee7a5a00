name: Test the external Tantivy segment plugin API
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  plugin:
    name: Sorted segment writes and live document merges
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/tantivy
        ref: d5ee4c94c9b255ccdb1df8aba79c2321e97fe4a6
        persist-credentials: false
    - name: Exercise sorting and deletion from an external plugin
      run: "rustup update stable --no-self-update\nrustup default stable\nrustc -V\n\
        cat > tests/external_mapping.rs <<'RUST'\nuse std::any::Any;\nuse std::sync::{Arc,\
        \ Mutex};\nuse tantivy::indexer::doc_id_mapping::DocIdMapping;\nuse tantivy::indexer::NoMergePolicy;\n\
        use tantivy::schema::{Schema, FAST, INDEXED};\nuse tantivy::{\n    doc, Index,\
        \ IndexSettings, IndexSortByField, IndexWriter, Order, PluginMergeContext,\n\
        \    PluginWriter, PluginWriterContext, Segment, SegmentPlugin, Term,\n};\n\
        \n#[derive(Clone, Default)]\nstruct Probe {\n    flushed: Arc<Mutex<Vec<Vec<u32>>>>,\n\
        \    merged: Arc<Mutex<Vec<u64>>>,\n}\nimpl PluginWriter for Probe {\n   \
        \ fn serialize(self: Box<Self>, _: &Segment, map: Option<&DocIdMapping>) ->\
        \ tantivy::Result<()> {\n        let map = map.expect(\"index sorting supplies\
        \ a map\");\n        let old_ids: Vec<_> = map.iter_old_doc_ids().collect();\n\
        \        for (new, &old) in old_ids.iter().enumerate() {\n            assert_eq!(map.get_new_doc_id(old),\
        \ new as u32);\n        }\n        self.flushed.lock().unwrap().push(old_ids);\n\
        \        Ok(())\n    }\n    fn mem_usage(&self) -> usize { 0 }\n    fn as_any(&self)\
        \ -> &dyn Any { self }\n    fn as_any_mut(&mut self) -> &mut dyn Any { self\
        \ }\n}\nimpl SegmentPlugin for Probe {\n    fn extensions(&self) -> &[&str]\
        \ { &[] }\n    fn create_writer(&self, _: &PluginWriterContext) -> tantivy::Result<Box<dyn\
        \ PluginWriter>> {\n        Ok(Box::new(self.clone()))\n    }\n    fn merge(&self,\
        \ ctx: PluginMergeContext) -> tantivy::Result<()> {\n        let columns:\
        \ Vec<_> = ctx.readers.iter().map(|r| r.fast_fields().u64(\"key\"))\n    \
        \        .collect::<tantivy::Result<_>>()?;\n        *self.merged.lock().unwrap()\
        \ = ctx.doc_id_mapping.iter_old_doc_addrs()\n            .map(|a| columns[a.segment_ord\
        \ as usize].first(a.doc_id).unwrap()).collect();\n        Ok(())\n    }\n\
        }\n#[test]\nfn external_plugin_sees_sorted_documents_and_live_merge_order()\
        \ -> tantivy::Result<()> {\n    let mut schema = Schema::builder();\n    let\
        \ key = schema.add_u64_field(\"key\", FAST | INDEXED);\n    let probe = Probe::default();\n\
        \    let index = Index::builder().schema(schema.build()).settings(IndexSettings\
        \ {\n        sort_by_field: Some(IndexSortByField { field: \"key\".into(),\
        \ order: Order::Asc }),\n        ..Default::default()\n    }).register_plugin(Arc::new(probe.clone())).create_in_ram()?;\n\
        \    let mut writer: IndexWriter = index.writer_with_num_threads(1, 20_000_000)?;\n\
        \    writer.set_merge_policy(Box::new(NoMergePolicy));\n    for keys in [[4_u64,\
        \ 1, 6], [3_u64, 2, 5]] {\n        for k in keys { writer.add_document(doc!(key\
        \ => k))?; }\n        writer.commit()?;\n    }\n    let flushed = probe.flushed.lock().unwrap().clone();\n\
        \    assert_eq!(flushed, [vec![1,0,2], vec![1,0,2]]);\n    writer.delete_term(Term::from_field_u64(key,\
        \ 4));\n    writer.commit()?;\n    writer.merge(&index.searchable_segment_ids()?).wait()?;\n\
        \    assert_eq!(*probe.merged.lock().unwrap(), [1, 2, 3, 5, 6]);\n    let\
        \ searcher = index.reader()?.searcher();\n    let col = searcher.segment_reader(0).fast_fields().u64(\"\
        key\")?;\n    for (i,key) in probe.merged.lock().unwrap().iter().enumerate()\
        \ {\n        assert_eq!(Some(*key), col.first(i as u32));\n    }\n    Ok(())\n\
        }\nRUST\ncargo test -p tantivy --test external_mapping\ncargo test -p tantivy\
        \ --doc iter_old_doc_ids\ncargo test -p tantivy --lib plugin::tests::test_plugin_full_lifecycle"
