name: Validate acoustic-field algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: acoustic-field
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: LCAV/pyroomacoustics
        ref: eb399899e3b39088f8a2576d9228659eb95e8b51
        persist-credentials: false
    - name: Apply verified change
      shell: bash
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        git diff --check'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run tests
      shell: bash
      run: 'set -euo pipefail

        export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MPLBACKEND=Agg

        python -m pip install -q black==26.1.0 isort==7.0.0 pytest pybind11 scipy
        matplotlib soundfile

        python -m black --check pyroomacoustics/beamforming.py tests/test_rake_filters.py

        python -m isort --check pyroomacoustics/beamforming.py tests/test_rake_filters.py

        python -m pip install -q -e .

        python -m pytest -q tests/test_rake_filters.py

        echo 
        | base64 -d > /tmp/steering-test.py

        python /tmp/steering-test.py

        '
