name: Checkpoint review follow-up validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    runs-on: [self-hosted, Windows, X64, checkpoint-inplace-gpu-1761e988e1]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    env:
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/checkpoint-engine
          ref: 33405fab083cff8058426855e05d3b9944a5dc43
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/checkpoint-engine
          ref: 5d293e95c809afe13c6ee86b4710f5ea54c53040
          path: patched
          persist-credentials: false
      - name: Verify device and reproduce review finding
        run: |
          if ((git -C baseline rev-parse HEAD) -ne '33405fab083cff8058426855e05d3b9944a5dc43') { throw 'Wrong baseline' }
          if ((git -C patched rev-parse HEAD) -ne '5d293e95c809afe13c6ee86b4710f5ea54c53040') { throw 'Wrong patch' }
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -c "import torch; assert torch.cuda.is_available(); print('GPU:', torch.cuda.get_device_name(0), 'PyTorch:', torch.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'CUDA unavailable' }
          Copy-Item -LiteralPath patched\tests\test_inplace_pin_failures.py -Destination baseline\tests\test_inplace_pin_failures.py
          $env:PYTHONPATH = "C:\PR\checkpoint-engine-deps-20261109;$env:GITHUB_WORKSPACE\baseline"
          Set-Location baseline
          $output = & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -m pytest -q --tb=no tests\test_inplace_pin_failures.py -k unlink_failure -m gpu 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 1 -or $output -notmatch '1 failed') { throw 'Unexpected baseline result' }
          exit 0
      - name: Test real CUDA pinning and unlink recovery
        run: |
          $env:PYTHONPATH = "C:\PR\checkpoint-engine-deps-20261109;$env:GITHUB_WORKSPACE\patched"
          Set-Location patched
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -m pytest -q tests\test_inplace_pin_failures.py
          if ($LASTEXITCODE -ne 0) { throw 'CUDA regression failed' }
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            torch: '2.5.1'
          - python: '3.12'
            torch: '2.6.0'
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/checkpoint-engine
          ref: 33405fab083cff8058426855e05d3b9944a5dc43
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/checkpoint-engine
          ref: 5d293e95c809afe13c6ee86b4710f5ea54c53040
          path: patched
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Check line endings and diff size
        run: |
          cd patched
          python -c "from pathlib import Path; paths=['checkpoint_engine/pin_memory.py','checkpoint_engine/ps.py','tests/test_inplace_pin_failures.py']; assert all(b'\r\n' not in Path(p).read_bytes() for p in paths); print('All changed files use LF')"
          git diff --numstat 0ac607299eb711cdd6b164e9eba04a7ade9cf98b 5d293e95c809afe13c6ee86b4710f5ea54c53040 -- checkpoint_engine/pin_memory.py checkpoint_engine/ps.py
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e './patched[p2p]' pytest
      - name: Reproduce review finding
        run: |
          cp patched/tests/test_inplace_pin_failures.py baseline/tests/
          cd baseline
          set +e
          PYTHONPATH="$PWD" python -m pytest -q --tb=no tests/test_inplace_pin_failures.py -k unlink_failure -m 'not gpu' > baseline-test.log 2>&1
          code=$?
          set -e
          cat baseline-test.log
          test "$code" = 1
          grep -q '1 failed' baseline-test.log
      - name: Run CPU suite including /dev/shm regression
        run: |
          cd patched
          PYTHONPATH="$PWD" python -m pytest -q -m 'not gpu' tests
