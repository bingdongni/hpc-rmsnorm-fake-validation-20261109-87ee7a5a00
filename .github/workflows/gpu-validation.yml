name: Agent-R1 masked reward regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    runs-on: [self-hosted, Windows, X64, agentr1-reward-583e6a4308]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    env:
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: AgentR1/Agent-R1
          ref: b124aa46534cbf2fb8bc8af11405774984c42ac7
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/Agent-R1
          ref: c87e51217a1c3996491d835cc69493969e9ea4e2
          path: candidate
          persist-credentials: false
      - name: Verify baseline and candidate
        run: |
          if ((git -C baseline rev-parse HEAD) -ne 'b124aa46534cbf2fb8bc8af11405774984c42ac7') { throw 'Wrong baseline' }
          if ((git -C candidate rev-parse HEAD) -ne 'c87e51217a1c3996491d835cc69493969e9ea4e2') { throw 'Wrong candidate' }
          $env:AGENTR1_BASE = Join-Path $env:GITHUB_WORKSPACE 'baseline'
          $env:AGENTR1_CANDIDATE = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $env:AGENTR1_HARNESS = Join-Path $env:GITHUB_WORKSPACE 'harness/agentr1_run_unit_tests.py'
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' (Join-Path $env:GITHUB_WORKSPACE 'harness/agentr1_gpu_validation_runner.py')
          if ($LASTEXITCODE -ne 0) { throw 'Reward regression failed' }
