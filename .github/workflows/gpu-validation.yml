name: HQQ grouped 3-bit row counts
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  gpu:
    name: 3-bit dequantization on CPU and RTX 4060
    runs-on:
    - self-hosted
    - Windows
    - X64
    - hqq-3bit-review-884ff15851
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/hqq
        ref: aea9c56c7ed3056024cf2f93f8cb2064d828d039
        path: candidate
        persist-credentials: false
    - name: Exercise both grouping axes and the CUDA linear layer
      working-directory: candidate
      shell: pwsh
      run: '$py=''C:/PR/torchao-gpu-venv-20261109/Scripts/python.exe''

        $env:PYTHONPATH=(Get-Location).Path + '';C:/PR/pr-followup-20261118-0818/hqq-deps''

        & $py -m pytest -q tests/test_bitpack.py -k test_3bit_dequantize

        if ($LASTEXITCODE) {throw ''Quantizer regression failed''}

        & $py ../validation/cuda.py

        if ($LASTEXITCODE) {throw ''Exact CUDA comparisons failed''}

        '
