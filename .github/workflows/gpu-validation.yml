name: Mamba state cache and Aurora grid validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    name: Aurora batch and forecast tests (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/aurora
          path: aurora
          ref: c4dd000dee814ef347dee581dea658a1d50fd9ff
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and Aurora
        working-directory: aurora
        run: |
          test "$(git rev-parse HEAD)" = c4dd000dee814ef347dee581dea658a1d50fd9ff
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install . pytest requests 'ruff==0.4.1'
      - name: Check the batch API and the small Aurora 1.5 forecast
        working-directory: aurora
        run: |
          export HF_HOME="$RUNNER_TEMP/huggingface"
          python ../validation/aurora_fixtures.py "$HF_HOME"
          python -m ruff check aurora/batch.py tests/test_batch.py
          python -m ruff format --check aurora/batch.py tests/test_batch.py
          python -m pytest -q --tb=short tests/test_batch.py tests/v1p5/test_forward.py
  gpu:
    name: Mamba and Aurora on RTX 4060 (self-hosted)
    runs-on: [self-hosted, Windows, X64, state-grid-40ec5913a4]
    timeout-minutes: 24
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      HF_HUB_OFFLINE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: state-spaces/mamba
          ref: e9594ce1c732d97440f0332fdc43170a2294dbfa
          path: mamba-base
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/mamba
          ref: 442cc0a7008c7d096e59e7a3ea7ece6daf3d1861
          path: mamba
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/aurora
          ref: c4dd000dee814ef347dee581dea658a1d50fd9ff
          path: aurora
          persist-credentials: false
      - name: Check 11 published fields against SciPy and backpropagate through an Aurora forecast
        working-directory: aurora
        run: |
          if ((git rev-parse HEAD) -ne 'c4dd000dee814ef347dee581dea658a1d50fd9ff') { throw 'Unexpected Aurora revision' }
          $python = 'D:\Python\python.exe'
          $env:PYTHONPATH = "$PWD;C:\PR\pr-followup-20261115-1741\aurora-deps;C:\PR\pr-followup-20261115-evening\jax-deps"
          $env:HF_HOME = 'C:\PR\pr-followup-20261115-1741\aurora-hf'
          & $python -c "from pathlib import Path; import aurora,torch; assert Path(aurora.__file__).resolve().is_relative_to(Path.cwd()); assert torch.cuda.is_available(); print(torch.__version__,torch.cuda.get_device_name())"
          if ($LASTEXITCODE) { throw 'Aurora source or device mismatch' }
          & $python -m pytest -q --tb=short tests/test_batch.py
          if ($LASTEXITCODE) { throw 'Batch regression' }
          & $python ..\validation\aurora_probe.py C:\PR\pr-followup-20261115-1741\aurora-0.4-air-pollution-static.nc
          if ($LASTEXITCODE) { throw 'Forecast or numerical parity check failed' }
      - name: Compare every selective-state-update GPU test on upstream and the feature branch
        run: |
          if ((git -C mamba-base rev-parse HEAD) -ne 'e9594ce1c732d97440f0332fdc43170a2294dbfa' -or (git -C mamba rev-parse HEAD) -ne '442cc0a7008c7d096e59e7a3ea7ece6daf3d1861') { throw 'Unexpected Mamba revision' }
          $python = 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe'
          $env:PYTHONPATH = 'C:\PR\fla-research-deps-20261110;C:\PR\fla-model-deps-20261110;C:\PR\pr-followup-20261115-evening\ct-deps'
          $env:CUDA_PATH = 'C:\PR\fla-research-deps-20261110\triton\backends\nvidia'
          $env:CC = 'C:\PR\fla-research-deps-20261110\triton\runtime\tcc\tcc.exe'
          & $python validation\mamba_suites.py mamba-base mamba
          if ($LASTEXITCODE) { throw 'GPU suite regression' }
      - name: Check scoring and committing candidate tokens from shared parent states
        working-directory: mamba
        run: |
          $python = 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe'
          $env:PYTHONPATH = "$PWD;C:\PR\fla-research-deps-20261110;C:\PR\fla-model-deps-20261110;C:\PR\pr-followup-20261115-evening\ct-deps"
          $env:CUDA_PATH = 'C:\PR\fla-research-deps-20261110\triton\backends\nvidia'
          $env:CC = 'C:\PR\fla-research-deps-20261110\triton\runtime\tcc\tcc.exe'
          & $python ..\validation\mamba_probe.py
          if ($LASTEXITCODE) { throw 'Shared-state parity failed' }
