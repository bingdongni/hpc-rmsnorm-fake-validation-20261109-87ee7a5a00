name: Validate stationary-prior algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: stationary-prior
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: pykalman/pykalman
        ref: d62e60be00bd028ecc7eea6a8bea02f583910428
        persist-credentials: false
    - name: Apply verified change
      shell: bash
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        git diff --check'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run tests
      shell: bash
      run: 'set -euo pipefail

        python -m pip install ''.[tests]'' statsmodels

        python -m pytest -q pykalman/tests

        echo 
        | base64 -d > /tmp/kal-oracle.py

        python /tmp/kal-oracle.py

        '
