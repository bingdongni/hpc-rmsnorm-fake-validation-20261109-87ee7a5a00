name: Agent-R1 sequence normalization regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    runs-on: [self-hosted, Windows, X64, agentr1-sequence-bd9a9429f4]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    env:
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: AgentR1/Agent-R1
          ref: b124aa46534cbf2fb8bc8af11405774984c42ac7
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/Agent-R1
          ref: 722682ba0706282b0f4aa9dcc0ff0ebe595a513d
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: verl-project/verl
          ref: f9c855f7cf04d603c9546bc01776c74806a879c1
          path: verl
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            verl/trainer/ppo/core_algos.py
            verl/utils/torch_functional.py
      - name: Verify baseline and candidate
        run: |
          if ((git -C baseline rev-parse HEAD) -ne 'b124aa46534cbf2fb8bc8af11405774984c42ac7') { throw 'Wrong baseline' }
          if ((git -C candidate rev-parse HEAD) -ne '722682ba0706282b0f4aa9dcc0ff0ebe595a513d') { throw 'Wrong candidate' }
          if ((git -C verl rev-parse HEAD) -ne 'f9c855f7cf04d603c9546bc01776c74806a879c1') { throw 'Wrong verl revision' }
          $env:AGENTR1_BASE = Join-Path $env:GITHUB_WORKSPACE 'baseline'
          $env:AGENTR1_CANDIDATE = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $env:AGENTR1_HARNESS = Join-Path $env:GITHUB_WORKSPACE 'harness/agentr1_run_sequence_tests.py'
          $env:AGENTR1_GLOO = Join-Path $env:GITHUB_WORKSPACE 'harness/agentr1_sequence_gloo_probe.py'
          $env:AGENTR1_VERL_SOURCE = Join-Path $env:GITHUB_WORKSPACE 'verl/verl/trainer/ppo/core_algos.py'
          $env:AGENTR1_VERL_FUNCTIONAL = Join-Path $env:GITHUB_WORKSPACE 'verl/verl/utils/torch_functional.py'
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' (Join-Path $env:GITHUB_WORKSPACE 'harness/agentr1_sequence_validation_runner.py')
          if ($LASTEXITCODE -ne 0) { throw 'Sequence normalization regression failed' }
