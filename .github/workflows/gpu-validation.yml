name: Check odd-width whitening in the TeamTomo monorepo
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux:
    name: Public API comparisons (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      SCIPY_ARRAY_API: '1'
      CUBLAS_WORKSPACE_CONFIG: :4096:8
    steps:
    - &id001
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: tomo
        repository: bingdongni/teamtomo
        ref: 085eaa52a5414b4e707587c9e33662fdb5fdb606
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for tomo
      run: git -C tomo worktree add --detach ../tomo-base-bf0701be 013b48bcc18d1f5d5e87877f297d82154f39be69
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install test dependencies
      run: 'python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install pytest numpy scipy einops packaging torch-grid-utils
        torch-ctf starfile'
    - name: tomo public API comparison and regression tests
      run: 'python validation/compare.py tomo tomo-base-bf0701be cpu base

        python validation/compare.py tomo tomo cpu candidate

        python validation/test_suite.py tomo'
  gpu:
    name: Public API comparisons (RTX 4060)
    runs-on:
    - self-hosted
    - Windows
    - X64
    - canonical-teamtomo-odd-width-3c85b9cfd6
    timeout-minutes: 40
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      SCIPY_ARRAY_API: '1'
      CUBLAS_WORKSPACE_CONFIG: :4096:8
    steps:
    - *id001
    - name: Mask runner identifiers
      run: 'Write-Output "::add-mask::$env:MASK_MACHINE"

        Write-Output "::add-mask::$env:MASK_USER"'
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: tomo
        repository: bingdongni/teamtomo
        ref: 085eaa52a5414b4e707587c9e33662fdb5fdb606
        fetch-depth: 2
        persist-credentials: false
    - name: Check out upstream parent for tomo
      run: git -C tomo worktree add --detach ../tomo-base-bf0701be 013b48bcc18d1f5d5e87877f297d82154f39be69
    - name: tomo public API comparison and regression tests
      run: '& ''C:\PR\pr-followup-20261116-six\deps\Scripts\python.exe'' validation/compare.py
        tomo tomo-base-bf0701be cuda base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-six\deps\Scripts\python.exe'' validation/compare.py
        tomo tomo cuda candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-six\deps\Scripts\python.exe'' validation/test_suite.py
        tomo'
