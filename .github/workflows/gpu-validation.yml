name: Compare VICReg dense and blocked gradients on current and legacy PyTorch
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux-lightly:
    name: Linux lightly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      SCIPY_ARRAY_API: '1'
      CUBLAS_WORKSPACE_CONFIG: :4096:8
    steps:
    - &id001
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - &id002
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: lightly
        repository: bingdongni/lightly
        ref: d0e3da4d5c57c136b9015afd2f00befd6935bb81
        persist-credentials: false
        fetch-depth: 5
    - name: Check out upstream parent
      run: git -C lightly worktree add --detach ../pli84244 4340fa42392e65eadbe8e5411b63aea9f7fb2596
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install CPU PyTorch and Lightly
      run: 'python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install ./lightly pytest pytest-mock'
    - name: Compare the public API and run neighboring regressions
      run: 'python -m torch.distributed.run --standalone --nproc-per-node=2 validation/compare.py
        lightly pli84244 cpu base

        python -m torch.distributed.run --standalone --nproc-per-node=2 validation/compare.py
        lightly lightly cpu candidate

        python validation/test_suite.py lightly'
  legacy1100:
    name: Linux torch 1.10.0 lightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
    - *id001
    - *id002
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.9'
    - name: Install legacy CPU wheel
      run: python -m pip install 'numpy<2' 'torch==1.10.0+cpu' 'torchvision==0.11.1+cpu'
        -f https://download.pytorch.org/whl/cpu/torch_stable.html
    - name: Test the VICRegLoss source module and its second derivatives
      run: python validation/old_module.py lightly
  legacy1110:
    name: Linux torch 1.11.0 lightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
    - *id001
    - *id002
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.9'
    - name: Install legacy CPU wheel
      run: python -m pip install 'numpy<2' 'torch==1.11.0+cpu' 'torchvision==0.12.0+cpu'
        -f https://download.pytorch.org/whl/cpu/torch_stable.html
    - name: Test the VICRegLoss source module and its second derivatives
      run: python validation/old_module.py lightly
  gpu:
    name: RTX 4060 lightly
    runs-on:
    - self-hosted
    - Windows
    - X64
    - vicreg-grad-scaled-bbb190e5ac
    timeout-minutes: 45
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      SCIPY_ARRAY_API: '1'
      CUBLAS_WORKSPACE_CONFIG: :4096:8
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - name: Mask runner identifiers
      run: 'Write-Output "::add-mask::$env:MASK_MACHINE"

        Write-Output "::add-mask::$env:MASK_USER"'
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: lightly
        repository: bingdongni/lightly
        ref: d0e3da4d5c57c136b9015afd2f00befd6935bb81
        persist-credentials: false
        fetch-depth: 5
    - name: Check out upstream parent
      run: git -C lightly worktree add --detach ../pli83f55 4340fa42392e65eadbe8e5411b63aea9f7fb2596
    - name: Compare the public API and run neighboring regressions
      run: '& ''C:\PR\pr-followup-20261117-frontier\deps\Scripts\python.exe'' validation/compare.py
        lightly pli83f55 cuda base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261117-frontier\deps\Scripts\python.exe'' validation/compare.py
        lightly lightly cuda candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261117-frontier\deps\Scripts\python.exe'' validation/test_suite.py
        lightly'
