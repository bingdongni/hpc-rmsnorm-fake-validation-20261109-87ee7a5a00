name: Validate antmaze algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  v1:
    name: AntMaze medium-play-v1 episode statistics
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
    - name: Measure recorded trajectories
      run: 'set -euo pipefail

        python -m pip -q install h5py numpy

        curl -fL --retry 3 --silent --show-error "https://huggingface.co/datasets/farama-minari/D4RL/resolve/a0fd465d1d9d253b075d532b270e03d8fb4f46e6/antmaze/medium-play-v1/data/main_data.hdf5?download=true"
        -o "$RUNNER_TEMP/ant.h5"

        sha256sum "$RUNNER_TEMP/ant.h5"

        echo 
        | base64 -d > "$RUNNER_TEMP/stats.py"

        python "$RUNNER_TEMP/stats.py" "$RUNNER_TEMP/ant.h5"'
  v2:
    name: AntMaze medium-play-v2 episode statistics
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
    - name: Measure recorded trajectories
      run: 'set -euo pipefail

        python -m pip -q install h5py numpy

        curl -fL --retry 3 --silent --show-error "https://huggingface.co/datasets/farama-minari/D4RL/resolve/a0fd465d1d9d253b075d532b270e03d8fb4f46e6/antmaze/medium-play-v2/data/main_data.hdf5?download=true"
        -o "$RUNNER_TEMP/ant.h5"

        sha256sum "$RUNNER_TEMP/ant.h5"

        echo 
        | base64 -d > "$RUNNER_TEMP/stats.py"

        python "$RUNNER_TEMP/stats.py" "$RUNNER_TEMP/ant.h5"'
