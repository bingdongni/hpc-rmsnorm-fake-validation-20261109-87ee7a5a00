name: Validate MACE Hessian review fixes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mace:
    name: MACE vibrations, force derivatives and checkpoint references (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/mace
          ref: 2cc4e24570a3eff124b96b7e7ebca9aaf0c1c1be
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch and run the numerical regression suites
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[test]' black==26.5.1 isort==8.0.1
          black --check mace/calculators/vibrations tests/unit/vibrations
          isort --check-only mace/calculators/vibrations tests/unit/vibrations
          python -m pytest -q tests/unit/vibrations tests/unit/test_physics_glue.py tests/golden/test_tiny_anchors.py
  gpu:
    name: Mixed precision, field and inference-mode products (RTX 4060)
    runs-on: [self-hosted, Windows, X64, mace-hessian-review-6cb3d40918]
    timeout-minutes: 30
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/mace
          ref: 2cc4e24570a3eff124b96b7e7ebca9aaf0c1c1be
          path: mace
          persist-credentials: false
      - name: Compare with separate dense CUDA Hessians in both dtype orders
        env:
          TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: '1'
        run: |
          & 'C:\PR\pr-followup-20261115-2027\mace-env\Scripts\python.exe' validation\mace_gpu.py mace
          if ($LASTEXITCODE) { throw 'MACE CUDA verification failed' }
