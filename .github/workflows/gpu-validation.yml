name: KDA model regression comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpu:
    name: KDA model suite on base and PR 1713 (RTX 4060)
    runs-on: [self-hosted, Windows, X64, kda-models-5cc66d8d8a]
    timeout-minutes: 30
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: fla-org/flash-linear-attention
          ref: b8da4873fa0834849b64938af9f89bc35a347d90
          path: base
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/flash-linear-attention
          ref: 9ac47b38bd6a6e6cd4071c05d3b5dc544ea4114d
          path: candidate
          persist-credentials: false
      - name: Compare all 15 KDA model cases and their reference error metrics
        run: |
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' validation\fla_models.py base candidate
          if ($LASTEXITCODE) { throw 'KDA regression comparison failed' }
