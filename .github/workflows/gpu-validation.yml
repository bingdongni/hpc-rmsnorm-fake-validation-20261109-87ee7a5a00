name: Multi-caption retrieval and scientific grid coordinates
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  openclip:
    name: OpenCLIP CSV, retrieval and task evaluation (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
    - &id002
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: openclip
        persist-credentials: false
        repository: bingdongni/open_clip
        ref: 9a8f3824e971d77bc5762451fc45048d4bb62903
    - &id001
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - working-directory: openclip
      run: 'python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install -e ''.[training]'' pytest

        python -m pytest -q tests/test_retrieval_metrics.py tests/test_data_csv.py tests/test_eval_task.py'
  pyscf:
    name: PySCF cube generation and peak RSS (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: candidate
        persist-credentials: false
        repository: bingdongni/pyscf
        ref: 33d1ddafa8ea1c0ebd94c0df8e092b4efafb7bac
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: base
        persist-credentials: false
        repository: pyscf/pyscf
        ref: 2db72d6b044f6a75bf7da21e58fb38da82ba0244
    - *id001
    - run: 'python -m pip install pyscf pytest

        python validation/cube_check.py candidate base'
  gpu:
    name: OpenCLIP RN50 Flickr8k validation (RTX 4060)
    runs-on:
    - self-hosted
    - Windows
    - X64
    - retrieval-and-grids-f5e4aff2ba
    timeout-minutes: 30
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - *id002
    - name: Run paired and multi-caption CSV evaluation against a stable dense oracle
      run: '& ''C:\PR\pr-followup-20261115-2326\clip-env\Scripts\python.exe'' validation/gpu_retrieval.py openclip ''C:\PR\pr-followup-20261115-2326\assets''

        if ($LASTEXITCODE) { throw ''Flickr8k evaluation failed'' }'
    - name: Exercise retrieval and data tests
      working-directory: openclip
      run: '$env:PYTHONPATH = (Resolve-Path src).Path

        & ''C:\PR\pr-followup-20261115-2326\clip-env\Scripts\python.exe'' -m pytest -q tests/test_retrieval_metrics.py tests/test_data_csv.py tests/test_eval_task.py

        if ($LASTEXITCODE) { throw ''OpenCLIP tests failed'' }'
