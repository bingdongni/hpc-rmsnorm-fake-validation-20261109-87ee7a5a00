name: Verify PySAT and Minari review fixes
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  sat:
    name: Concrete SAT solvers, CLI and upstream suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/pysat
        ref: 7749fe4d4fc4051ef91b01e56f412190bd795431
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Validate reviewed commit
      run: "python -m pip install \"python-sat[cryptosat]==1.9.dev23\" pytest -r requirements.txt\n\
        PYTHONPATH=. python - <<'PY'\nfrom itertools import product\nimport inspect\n\
        from pysat import solvers\nclasses = [c for _, c in inspect.getmembers(solvers,\
        \ inspect.isclass)\n           if c.__module__ == solvers.__name__ and 'enum_models'\
        \ in vars(c)\n           and c not in (solvers.Solver, solvers.Kissat404)]\n\
        passed=[]\nskipped=[]\nfor cls in classes:\n    if cls is solvers.Ergo and\
        \ not solvers.ergo_present or cls is solvers.CryptoMinisat and not solvers.cms_present:\n\
        \        skipped.append(cls.__name__)\n        continue\n    # Compare both\
        \ paths against the six satisfying assignments of the formula.\n    clauses=[[1,\
        \ 2], [-1, 3]]\n    expected={tuple(i if value else -i for i,value in enumerate(row,1))\n\
        \              for row in product((False,True),repeat=3)\n              if\
        \ (row[0] or row[1]) and (not row[0] or row[2])}\n    with cls(bootstrap_with=clauses)\
        \ as s:\n        full=[tuple(m) for m in s.enum_models()]\n        assert\
        \ len(full)==len(expected) and set(full)==expected,(cls.__name__,full,expected)\n\
        \    with cls(bootstrap_with=clauses) as s:\n        projected=[tuple(m) for\
        \ m in s.enum_models(assumptions=[2], projection=[3, 1])]\n        wanted={(m[2],m[0])\
        \ for m in expected if m[1]>0}\n        assert len(projected)==len(wanted)\
        \ and set(projected)==wanted,(cls.__name__,projected,wanted)\n    with cls(bootstrap_with=[[1]])\
        \ as s:\n        assert list(s.enum_models(projection=[]))==[[]],cls.__name__\n\
        \    passed.append(cls.__name__)\nprint('Native backends verified:', len(passed),\
        \ ', '.join(passed))\nprint('Unavailable optional backends:', skipped)\nPY\n\
        PYTHONPATH=. python - <<'PY'\nfrom subprocess import run\nfrom pathlib import\
        \ Path\nfrom tempfile import TemporaryDirectory\nimport sys\nwith TemporaryDirectory()\
        \ as tmp:\n    p=Path(tmp)/'witness.cnf'\n    p.write_text('p cnf 14 13\\\
        n1 2 0\\n'+''.join(f'1 {i} 0\\n' for i in range(3,15)))\n    def enum(opts):\n\
        \        text=run([sys.executable,'examples/models.py','-e','all',*opts,str(p)],capture_output=True,text=True,check=True).stdout\n\
        \        return [tuple(map(int,line.split()[1:-1])) for line in text.splitlines()\
        \ if line.startswith('v ')]\n    full=enum([])\n    projected=enum(['--project=1,2'])\n\
        \    assert len(full)==8193\n    assert set(projected)=={m[:2] for m in full}=={(1,2),(1,-2),(-1,2)}\n\
        \    assert len(projected)==3\n    print('Compared',len(full),'complete models\
        \ with',len(projected),'distinct CLI projections.')\nPY\npython -m pytest\
        \ -q tests"
  minari:
    name: Metadata predicate exceptions and storage backends
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/Minari
        ref: 7559efb05975875df98087783a5571655cb4bb75
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Validate reviewed commit
      run: 'python -m pip install ".[arrow,hdf5,create]" pytest pillow

        python -m pytest -q tests/data_collector/test_appended_episode_statistics.py
        tests/dataset/test_copied_episode_metadata.py tests/dataset/test_minari_storage.py'
