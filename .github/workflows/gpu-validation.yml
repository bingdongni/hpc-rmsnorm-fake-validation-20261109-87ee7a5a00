name: RMSNorm fake output validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Windows, X64, hpc-rmsnorm-review-103a8e0e21]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    env:
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      HPC_VALIDATION_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify source hashes and CUDA device
        run: |
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -c "import hashlib,pathlib; pairs=[('hpc/normalization.py','fb9434e0a6aab3f80bce0add29a0a19129ce7772841118b51c206ca64691bec8'),('tests/test_normalization.py','51fc7dca2fd00c399fb365ba401315ecdf35f9f68730fb69293ef0d410839d88'),('tests/utils.py','bccbb722ba316fe27730a2ec4a10ae93dd82a72d9fcdcb8bb739d108fc4aa539'),('baseline_normalization.py','0e6c5b8facbe341a27cf2ff4a0c67a6ca9933aa94d6dfb411f99525e6626e9b4'),('hpc_ops_fake_contract_runner_20261109.py','8d96f33ba62282dcbe33e17c66e3944565357ad3ed71edca54ec9d96f7d9cd67')]; assert all(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h for p,h in pairs); print('Source hashes verified')"
          if ($LASTEXITCODE -ne 0) { throw 'Source hash verification failed' }
          Write-Host 'Patched commit: e46405aec185db3da8faeaf74c38519f90b8737c'
          Write-Host 'Upstream baseline: 2a2e26562433a8ba4b504858f1c938eb7612c901'
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -c "import torch; assert torch.cuda.is_available(); print('GPU:',torch.cuda.get_device_name(0),'PyTorch:',torch.__version__,'CUDA:',torch.version.cuda)"
          if ($LASTEXITCODE -ne 0) { throw 'CUDA device check failed' }
      - name: Confirm baseline failures
        run: |
          $env:HPC_NORMALIZATION_SOURCE = Join-Path $env:GITHUB_WORKSPACE 'baseline_normalization.py'
          $output = & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' hpc_ops_fake_contract_runner_20261109.py 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 1 -or $output -notmatch '3 failed, 1 passed') { throw 'Unexpected baseline result' }
          exit 0
      - name: Run patched tests with a CUDA reference implementation
        run: |
          Remove-Item Env:HPC_NORMALIZATION_SOURCE -ErrorAction SilentlyContinue
          $env:HPC_INCLUDE_NUMERIC = '1'
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' hpc_ops_fake_contract_runner_20261109.py
          if ($LASTEXITCODE -ne 0) { throw 'Patched validation failed' }
