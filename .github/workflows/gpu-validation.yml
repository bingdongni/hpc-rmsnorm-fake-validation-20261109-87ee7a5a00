name: Validate covariance blocks, history cursors and burst vectors
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  gpu:
    name: RTX 4060 lightly
    runs-on:
    - self-hosted
    - Windows
    - X64
    - training-threads-bursts-a0fd9df473
    timeout-minutes: 45
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      SCIPY_ARRAY_API: '1'
      CUBLAS_WORKSPACE_CONFIG: :4096:8
    steps:
    - &id001
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - name: Mask runner identifiers
      run: 'Write-Output "::add-mask::$env:MASK_MACHINE"

        Write-Output "::add-mask::$env:MASK_USER"'
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: lightly
        repository: bingdongni/lightly
        ref: 263c9e29e7b607b46b3c07214d0c000c7cca1199
        persist-credentials: false
        fetch-depth: 2
    - name: Check out upstream parent
      run: git -C lightly worktree add --detach ../pli83f55 4340fa42392e65eadbe8e5411b63aea9f7fb2596
    - name: Compare the public API and run neighboring regressions
      run: '& ''C:\PR\pr-followup-20261117-frontier\deps\Scripts\python.exe'' validation/compare.py
        lightly pli83f55 cuda base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261117-frontier\deps\Scripts\python.exe'' validation/compare.py
        lightly lightly cuda candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261117-frontier\deps\Scripts\python.exe'' validation/test_suite.py
        lightly'
  linux-lightly:
    name: Linux lightly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env: &id002
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      SCIPY_ARRAY_API: '1'
      CUBLAS_WORKSPACE_CONFIG: :4096:8
    steps:
    - *id001
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: lightly
        repository: bingdongni/lightly
        ref: 263c9e29e7b607b46b3c07214d0c000c7cca1199
        persist-credentials: false
        fetch-depth: 2
    - name: Check out upstream parent
      run: git -C lightly worktree add --detach ../pli84244 4340fa42392e65eadbe8e5411b63aea9f7fb2596
    - &id003
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install CPU PyTorch and Lightly
      run: 'python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install ./lightly pytest pytest-mock'
    - name: Compare the public API and run neighboring regressions
      run: 'python -m torch.distributed.run --standalone --nproc-per-node=2 validation/compare.py
        lightly pli84244 cpu base

        python -m torch.distributed.run --standalone --nproc-per-node=2 validation/compare.py
        lightly lightly cpu candidate

        python validation/test_suite.py lightly'
  linux-marvin:
    name: Linux marvin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env: *id002
    steps:
    - *id001
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: marvin
        repository: bingdongni/marvin
        ref: c79bf5a7b9b904ee4eb28baed296c1b56f98cd2e
        persist-credentials: false
        fetch-depth: 2
    - name: Check out upstream parent
      run: git -C marvin worktree add --detach ../pma4f15d be92af1d777c2bddf6b06a18b8afef62b3a2a844
    - *id003
    - name: Install locked runtime and thread test dependencies
      run: 'python -m pip install uv

        uv sync --python 3.12 --project marvin --frozen --no-dev

        uv pip install --python marvin/.venv/bin/python pytest pytest-asyncio pytest-env
        pytest-xdist pytest-timeout chromadb'
    - name: Compare the public API and run neighboring regressions
      run: 'marvin/.venv/bin/python validation/compare.py marvin pma4f15d cpu base

        marvin/.venv/bin/python validation/compare.py marvin marvin cpu candidate

        cd marvin && PYTHONPATH=src .venv/bin/python -m pytest -q -o addopts= tests/basic/engine/test_threads.py'
  linux-nfs:
    name: Linux nfs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env: *id002
    steps:
    - *id001
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: nfs
        repository: bingdongni/nfstream
        ref: 5df3ef921ee02cb7a34950b785b4c0bf142f7a45
        persist-credentials: false
        fetch-depth: 2
        submodules: true
    - name: Check out upstream parent
      run: git -C nfs worktree add --detach ../pnf6efdd 1426d78597bbb8dcf556d65e9b413208c898444f
    - *id003
    - name: Build NFStream with its pinned packet capture and flow engine
      run: 'sudo apt-get update -qq

        sudo apt-get install -y autoconf automake libtool pkg-config gettext libjson-c-dev
        libusb-1.0-0-dev libdbus-glib-1-dev libbluetooth-dev libnl-genl-3-dev flex
        bison

        python -m pip install ./nfs'
    - name: Compare the public API and run neighboring regressions
      run: 'python validation/compare.py nfs pnf6efdd cpu base

        python validation/compare.py nfs nfs cpu candidate

        cd nfs && python -c ''from tests import NFStreamTest; NFStreamTest.test_burst_sequence();
        NFStreamTest.test_splt()'''
