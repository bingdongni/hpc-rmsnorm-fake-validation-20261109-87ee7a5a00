name: Check graph counts and optimization model interfaces
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  hist:
    name: Weighted ratio errors in Matplotlib and the interval API
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/hist
        ref: a90a901b48e598c134c75ed26edd1d58f5207f20
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Build, exercise the public interface and compare results
      run: 'git fetch --tags

        python -m pip install -e . scipy iminuit matplotlib mplhep pytest pytest-mpl
        packaging awkward ruff

        ruff check src/hist/basehist.py src/hist/intervals.py src/hist/plot.py tests/test_intervals.py
        tests/test_plot.py

        python -m pytest -q tests/test_intervals.py tests/test_plot.py'
