        \        )\nTASK_FILE\ncat > /tmp/search_benchmark.py <<'TASK_FILE'\n\"\"\"\
        Time a complete constrained intra-route search on a PyVRP PDPTW benchmark.\"\
        \"\"\nfrom dataclasses import dataclass\nfrom itertools import pairwise\n\
