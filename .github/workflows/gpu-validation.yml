name: GDN branch-state GPU feasibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    runs-on: [self-hosted, Windows, X64, gdn-branch-state-ac6f7cecc4]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    env:
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run actual CUDA recurrence and allocation controls
        run: |
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -u branch_state_probe.py --gpu --output branch-state-results.json
          if ($LASTEXITCODE -ne 0) { throw 'GDN branch-state GPU probe failed' }
