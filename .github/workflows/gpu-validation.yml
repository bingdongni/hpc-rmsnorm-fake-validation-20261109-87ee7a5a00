name: Validate agent backoff, weighted distributed sampling and batched scoring
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux:
    name: Public API and two-rank comparisons (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: llama
        repository: bingdongni/llama-agents
        ref: 49daae03ca963239f92a6267e57d44895f0552fa
        fetch-depth: 2
        persist-credentials: false
    - name: Read upstream parent of llama
      run: git -C llama worktree add --detach ../llama-base cb953fd9510ae88682a67058860b0e1b0ef96478
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: web
        repository: bingdongni/webdataset
        ref: 972ba61f81bdf217bedfd603dc8dc123f857da03
        fetch-depth: 2
        persist-credentials: false
    - name: Read upstream parent of web
      run: git -C web worktree add --detach ../web-base e0953f9bba17b416d5792d5a263b171c266e78be
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: kits
        repository: bingdongni/Kitsune-py
        ref: 560f43646f4d166d6a9f72141ef2813dd741b445
        fetch-depth: 2
        persist-credentials: false
    - name: Read upstream parent of kits
      run: git -C kits worktree add --detach ../kits-base 7c8ea51e89268d9a20399dca4bf32d663e638eb4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install CPU test dependencies
      run: 'python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install ''numpy==1.26.4'' ''scipy==1.15.3'' pytest pytest-asyncio
        ''tenacity==9.1.2'' braceexpand pillow pyyaml ./llama/packages/llama-index-workflows'
    - name: llama baseline, candidate and tests
      run: 'python validation/compare.py llama llama-base base

        python validation/compare.py llama llama candidate

        cd llama/packages/llama-index-workflows && PYTHONPATH=src python -m pytest
        -q -o addopts= tests/test_retry_policy.py tests/test_retry_tenacity_conformance.py'
    - name: web baseline, candidate and tests
      run: 'python -m torch.distributed.run --standalone --nproc-per-node=2 validation/compare.py
        web web-base base

        python -m torch.distributed.run --standalone --nproc-per-node=2 validation/compare.py
        web web candidate

        cd web && PYTHONPATH=src python -m pytest -q -o addopts= tests/test_shardlists.py'
    - name: kits baseline, candidate and tests
      run: 'python validation/compare.py kits kits-base base

        python validation/compare.py kits kits candidate

        cd kits && python -m unittest discover -s tests -p test_batch_scores.py'
