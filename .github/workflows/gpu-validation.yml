name: Validate deepmd algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    name: pt_expt multitask descriptor sharing matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DP_ENABLE_PYTORCH: '0'
      DP_ENABLE_TENSORFLOW: '0'
      OMP_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: deepmodeling/deepmd-kit
        ref: ed859426333b462512c86cd496f9a194379a515f
        persist-credentials: false
    - name: Build the Python package and install CPU PyTorch
      run: 'set -euo pipefail

        python -m pip -q install uv

        uv venv --python 3.12

        uv pip install --python .venv torch --index-url https://download.pytorch.org/whl/cpu

        uv pip install --python .venv . dpdata e3nn'
    - name: Compare both head orders through the training wrapper
      run: 'set -euo pipefail

        echo 
        | base64 -d > /tmp/check_descriptors.py

        .venv/bin/python /tmp/check_descriptors.py'
