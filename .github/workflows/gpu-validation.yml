name: Validate blocked VICReg precision and function transforms
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux-lightly:
    name: Linux locked checks, loss suite and two-rank Gloo
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      SCIPY_ARRAY_API: '1'
      CUBLAS_WORKSPACE_CONFIG: :4096:8
    steps:
    - &id001
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - &id002
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: lightly
        repository: bingdongni/lightly
        ref: d09925319bab229c6a8eb4a402aed5005ffae4f7
        persist-credentials: false
        fetch-depth: 2
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install upstream pinned toolchain
      working-directory: lightly
      run: 'python -m pip install uv==0.12.3

        make lock-check

        make install-maximal'
    - name: Run upstream format and type checks and the VICReg tests
      working-directory: lightly
      run: 'make format-check

        make type-check

        uv run --frozen pytest -q tests/loss/test_vicreg_loss.py'
    - name: Check Gloo gradients across two processes
      run: lightly/.venv/bin/python -m torch.distributed.run --standalone --nproc-per-node=2
        validation/compare.py lightly lightly cpu candidate
  legacy1100:
    name: Linux torch 1.10.0 lightly
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
    - *id001
    - *id002
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.9'
    - name: Install legacy CPU wheel
      run: python -m pip install 'numpy<2' 'torch==1.10.0+cpu' 'torchvision==0.11.1+cpu'
        -f https://download.pytorch.org/whl/cpu/torch_stable.html
    - name: Test the VICRegLoss source module and its second derivatives
      run: 'python validation/old_module.py lightly

        python validation/precision.py lightly cpu candidate'
  legacy1110:
    name: Linux torch 1.11.0 lightly
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
    - *id001
    - *id002
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.9'
    - name: Install legacy CPU wheel
      run: python -m pip install 'numpy<2' 'torch==1.11.0+cpu' 'torchvision==0.12.0+cpu'
        -f https://download.pytorch.org/whl/cpu/torch_stable.html
    - name: Test the VICRegLoss source module and its second derivatives
      run: 'python validation/old_module.py lightly

        python validation/precision.py lightly cpu candidate'
  gpu:
    name: RTX 4060 base/candidate reductions and transforms
    runs-on:
    - self-hosted
    - Windows
    - X64
    - vicreg-transforms-911eb0b27b
    timeout-minutes: 45
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      SCIPY_ARRAY_API: '1'
      CUBLAS_WORKSPACE_CONFIG: :4096:8
    steps:
    - name: Mask runner identifiers
      run: 'Write-Output "::add-mask::$env:MASK_MACHINE"

        Write-Output "::add-mask::$env:MASK_USER"'
    - *id001
    - *id002
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/lightly
        ref: 02a70964d01423d9dd5660485774a2e1539752a8
        path: previous-vicreg
        persist-credentials: false
    - name: Compare PR revisions and run the loss suite on CUDA
      run: '& ''C:\PR\pr-followup-20261117-2120\env\Scripts\python.exe'' validation/precision.py
        previous-vicreg cuda base

        if ($LASTEXITCODE) {throw ''validation failed''}

        & ''C:\PR\pr-followup-20261117-2120\env\Scripts\python.exe'' validation/precision.py
        lightly cuda candidate

        if ($LASTEXITCODE) {throw ''validation failed''}

        & ''C:\PR\pr-followup-20261117-2120\env\Scripts\python.exe'' validation/compare.py
        lightly lightly cuda candidate

        if ($LASTEXITCODE) {throw ''validation failed''}

        & ''C:\PR\pr-followup-20261117-2120\env\Scripts\python.exe'' validation/test_suite.py
        lightly

        if ($LASTEXITCODE) {throw ''validation failed''}

        & ''C:\PR\pr-followup-20261117-2120\env\Scripts\python.exe'' validation/compile_check.py
        lightly

        if ($LASTEXITCODE) {throw ''compile regression''}'
  torch20:
    name: PyTorch 2.0 transform API
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: lightly
        repository: bingdongni/lightly
        ref: d09925319bab229c6a8eb4a402aed5005ffae4f7
        persist-credentials: false
        fetch-depth: 2
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.10'
    - name: Install legacy CPU wheel
      run: python -m pip install 'numpy<2' torch==2.0.1 torchvision==0.15.2 --index-url
        https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
    - name: Check first torch.func release
      run: 'python validation/old_module.py lightly

        python validation/precision.py lightly cpu candidate'
