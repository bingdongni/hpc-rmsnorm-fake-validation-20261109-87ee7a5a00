name: Validate networkit algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  checks:
    name: networkit native correctness and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: networkit/networkit
        ref: 1a5051a524c662f97dd7810d252383618df82ff4
        persist-credentials: false
        submodules: recursive
    - name: Test contribution
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        cmake -S . -B build -G Ninja -DNETWORKIT_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_CXX_FLAGS_RELEASE="-O0 -DNDEBUG"

        cmake --build build --target networkit_tests -j4

        exe=$(find build . -name networkit_tests -type f -executable | head -1)

        OMP_NUM_THREADS=2 "$exe" --gtest_filter=''CommunityGTest.*Modularity*:CommunityGTest.*Leiden*:CommunityGTest.testCoverage''

        '
