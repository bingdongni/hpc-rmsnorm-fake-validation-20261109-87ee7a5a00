name: Validate rectools algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: RecTools metrics suite and style checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: MTSWebServices/RecTools
        ref: 5f365cc546f3b54f39fe6367df26bd0b9178e9e1
        persist-credentials: false
    - name: Exercise source patch
      run: 'set -euo pipefail

        python -m pip -q install -e . pytest==8.3.3 pytest-subtests pytest-mock scikit-learn
        black==25.1.0 isort==5.13.2 openpyxl

        echo 
        | base64 -d | git apply -

        python -m pytest -q tests/metrics

        black --check rectools/metrics tests/metrics

        isort --check-only rectools/metrics tests/metrics

        '
  retail:
    name: UCI Online Retail evaluation against binary relevance sets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: MTSWebServices/RecTools
        ref: 5f365cc546f3b54f39fe6367df26bd0b9178e9e1
        persist-credentials: false
    - name: Evaluate before and after the change
      run: "set -euo pipefail\npython -m pip -q install -e . pytest==8.3.3 pytest-subtests\
        \ pytest-mock scikit-learn black==25.1.0 isort==5.13.2 openpyxl\nmkdir -p\
        \ /tmp/retail\ncurl -fsSL --retry 3 https://archive.ics.uci.edu/static/public/352/online+retail.zip\
        \ -o /tmp/retail.zip\nunzip -q /tmp/retail.zip -d /tmp/retail\ncat > /tmp/retail_eval.py\
        \ <<'PYBENCH'\nfrom pathlib import Path\nimport json,sys\nimport numpy as\
        \ np\nimport pandas as pd\nfrom rectools import Columns as C\nfrom rectools.metrics\
        \ import MAP,Precision,Recall,calc_metrics\n\nout=Path('/tmp/retail-reco.pkl')\n\
        if not out.exists():\n    sales=pd.read_excel(next(Path('/tmp/retail').rglob('*.xlsx')),usecols=['InvoiceNo','CustomerID','StockCode','Quantity','InvoiceDate','Country'])\n\
        \    sales=sales[(sales.Country=='United Kingdom') & sales.CustomerID.notna()\
        \ & sales.Quantity.gt(0) & sales.InvoiceNo.astype(str).str.fullmatch(r'\\\
        d+')].copy()\n    sales=sales[sales.StockCode.astype(str).str.fullmatch(r'\\\
        d{5}[A-Z]?')]\n    sales[C.User]=sales.CustomerID.astype(int)\n    sales[C.Item]=sales.StockCode.astype(str)\n\
        \    train=sales[sales.InvoiceDate<'2011-11-01']\n    test=sales[(sales.InvoiceDate>='2011-11-01')\
        \ & (sales.InvoiceDate<'2011-12-01')][C.UserItem].copy()\n    popular=train.groupby(C.Item).size().sort_values(ascending=False,kind='stable').index[:10].tolist()\n\
        \    personal=train.groupby([C.User,C.Item]).size().rename('visits').reset_index().sort_values([C.User,'visits',C.Item],ascending=[True,False,True])\n\
        \    ranks=personal.groupby(C.User)[C.Item].agg(list).to_dict()\n    recos=[]\n\
        \    for u in sorted(test[C.User].unique()):\n        items=list(dict.fromkeys(ranks.get(u,[])+popular))[:10]\n\
        \        recos.extend((u,v,i+1) for i,v in enumerate(items))\n    reco=pd.DataFrame(recos,columns=[C.User,C.Item,C.Rank])\n\
        \    pd.to_pickle((reco,test),out)\nreco,test=pd.read_pickle(out)\ntruth=test.groupby(C.User)[C.Item].agg(set).to_dict()\n\
        oracle=[]\nfor u,items in reco.groupby(C.User)[C.Item]:\n    match=np.array([i\
        \ in truth[u] for i in items]);n=len(truth[u])\n    oracle.append([match.sum()/10,match.sum()/n,(match*np.cumsum(match)/np.arange(1,11)).sum()/n])\n\
        refs=dict(zip(('precision@10','recall@10','map@10'),np.mean(oracle,axis=0)))\n\
        scores=calc_metrics({'precision@10':Precision(10),'recall@10':Recall(10),'map@10':MAP(10)},reco,test)\n\
        print('RESULT',json.dumps(dict(revision=sys.argv[1],users=len(truth),events=len(test),unique_pairs=len(test.drop_duplicates()),scores=scores,reference=refs)),flush=True)\n\
        if sys.argv[1]=='patched':np.testing.assert_allclose(list(scores[k] for k\
        \ in refs),list(refs.values()),rtol=1e-12,atol=1e-12)\nelse:assert abs(scores['precision@10']-refs['precision@10'])>.00001\n\
        \nPYBENCH\npython /tmp/retail_eval.py upstream\necho \
        \ | base64 -d | git apply -\npython /tmp/retail_eval.py patched"
