name: Validate HDF5, Arrow and Parquet episode selection
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  OMP_NUM_THREADS: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
jobs:
  agent:
    name: Offline RL dataset views
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: minari
        persist-credentials: false
        repository: bingdongni/Minari
        ref: e395dba56387c34dfa355057a7debfa06308e403
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install storage backends
      run: python -m pip install "./minari[arrow,hdf5,create]" pytest pillow
    - name: Test both storage formats
      run: cd minari && python -m pytest -q tests/data_collector/test_appended_episode_statistics.py
