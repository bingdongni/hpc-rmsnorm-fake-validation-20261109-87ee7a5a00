name: Check graph counts and optimization model interfaces
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  igraph:
    name: Build native igraph and verify incident triangle counts
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/python-igraph
        ref: afbabc01bb43c8531f147428f5fb497375655658
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Build, exercise the public interface and compare results
      run: "sudo apt-get update -qq\nsudo apt-get install -y flex bison libxml2-dev\
        \ libglpk-dev libcairo2-dev\ngit submodule update --init --depth=1 vendor/source/igraph\n\
        python -m pip install . pytest networkx numpy\npython -m pytest -q tests/test_motifs.py\
        \ tests/test_structural.py\npython - <<'PY'\nimport igraph as ig\nimport tracemalloc\n\
        from math import comb\nn=120\ng=ig.Graph.Full(n)\ndef peak(fn):\n    tracemalloc.start()\n\
        \    try:\n        out=fn()\n        return out,tracemalloc.get_traced_memory()[1]\n\
        \    finally:\n        tracemalloc.stop()\ncounts,small=peak(g.count_adjacent_triangles)\n\
        tri,large=peak(g.list_triangles)\nassert len(tri)==comb(n,3) and counts==[comb(n-1,2)]*n\n\
        print('Python allocations on K120:',len(tri),'triangles, count',small,'bytes\
        \ vs list',large,'bytes')\nassert small<large//10\nPY"
  pot:
    name: Rectangular LP barycenters with HiGHS and CVXOPT
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/POT
        ref: 29cf4fae3be4d392d93a0e4f3a0675a69343e48b
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Build, exercise the public interface and compare results
      run: "sudo apt-get update -qq\nsudo apt-get install -y libeigen3-dev\nexport\
        \ CPLUS_INCLUDE_PATH=/usr/include/eigen3\npython -m pip install -e . pytest\
        \ cvxopt matplotlib\npython -m pytest -q test/test_ot.py -k lp_barycenter\n\
        python examples/barycenters/plot_barycenter_output_grid.py\npython - <<'PY'\n\
        import numpy as np\nimport ot\nfrom scipy.optimize import minimize_scalar\n\
        rng=np.random.default_rng(716)\nfor n in [5,31,96]:\n    hist=rng.random((n,4));hist/=hist.sum(axis=0)\n\
        \    sites=np.linspace(-1,2,n)\n    M=(sites[:,None]-np.array([-0.8,1.1]))**2\n\
        \    w=np.array([.11,.19,.29,.41])\n    q=ot.lp.barycenter(hist,M,w)\n   \
        \ def objective(t):\n        return sum(w[j]*ot.emd2(hist[:,j],np.array([t,1-t]),M)\
        \ for j in range(4))\n    ref=minimize_scalar(objective,bounds=(0,1),method='bounded',options={'xatol':1e-12})\n\
        \    assert abs(objective(q[0])-ref.fun)<1e-8\n    print('independent nested\
        \ EMD objective',n,'bins',objective(q[0]),'vs',ref.fun)\nPY"
  linopy:
    name: Piecewise row scaling with direct HiGHS LP and MIP
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/linopy
        ref: 6753b6a4fb5879c5f1aac3db84c147c5e2f45c57
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Build, exercise the public interface and compare results
      run: "python -m pip install -e . highspy pytest ruff\nruff check linopy/piecewise.py\
        \ test/test_piecewise_constraints.py\npython -m pytest -q test/test_piecewise_constraints.py\
        \ -k \"row_scaling or scaling_is_atomic or LPEligibilityReasons\"\npython\
        \ - <<'PY'\nimport linopy as lp\nimport numpy as np\nfor method in ['lp','incremental']:\n\
        \ for scale in [1.,(0.1,0.01)]:\n  m=lp.Model();x=m.add_variables(lower=0,name='dispatch');y=m.add_variables(lower=0,name='cost')\n\
        \  m.add_piecewise_formulation((x,[0,10,20]),(y,[0,100,300],'>='),method=method,name='curve',scaling=scale)\n\
        \  m.add_constraints(x >= 15,name='demand');m.add_objective(y)\n  result=m.solve(solver_name='highs',io_api='direct',log_to_console=False)\n\
        \  assert result==('ok','optimal') and np.isclose(x.solution.item(),15) and\
        \ np.isclose(y.solution.item(),200),(result,x.solution,y.solution)\n  print(method,scale,result,float(x.solution),float(y.solution))\n\
        PY"
