name: torchft quantized Work GPU regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    runs-on: [self-hosted, Windows, X64, torchft-work-874775106d]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    env:
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      PYTHONPATH: 'C:\PR\fla-research-deps-20261110;C:\PR\torchft-test-deps-20261111'
      CC: 'C:\PR\fla-research-deps-20261110\triton\runtime\tcc\tcc.exe'
      CUDA_PATH: 'C:\PR\fla-research-deps-20261110\triton\backends\nvidia'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: meta-pytorch/torchft
          ref: 43e3b6d3557194ff1eea3c3217e94ef7f6308bc2
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: meta-pytorch/torchft
          ref: 43e3b6d3557194ff1eea3c3217e94ef7f6308bc2
          path: candidate
          persist-credentials: false
      - name: Compare baseline and candidate on GPU with a controlled process group
        run: |
          if ((git -C baseline rev-parse HEAD) -ne '43e3b6d3557194ff1eea3c3217e94ef7f6308bc2') { throw 'Wrong baseline' }
          if ((git -C candidate rev-parse HEAD) -ne '43e3b6d3557194ff1eea3c3217e94ef7f6308bc2') { throw 'Wrong candidate base' }
          $patch = Join-Path $env:GITHUB_WORKSPACE 'harness/torchft-work.patch'
          git -C candidate apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch does not apply cleanly' }
          git -C candidate apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch application failed' }
          Copy-Item -LiteralPath 'candidate/torchft/collectives_work_test.py' -Destination 'baseline/torchft/collectives_work_test.py'
          $python = 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe'
          $runner = Join-Path $env:GITHUB_WORKSPACE 'harness/run_torchft_collective_tests.py'
          & $python -c "import torch; assert torch.cuda.is_available(); print('GPU:', torch.cuda.get_device_name()); print('NCCL available:', torch.distributed.is_nccl_available())"
          if ($LASTEXITCODE -ne 0) { throw 'CUDA unavailable' }
          $env:TORCHFT_PROBE_ROOT = Join-Path $env:GITHUB_WORKSPACE 'baseline'
          & $python $runner -q -k test_wait_and_block_current_stream_include_postprocessing
          if ($LASTEXITCODE -ne 1) { throw 'Baseline did not reproduce the expected regression' }
          Write-Output 'Baseline reproduced the expected regression'
          $env:TORCHFT_PROBE_ROOT = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          & $python $runner -q
          if ($LASTEXITCODE -ne 0) { throw 'Candidate GPU regression tests failed' }
          Write-Output 'Candidate GPU regression tests passed'
