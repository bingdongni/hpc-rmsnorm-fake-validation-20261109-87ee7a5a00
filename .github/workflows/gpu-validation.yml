name: Validate networkit algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  checks:
    name: networkit native correctness and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: networkit/networkit
        ref: 1a5051a524c662f97dd7810d252383618df82ff4
        persist-credentials: false
        submodules: recursive
    - name: Test contribution
      run: "set -euo pipefail\necho \
        \ | base64 -d | git apply -\npython -m pip -q install 'igraph>=1' leidenalg\n\
        python - <<'ORACLE'\nimport gzip\nimport itertools\nimport json\nimport random\n\
        import urllib.request\nfrom collections import Counter, defaultdict\n\nimport\
        \ igraph as ig\nimport leidenalg\n\nrng = random.Random(1590)\ndef partitions(n):\n\
        \    if n == 0:\n        yield []\n        return\n    for p in partitions(n-1):\n\
        \        for k in range(max(p, default=-1)+2):\n            yield p+[k]\n\n\
        def matrix(n, edges):\n    out, inc = [0]*n, [0]*n\n    for (u,v), w in edges.items():\n\
        \        out[u] += w\n        inc[v] += w\n    return out, inc\n\ndef quality_numerator(p,\
        \ edges, m, out, inc):\n    return sum((m*edges.get((u,v),0)-out[u]*inc[v])\
        \ for u,x in enumerate(p) for v,y in enumerate(p) if x==y)\n\ndef move_delta(p,\
        \ i, b, edges, m, out, inc):\n    a = p[i]\n    if a==b:\n        return 0\n\
        \    inside = sum((int(g==b)-int(g==a))*(edges.get((i,j),0)+edges.get((j,i),0))\
        \ for j,g in enumerate(p) if j!=i)\n    def diff(degree):\n        return\
        \ sum((int(g==b)-int(g==a))*degree[j] for j,g in enumerate(p) if j!=i)\n \
        \   return m*inside-out[i]*diff(inc)-inc[i]*diff(out)\n\ndef iggraph(n,edges):\n\
        \    g=ig.Graph(n=n,edges=list(edges),directed=True)\n    g.es['weight']=list(edges.values())\n\
        \    return g\n\ncases = []\nmoves = aggregate = small = 0\nfor n in range(2,7):\n\
        \    for _ in range(5):\n        e={(i,j):rng.randrange(1,8) for i in range(n)\
        \ for j in range(n) if rng.random()<.39}\n        if not e:\n            e[0,0]=1\n\
        \        m=sum(e.values())\n        out,inc=matrix(n,e)\n        g=iggraph(n,e)\n\
        \        rows=[]\n        for p in partitions(n):\n            q=quality_numerator(p,e,m,out,inc)\n\
        \            truth=g.modularity(p,weights='weight',directed=True)\n      \
        \      assert abs(truth-q/(m*m))<1e-12\n            rows.append((p,truth));small+=1\n\
        \            for i in range(n):\n                for b in range(max(p)+2):\n\
        \                    if p[i]==b: continue\n                    s=p.copy();s[i]=b\n\
        \                    assert quality_numerator(s,e,m,out,inc)-q==move_delta(p,i,b,e,m,out,inc)\n\
        \                    moves+=1\n            groups=max(p)+1\n            ec=Counter()\n\
        \            for (i,j),w in e.items():\n                ec[p[i],p[j]]+=w\n\
        \            co,ci=matrix(groups,ec)\n            for c in ([0]*groups, list(range(groups)),\
        \ [rng.randrange(groups) for _ in range(groups)]):\n                lifted=[c[k]\
        \ for k in p]\n                assert quality_numerator(c,ec,m,co,ci)==quality_numerator(lifted,e,m,out,inc)\n\
        \                aggregate+=1\n        cases.append((n,e,rows))\n\ndata=urllib.request.urlopen('https://snap.stanford.edu/data/email-Eu-core.txt.gz',timeout=40).read()\n\
        ee=Counter(tuple(map(int,line.split())) for line in gzip.decompress(data).splitlines()\
        \ if line and not line.startswith(b'#'))\nn=max(max(pair) for pair in ee)+1\n\
        g=iggraph(n,ee); ug=g.as_undirected(mode='collapse',combine_edges={'weight':'sum'})\n\
        parts=[leidenalg.find_partition(net,leidenalg.ModularityVertexPartition,weights='weight',seed=1590,n_iterations=-1).membership\
        \ for net in (g,ug)]\nqualities=[g.modularity(p,weights='weight',directed=True)\
        \ for p in parts]\ncases.append((n,ee,list(zip(parts,qualities))))\nwith open('/tmp/networkit-quality.txt','w')\
        \ as f:\n    print(len(cases),file=f)\n    for nv,e,rows in cases:\n     \
        \   print(nv,len(e),len(rows),file=f)\n        for (i,j),w in e.items(): print(i,j,w,file=f)\n\
        \        for p,truth in rows: print(truth,*p,file=f)\nprint('RESULT',json.dumps(dict(small_graphs=len(cases)-1,partitions=small,moves=moves,coarsenings=aggregate,email_nodes=n,email_arcs=len(ee),directed_Q=qualities[0],symmetrized_partition_directed_Q=qualities[1])),flush=True)\n\
        \nORACLE\npython - <<'PREP'\nimport base64\nfrom pathlib import Path\np=Path('networkit/cpp/community/test/CommunityGTest.cpp')\n\
        src=p.read_text()\nat=src.index('TEST_F(CommunityGTest, testCoverage)')\n\
        p.write_text('#include <fstream>\\n'+src[:at]+base64.b64decode('').decode()+'\\\
        n'+src[at:])\nPREP\ncmake -S . -B build -G Ninja -DNETWORKIT_BUILD_TESTS=ON\
        \ -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE=\"-O0 -DNDEBUG\"\n\
        cmake --build build --target networkit_tests -j4\nexe=$(find build . -name\
        \ networkit_tests -type f -executable | head -1)\nOMP_NUM_THREADS=2 \"$exe\"\
        \ --gtest_filter='CommunityGTest.*Modularity*:CommunityGTest.*Leiden*:CommunityGTest.testCoverage:CommunityGTest.externalDirectedQualityOracle'\n"
