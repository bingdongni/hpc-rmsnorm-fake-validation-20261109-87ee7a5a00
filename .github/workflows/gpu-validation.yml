name: Checkpoint strided copy review validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    runs-on: [self-hosted, Windows, X64, checkpoint-strided-review-2d3cf96373]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/checkpoint-engine
          ref: 8d5f2a6ad37a13a1f8556286c8971b2632495fe7
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/checkpoint-engine
          ref: 6d8cde9fffc74ef19fd7903a403f67e71a8ef195
          path: patched
          persist-credentials: false
      - name: Verify sources and baseline regression
        run: |
          if ((git -C baseline rev-parse HEAD) -ne '8d5f2a6ad37a13a1f8556286c8971b2632495fe7') { throw 'Wrong baseline' }
          if ((git -C patched rev-parse HEAD) -ne '6d8cde9fffc74ef19fd7903a403f67e71a8ef195') { throw 'Wrong patch' }
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -c "import torch; assert torch.cuda.is_available(); print('GPU:', torch.cuda.get_device_name(0))"
          if ($LASTEXITCODE -ne 0) { throw 'CUDA unavailable' }
          Copy-Item -LiteralPath patched\tests\test_strided_pin_memory.py -Destination baseline\tests\test_strided_pin_memory.py
          $env:PYTHONPATH = "C:\PR\checkpoint-engine-deps-20261109;$env:GITHUB_WORKSPACE\baseline"
          Set-Location baseline
          $output = & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -m pytest -q --tb=short tests\test_strided_pin_memory.py -k do_not_overlap 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 1 -or $output -notmatch '1 failed' -or $output -notmatch 'assert [234] == 1') { throw 'Unexpected baseline result' }
          exit 0
      - name: Test PyTorch 2.6 and 2.11
        run: |
          $env:PYTHONPATH = "C:\PR\checkpoint-engine-deps-20261109;$env:GITHUB_WORKSPACE\patched"
          Set-Location patched
          foreach ($python in @('C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe', 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe')) {
            & $python -c "import torch; print('PyTorch:', torch.__version__, 'CUDA:', torch.version.cuda)"
            & $python -m pytest -q tests\test_strided_pin_memory.py
            if ($LASTEXITCODE -ne 0) { throw 'CUDA regression failed' }
          }
      - name: Measure registration time and staging memory
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'harness/checkpoint_strided_copy_benchmark.py'
          foreach ($python in @('C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe', 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe')) {
            foreach ($tree in @('baseline', 'patched')) {
              Write-Host "Benchmark $tree"
              $env:PYTHONPATH = "C:\PR\checkpoint-engine-deps-20261109;$env:GITHUB_WORKSPACE\$tree"
              $env:EXPECTED_STAGING = if ($tree -eq 'baseline') { 'baseline' } else { 'bounded' }
              Set-Location (Join-Path $env:GITHUB_WORKSPACE $tree)
              & $python -u $script
              if ($LASTEXITCODE -ne 0) { throw 'Registration benchmark failed' }
            }
          }
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            torch: '2.5.1'
          - python: '3.12'
            torch: '2.6.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/checkpoint-engine
          ref: 6d8cde9fffc74ef19fd7903a403f67e71a8ef195
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[p2p]' pytest
      - name: Run CPU suite
        run: python -m pytest -q -m 'not gpu' tests
  precommit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/checkpoint-engine
          ref: 6d8cde9fffc74ef19fd7903a403f67e71a8ef195
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pre-commit
      - run: pre-commit run --files checkpoint_engine/pin_memory.py tests/test_strided_pin_memory.py
