name: Checkpoint worker failure propagation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    runs-on: [self-hosted, Windows, X64, checkpoint-worker-errors-98e8697b0d]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    env:
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: MoonshotAI/checkpoint-engine
          ref: 0ac607299eb711cdd6b164e9eba04a7ade9cf98b
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: MoonshotAI/checkpoint-engine
          ref: 0ac607299eb711cdd6b164e9eba04a7ade9cf98b
          path: candidate
          persist-credentials: false
      - name: Compare worker failures using CUDA tensors
        run: |
          if ((git -C baseline rev-parse HEAD) -ne '0ac607299eb711cdd6b164e9eba04a7ade9cf98b') { throw 'Wrong baseline' }
          if ((git -C candidate rev-parse HEAD) -ne '0ac607299eb711cdd6b164e9eba04a7ade9cf98b') { throw 'Wrong candidate base' }
          $patch = Join-Path $env:GITHUB_WORKSPACE 'harness/checkpoint-worker-errors.patch'
          git -C candidate apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch does not apply' }
          git -C candidate apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch application failed' }
          Copy-Item -LiteralPath 'candidate/tests/test_worker_update_errors.py' -Destination 'baseline/tests/test_worker_update_errors.py'
          $python = 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe'
          & $python -c "import torch; assert torch.cuda.is_available(); print('GPU:', torch.cuda.get_device_name())"
          if ($LASTEXITCODE -ne 0) { throw 'CUDA unavailable' }
          $env:PYTHONPATH = "C:\PR\checkpoint-engine-deps-20261109;$env:GITHUB_WORKSPACE\baseline"
          Push-Location baseline
          $output = & $python -m pytest -q --tb=no tests/test_worker_update_errors.py -k test_worker_failure_is_reported_on_every_bucket -m gpu 2>&1 | Out-String
          $code = $LASTEXITCODE
          Pop-Location
          Write-Host $output
          if ($code -ne 1 -or $output -notmatch '2 failed, 2 passed') { throw 'Baseline did not reproduce last-bucket failures' }
          $env:PYTHONPATH = "C:\PR\checkpoint-engine-deps-20261109;$env:GITHUB_WORKSPACE\candidate"
          Push-Location candidate
          & $python -m pytest -q tests/test_worker_update_errors.py -m gpu
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw 'Candidate CUDA tests failed' }
          Write-Output 'CUDA tensors used local IPC and a simulated single-rank collective'
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            torch: '2.5.1'
          - python: '3.12'
            torch: '2.6.0'
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: MoonshotAI/checkpoint-engine
          ref: 0ac607299eb711cdd6b164e9eba04a7ade9cf98b
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: MoonshotAI/checkpoint-engine
          ref: 0ac607299eb711cdd6b164e9eba04a7ade9cf98b
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Apply candidate
        run: |
          test "$(git -C candidate rev-parse HEAD)" = 0ac607299eb711cdd6b164e9eba04a7ade9cf98b
          git -C candidate apply --check "$GITHUB_WORKSPACE/harness/checkpoint-worker-errors.patch"
          git -C candidate apply "$GITHUB_WORKSPACE/harness/checkpoint-worker-errors.patch"
          cp candidate/tests/test_worker_update_errors.py baseline/tests/
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e './candidate[p2p]' pytest
      - name: Reproduce baseline error loss
        run: |
          cd baseline
          set +e
          PYTHONPATH="$PWD" python -m pytest -q --tb=no tests/test_worker_update_errors.py -k test_worker_failure_is_reported_on_every_bucket -m 'not gpu' > "$RUNNER_TEMP/baseline.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/baseline.log"
          test "$code" = 1
          grep -q '2 failed, 2 passed' "$RUNNER_TEMP/baseline.log"
      - name: Verify two-rank Gloo worker failure
        run: |
          cd candidate
          PYTHONPATH="$PWD" python -B "$GITHUB_WORKSPACE/harness/checkpoint_gloo_last_bucket_review.py"
      - name: Verify subgroup failure, nonparticipant and reuse
        if: matrix.python == '3.12'
        run: |
          cd candidate
          PYTHONPATH="$PWD" python -B "$GITHUB_WORKSPACE/harness/checkpoint_p2p_gloo_validation.py"
      - name: Run CPU test suite
        run: |
          cd candidate
          PYTHONPATH="$PWD" python -m pytest -q -m 'not gpu' tests
  precommit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: MoonshotAI/checkpoint-engine
          ref: 0ac607299eb711cdd6b164e9eba04a7ade9cf98b
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply candidate and include new test
        run: |
          git -C candidate apply --check "$GITHUB_WORKSPACE/harness/checkpoint-worker-errors.patch"
          git -C candidate apply "$GITHUB_WORKSPACE/harness/checkpoint-worker-errors.patch"
          git -C candidate add -N tests/test_worker_update_errors.py
      - name: Run project hooks
        working-directory: candidate
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files
