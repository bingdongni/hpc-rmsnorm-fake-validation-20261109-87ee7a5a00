name: Validate medoid-predict algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: medoid-predict
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: wannesm/dtaidistance
        ref: 7973dda1845a4bc24cd1b2c14939f1d64d461b68
        persist-credentials: false
    - name: Apply verified change
      shell: bash
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        git diff --check'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run tests
      shell: bash
      run: 'set -euo pipefail

        export OMP_NUM_THREADS=2 MPLBACKEND=Agg

        python -m pip install . pyclustering pytest pytest-benchmark pytest-env matplotlib
        scipy

        python -m pytest -q tests/test_clustering.py

        echo 
        | base64 -d > /tmp/dtw-oracle.py

        python /tmp/dtw-oracle.py

        '
