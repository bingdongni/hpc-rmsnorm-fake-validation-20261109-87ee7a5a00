name: Validate the LLM tool call budget against current main
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  llm:
    name: LLM upstream test suite after merging main
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/llm
        ref: a68354ef5751e4d823e4234d4bf3810f906b87f3
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Validate reviewed commit
      run: 'python -m pip install --upgrade pip

        python -m pip install -e . --group dev

        python -m pytest -q'
