name: Validate fci-sepsets algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: fci-sepsets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: py-why/causal-learn
        ref: 0dacacf36390e3084704636bc3c36e82e35ee0cc
        persist-credentials: false
    - name: Apply verified change
      shell: bash
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        git diff --check'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run tests
      shell: bash
      run: 'set -euo pipefail

        export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1

        python -m pip install -q -e . pytest

        python -m pytest -q tests/TestFCI.py tests/TestFAS.py tests/TestDAG2PAG.py

        echo 
        | base64 -d > /tmp/check-fci.py

        python /tmp/check-fci.py

        '
