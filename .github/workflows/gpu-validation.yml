name: Validate deep-bridge algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  cpu:
    name: Shared DPA4C training and finite differences
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DP_ENABLE_PYTORCH: '0'
      DP_ENABLE_TENSORFLOW: '0'
      OMP_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: deepmodeling/deepmd-kit
        ref: ed859426333b462512c86cd496f9a194379a515f
        persist-credentials: false
    - name: Build pinned source and CPU PyTorch runtime
      run: 'set -euo pipefail

        python -m pip -q install uv

        uv venv --python 3.12

        uv pip install --python .venv torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu

        uv pip install --python .venv --editable . dpdata e3nn ase pytest pytest-timeout
        array-api-strict ruff'
    - name: Confirm the unchanged implementation fails the new cases
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        set +e

        .venv/bin/pytest -q source/tests/pt_expt/model/test_dpa4c_zbl_bridging.py
        -k multitask_shared_descriptor --tb=short > /tmp/before 2>&1

        rv=$?

        set -e

        cat /tmp/before

        test "$rv" -eq 1

        grep -q "3 failed" /tmp/before

        grep -q "descriptor" /tmp/before'
    - name: Check patch and both training heads
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        .venv/bin/ruff check deepmd/pt_expt/model/dp_linear_model.py source/tests/pt_expt/model/test_dpa4c_zbl_bridging.py

        .venv/bin/ruff format --check deepmd/pt_expt/model/dp_linear_model.py source/tests/pt_expt/model/test_dpa4c_zbl_bridging.py

        .venv/bin/pytest -q source/tests/pt_expt/model/test_dpa4c_zbl_bridging.py
        -k multitask_shared_descriptor --tb=short'
    - name: Compare position and parameter derivatives to finite differences
      run: 'echo 
        | base64 -d > /tmp/oracle.py

        .venv/bin/python /tmp/oracle.py'
    - name: Run DPA4C and general bridging tests
      run: .venv/bin/pytest -q source/tests/pt_expt/model/test_dpa4c_zbl_bridging.py
        source/tests/pt_expt/model/test_get_model_zbl.py --tb=short
