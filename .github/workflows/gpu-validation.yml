        from pyvrp.stop import MaxIterations\nfrom ride_time import RouteBounds\n\n\
        @dataclass\nclass Stop:\n    tw_early:int\n    tw_late:int\n    service_duration:int\n\
        \ndef build(data, route):\n    timeline=route.schedule()\n    refs=[]; pickups={};\
        \ deliveries={}; loads=[]\n    for i,a in enumerate(timeline):\n        if\
