name: Validate boxcox-observed algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: boxcox-observed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: Nixtla/coreforecast
        ref: ae3e773224ceb3c8a5349868c159de63bea6de20
        persist-credentials: false
    - name: Apply verified change
      shell: bash
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        git diff --check'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run tests
      shell: bash
      run: 'set -euo pipefail

        git submodule update --init --depth 1

        python -m pip install . pytest scipy statsmodels pandas

        python -m pytest -q tests/test_scalers.py tests/test_contiguity.py


        echo 
        | base64 -d > /tmp/independent-check.py

        python /tmp/independent-check.py

        '
