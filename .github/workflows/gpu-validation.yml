name: Validate mixed-domain algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: mixed-domain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bayesian-optimization/BayesianOptimization
        ref: ec451235ec4c4c8782d7d10a83a59311c1937aa9
        persist-credentials: false
    - name: Apply verified change
      shell: bash
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        git diff --check'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run tests
      shell: bash
      run: 'set -euo pipefail

        export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MPLBACKEND=Agg

        python -m pip install ".[dev]"

        python -m pytest -q tests/test_seq_domain_red.py tests/test_bayesian_optimization.py

        python -m pytest -q tests


        echo 
        | base64 -d > /tmp/independent-check.py

        python /tmp/independent-check.py

        '
