name: Validate mlforecast algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  checks:
    name: mlforecast native correctness and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: Nixtla/mlforecast
        ref: 8cfd2b8e70e0dabe6561a644e67c9814bcfc5092
        persist-credentials: false
        submodules: false
    - name: Test contribution
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        python -m pip -q install -e . lightgbm xgboost-cpu "polars<=1.31.0" pyarrow
        pytest pytest-cov numba ruff==0.15.18

        export OMP_NUM_THREADS=2 POLARS_MAX_THREADS=2 OPENBLAS_NUM_THREADS=1

        ruff check mlforecast/core.py mlforecast/forecast.py tests/test_predict_samples.py

        python -m pytest -o addopts='''' -q tests/test_predict_samples.py tests/test_forecast.py
        tests/test_hooks.py

        '
  retail:
    name: UCI retail rolling-origin interval comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: Nixtla/mlforecast
        ref: 8cfd2b8e70e0dabe6561a644e67c9814bcfc5092
        persist-credentials: false
        submodules: false
    - name: Backtest both interval methods
      run: "set -euo pipefail\necho \
        \ | base64 -d | git apply -\n\npython -m pip -q install -e . openpyxl\nexport\
        \ OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=1\nmkdir -p /tmp/retail\ncurl -fsSL\
        \ --retry 3 https://archive.ics.uci.edu/static/public/352/online+retail.zip\
        \ -o /tmp/retail.zip\nunzip -q /tmp/retail.zip -d /tmp/retail\npython - <<'PY'\n\
        import json,time\nfrom pathlib import Path\nimport numpy as np,pandas as pd\n\
        from sklearn.ensemble import HistGradientBoostingRegressor\nfrom mlforecast\
        \ import MLForecast\nfrom mlforecast.utils import PredictionIntervals\n\n\
        f=next(Path('/tmp/retail').rglob('*.xlsx'))\nsales=pd.read_excel(f,usecols=['InvoiceNo','StockCode','Quantity','InvoiceDate','Country'])\n\
        sales=sales[(sales.Country=='United Kingdom')&(sales.Quantity>0)&(sales.InvoiceNo.astype(str).str.fullmatch(r'\\\
        d+'))].copy()\nsales['unique_id']=sales.StockCode.astype(str)\nsales=sales[sales.unique_id.str.fullmatch(r'\\\
        d{5}[A-Z]?')]\nsales['ds']=sales.InvoiceDate.dt.normalize()\nwide=sales.pivot_table(index='ds',columns='unique_id',values='Quantity',aggfunc='sum').asfreq('D').fillna(0.)\n\
        # The partial final trading day is excluded; selection sees only the first\
        \ training window.\nwide=wide.iloc[:-1]\nends=[len(wide)-42,len(wide)-28,len(wide)-14]\n\
        used=wide.iloc[:ends[0]].sum().nlargest(20).index\npanel=wide[used].rename_axis(index='ds',columns='unique_id').stack().rename('y').reset_index()\n\
        rows=[]\nby_step=[]\ndef metrics(y,lo,hi):\n def pin(p,a):return np.maximum(p*(y-a),(p-1)*(y-a))\n\
        \ return dict(coverage=float(np.mean((lo<=y)&(y<=hi))),width=float(np.mean(hi-lo)),mean_pinball=float(np.mean((pin(.1,lo)+pin(.9,hi))/2)))\n\
        for run,cut in enumerate(ends):\n origin=wide.index[cut]\n train=panel[panel.ds<origin]\n\
        \ test=panel[(panel.ds>=origin)&(panel.ds<origin+pd.Timedelta(days=14))]\n\
        \ fc=MLForecast(models={'gb':HistGradientBoostingRegressor(loss='poisson',max_iter=45,max_leaf_nodes=10,random_state=42)},freq='D',lags=[1,7,14],date_features=['dayofweek'],num_threads=1)\n\
        \ fc.fit(train,static_features=[],prediction_intervals=PredictionIntervals(n_windows=4,h=14))\n\
        \ point=fc.predict(14,level=[80]).merge(test,on=['unique_id','ds'],validate='one_to_one')\n\
        \ # Fit systematic overdispersion on a separate pre-origin chronological validation\
        \ block.\n calibrator=MLForecast(models={'gb':HistGradientBoostingRegressor(loss='poisson',max_iter=45,max_leaf_nodes=10,random_state=42)},freq='D',lags=[1,7,14],date_features=['dayofweek'],num_threads=1)\n\
        \ cal=calibrator.cross_validation(train,n_windows=4,h=14,step_size=14,static_features=[],refit=True)\n\
        \ alpha=max(.00001, ((cal.y-cal.gb)**2-cal.gb).sum()/np.square(cal.gb).sum())\n\
        \ def draw(model,X,rng):\n    mu=np.maximum(model.predict(X),1e-9)\n    return\
        \ rng.negative_binomial(1/alpha,1/(1+alpha*mu))\n start=time.perf_counter()\n\
        \ paths=fc.predict_samples(14,100,draw,random_state=749+run)\n secs=time.perf_counter()-start\n\
        \ q=paths.groupby(['unique_id','ds']).gb.quantile([.1,.9]).unstack()\n point=point.merge(q.reset_index(),on=['unique_id','ds'],validate='one_to_one')\n\
        \ for name,lo,hi in [('existing_conformal','gb-lo-80','gb-hi-80'),('sampled_nb',.1,.9)]:\n\
        \    for k, group in point.groupby((point.ds-origin).dt.days + 1):\n     \
        \   by_step.append(dict(horizon=int(k),method=name,**metrics(group.y,group[lo],group[hi])))\n\
        \    rows.append(dict(origin=str(origin.date()),method=name,rows=len(point),**metrics(point.y,point[lo],point[hi])))\n\
        \ print('RESULT',json.dumps(dict(origin=str(origin.date()),items=len(used),n_eval=len(point),alpha=alpha,sample_seconds=secs)),flush=True)\n\
        print('RESULT',json.dumps(pd.DataFrame(rows).groupby('method')[['coverage','width','mean_pinball']].mean().to_dict('index')),flush=True)\n\
        \nprint('HORIZONS',pd.DataFrame(by_step).groupby(['method','horizon']).mean().round(4).to_json(orient='table'))\n\
        \nPY"
