name: Validate skfolio algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  quality:
    name: Dependencies, types and style
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: skfolio/skfolio
        ref: 444e548ee39eed4aaadbde64416fd495f6f109ab
        persist-credentials: false
    - name: Install project and developer dependencies
      run: 'python -m pip -q install uv

        uv venv --python 3.12

        uv pip install --python .venv --editable . --group dev'
    - name: Check patch
      run: 'echo 
        | base64 -d | git apply -

        uv run --no-sync deptry src

        uv run --no-sync ruff check

        uv run --no-sync ruff format --check

        uv run --no-sync ty check'
  distribution:
    name: Validate both sampling margins against independent draws and CDFs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: skfolio/skfolio
        ref: 444e548ee39eed4aaadbde64416fd495f6f109ab
        persist-credentials: false
    - name: Install project and developer dependencies
      run: 'python -m pip -q install uv

        uv venv --python 3.12

        uv pip install --python .venv --editable . --group dev'
    - name: Six orientations on base
      run: 'echo 
        | base64 -d > /tmp/probe.py

        .venv/bin/python /tmp/probe.py'
    - name: Establish the new regression fails on base
      run: 'echo 
        | base64 -d | git apply -

        set +e

        uv run --no-sync pytest -q -n 0 tests/test_distribution/test_multivariate/test_vine_copula.py
        -k asymmetric_edge > /tmp/before 2>&1

        result=$?

        set -e

        cat /tmp/before

        test "$result" -eq 1

        grep -q "1 failed" /tmp/before'
    - name: Six orientations on patch and complete vine test module
      run: 'echo 
        | base64 -d | git apply -

        .venv/bin/python /tmp/probe.py

        uv run --no-sync pytest -q -n 2 tests/test_distribution/test_multivariate/test_vine_copula.py'
  suite:
    name: Complete unit and docstring test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: skfolio/skfolio
        ref: 444e548ee39eed4aaadbde64416fd495f6f109ab
        persist-credentials: false
    - name: Install project and developer dependencies
      run: 'python -m pip -q install uv

        uv venv --python 3.12

        uv pip install --python .venv --editable . --group dev'
    - name: Test patched source
      run: 'echo 
        | base64 -d | git apply -

        uv run --no-sync pytest -q -n 3 --tb=short'
