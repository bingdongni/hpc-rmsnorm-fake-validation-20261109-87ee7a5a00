name: Validate asr algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  asr:
    name: English CTC graph decoding on LibriSpeech test-clean
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - name: Install CPU decoder
      run: python -m pip install 'sherpa-onnx==2.0.3' numpy soundfile rapidfuzz
    - name: Fetch released INT8 model, three graphs and public speech
      run: 'set -euo pipefail

        archive=sherpa-onnx-zipformer-ctc-en-2023-10-02

        curl -fsSL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$archive.tar.bz2
        -o model.tar.bz2

        tar xf model.tar.bz2 --wildcards ''*/model.int8.onnx'' ''*/tokens.txt'' ''*/H*.fst''

        curl -fsSL --retry 3 https://www.openslr.org/resources/12/test-clean.tar.gz
        -o audio.tar.gz

        sha256sum model.tar.bz2 audio.tar.gz

        tar xf audio.tar.gz'
    - name: Compare fixed graph decoders
      run: "python - <<'PY'\nfrom collections import defaultdict\nfrom pathlib import\
        \ Path\nimport gc, json, re, time\nimport numpy as np\nimport soundfile as\
        \ sf\nimport sherpa_onnx\nfrom rapidfuzz.distance import Levenshtein\n\nroot=Path(\"\
        LibriSpeech/test-clean\")\nmodel=next(Path(\".\").glob(\"sherpa-onnx-zipformer-ctc-en-*/model.int8.onnx\"\
        ))\ngroups=defaultdict(list)\nfor path in sorted(root.rglob(\"*.trans.txt\"\
        )):\n    for line in path.read_text().splitlines():\n        clip,ref=line.split(\"\
        \ \",1)\n        groups[clip.split(\"-\")[0]].append((clip,path.parent/(clip+\"\
        .flac\"),ref))\nclips=[c for sp in sorted(groups) for c in sorted(groups[sp])[:3]]\n\
        assert len(groups)==40 and len(clips)==120\naudio=[]\ndef words(s):\n    return\
        \ re.findall(r\"[A-Z]+(?:'[A-Z]+)*\",s.upper())\nfor clip,path,ref in clips:\n\
        \    wave,sr=sf.read(path,dtype=\"float32\")\n    assert sr==16000\n    audio.append((clip,words(ref),wave))\n\
        seconds=sum(len(w) for _,_,w in audio)/16000\nrecord={}\nfor graph in [\"\
        greedy\",\"H\",\"HL\",\"HLG\"]:\n    started=time.perf_counter()\n    rec=sherpa_onnx.OfflineRecognizer.from_zipformer_ctc(model=str(model),tokens=str(model.parent/\"\
        tokens.txt\"),num_threads=2,ctc_graph=\"\" if graph==\"greedy\" else str(model.parent/(graph+\"\
        .fst\")))\n    setup=time.perf_counter()-started\n    errs=[];counts=[];elapsed=0\n\
        \    for clip,ref,wave in audio:\n        t=time.perf_counter();stream=rec.create_stream();stream.accept_waveform(16000,wave);rec.decode_stream(stream);hyp=words(stream.result.text);elapsed+=time.perf_counter()-t\n\
        \        errs.append(Levenshtein.distance(ref,hyp));counts.append(len(ref))\n\
        \    record[graph]=np.array(errs)\n    print(\"RESULT\",json.dumps(dict(graph=graph,clips=len(clips),speakers=len(groups),words=sum(counts),errors=sum(errs),wer=sum(errs)/sum(counts),audio_seconds=seconds,rtf=elapsed/seconds,init_seconds=setup)),flush=True)\n\
        \    del rec,stream\n    gc.collect()\nrng=np.random.default_rng(4186)\nidx=rng.integers(0,40,(10000,40))\n\
        word_counts=np.asarray(counts).reshape(40,3).sum(axis=1)\ndelta=(record[\"\
        HLG\"]-record[\"HL\"]).reshape(40,3).sum(axis=1)\nboot=delta[idx].sum(axis=1)*100/word_counts[idx].sum(axis=1)\n\
        print(\"RESULT\",json.dumps(dict(contrast=\"HLG minus HL\",wer_points=100*delta.sum()/word_counts.sum(),speaker_bootstrap_95=np.quantile(boot,[.025,.975]).tolist())),flush=True)\n\
        \nPY"
