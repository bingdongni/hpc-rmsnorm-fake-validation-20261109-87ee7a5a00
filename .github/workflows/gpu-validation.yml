name: Validate agent persistence, attention, rotations and Sigma rule names
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux:
    name: Public API comparisons (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      SCIPY_ARRAY_API: '1'
    steps:
    - &id001
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/aisuite
        ref: 607d89cd906bd337ab05979317c0274d8d1ddceb
        fetch-depth: 2
        path: aisuite
        persist-credentials: false
    - name: Check out parent of aisuite
      run: git -C aisuite worktree add --detach ../aisuite-base-1af99fa0 66c7890c2d68c2d67f41723bc848bb6713d82a9c
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/local-attention
        ref: 23194cc8c7da56e9875a48c6485faf6670eedcce
        fetch-depth: 2
        path: local
        persist-credentials: false
    - name: Check out parent of local-attention
      run: git -C local worktree add --detach ../local-base-1af99fa0 af58e53f81e5e1d87a7d50cb193d5c26f3c0e03f
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/e3nn
        ref: 6c8fcbc1fa029ad0e24e1f0f7bd415874357b220
        fetch-depth: 2
        path: e3nn
        persist-credentials: false
    - name: Check out parent of e3nn
      run: git -C e3nn worktree add --detach ../e3nn-base-1af99fa0 2aa7f58440a06b15352a2cbce01fa4c26f824969
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/pySigma
        ref: b5c9780452756d81488071529b0fc921a35f3209
        fetch-depth: 2
        path: sigma
        persist-credentials: false
    - name: Check out parent of pySigma
      run: git -C sigma worktree add --detach ../sigma-base-1af99fa0 e5221881d5f3d69033b34882fad83864d80db826
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install CPU test dependencies
      run: 'python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install pytest pytest-asyncio nest-asyncio ''openai>=1.107,<2''
        docstring-parser ''pydantic>=2.10,<3'' httpx requests rich hyper-connections==0.4.11
        einops opt-einsum-fx scipy sympy numpy pyparsing pyyaml packaging jinja2 diskcache-community
        jq google-re2'
    - name: aisuite public API and regression checks
      run: 'python validation/compare.py aisuite aisuite-base-1af99fa0 cpu base

        python validation/compare.py aisuite aisuite cpu candidate

        python validation/test_suite.py aisuite'
    - name: local-attention public API and regression checks
      run: 'python validation/compare.py local local-base-1af99fa0 cpu base

        python validation/compare.py local local cpu candidate

        python validation/test_suite.py local'
    - name: e3nn public API and regression checks
      run: 'python validation/compare.py e3nn e3nn-base-1af99fa0 cpu base

        python validation/compare.py e3nn e3nn cpu candidate

        python validation/test_suite.py e3nn'
    - name: pySigma public API and regression checks
      run: 'python validation/compare.py sigma sigma-base-1af99fa0 cpu base

        python validation/compare.py sigma sigma cpu candidate

        python validation/test_suite.py sigma'
  gpu:
    name: Public API comparisons (RTX 4060)
    runs-on:
    - self-hosted
    - Windows
    - X64
    - attention-rotation-agents-405267fdc9
    timeout-minutes: 40
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      SCIPY_ARRAY_API: '1'
    steps:
    - *id001
    - name: Mask runner identifiers
      run: 'Write-Output "::add-mask::$env:MASK_MACHINE"

        Write-Output "::add-mask::$env:MASK_USER"'
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/aisuite
        ref: 607d89cd906bd337ab05979317c0274d8d1ddceb
        fetch-depth: 2
        path: aisuite
        persist-credentials: false
    - name: Check out parent of aisuite
      run: git -C aisuite worktree add --detach ../aisuite-base-1af99fa0 66c7890c2d68c2d67f41723bc848bb6713d82a9c
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/local-attention
        ref: 23194cc8c7da56e9875a48c6485faf6670eedcce
        fetch-depth: 2
        path: local
        persist-credentials: false
    - name: Check out parent of local-attention
      run: git -C local worktree add --detach ../local-base-1af99fa0 af58e53f81e5e1d87a7d50cb193d5c26f3c0e03f
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/e3nn
        ref: 6c8fcbc1fa029ad0e24e1f0f7bd415874357b220
        fetch-depth: 2
        path: e3nn
        persist-credentials: false
    - name: Check out parent of e3nn
      run: git -C e3nn worktree add --detach ../e3nn-base-1af99fa0 2aa7f58440a06b15352a2cbce01fa4c26f824969
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/pySigma
        ref: b5c9780452756d81488071529b0fc921a35f3209
        fetch-depth: 2
        path: sigma
        persist-credentials: false
    - name: Check out parent of pySigma
      run: git -C sigma worktree add --detach ../sigma-base-1af99fa0 e5221881d5f3d69033b34882fad83864d80db826
    - name: aisuite public API and regression checks
      run: '& ''C:\PR\pr-followup-20261116-1550\deps\Scripts\python.exe'' validation/compare.py
        aisuite aisuite-base-1af99fa0 cpu base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-1550\deps\Scripts\python.exe'' validation/compare.py
        aisuite aisuite cpu candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }'
    - name: local-attention public API and regression checks
      run: '& ''C:\PR\pr-followup-20261116-1550\deps\Scripts\python.exe'' validation/compare.py
        local local-base-1af99fa0 cuda base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-1550\deps\Scripts\python.exe'' validation/compare.py
        local local cuda candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }'
    - name: e3nn public API and regression checks
      run: '& ''C:\PR\pr-followup-20261116-1550\deps\Scripts\python.exe'' validation/compare.py
        e3nn e3nn-base-1af99fa0 cuda base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-1550\deps\Scripts\python.exe'' validation/compare.py
        e3nn e3nn cuda candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }'
    - name: pySigma public API and regression checks
      run: '& ''C:\PR\pr-followup-20261116-1550\deps\Scripts\python.exe'' validation/compare.py
        sigma sigma-base-1af99fa0 cpu base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-1550\deps\Scripts\python.exe'' validation/compare.py
        sigma sigma cpu candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }'
