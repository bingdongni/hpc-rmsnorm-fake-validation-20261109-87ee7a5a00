name: DeepJIT precompiler thread sanitizer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/DeepJIT
          ref: c6a65639829487269ff91af7be10864a90aeba37
          persist-credentials: false
      - name: Run precompiler regression under ThreadSanitizer
        run: |
          c++ -std=c++20 -O1 -g -pthread -fsanitize=thread -fno-omit-frame-pointer -I include tests/test_precompiler.cpp -o /tmp/deepjit-precompiler-tsan
          TSAN_OPTIONS=halt_on_error=1 /tmp/deepjit-precompiler-tsan
