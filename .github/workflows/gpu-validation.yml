name: Check YaRN attention, HMM decoding and geometric medians
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux:
    name: Public API comparisons (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      SCIPY_ARRAY_API: '1'
    steps:
    - &id001
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/geomstats
        ref: f9768e058f1a14e690cdaf6aa669a2bedfcc573d
        fetch-depth: 2
        path: geom
        persist-credentials: false
    - name: Check out parent of geomstats
      run: git -C geom worktree add --detach ../geom-base-a55cb896 2fc8e25eb8955767292552f9c0c1438be362ba8f
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/pyro
        ref: 3554195ac1973ddec80b6305346ee6806c5a5068
        fetch-depth: 2
        path: pyro
        persist-credentials: false
    - name: Check out parent of pyro
      run: git -C pyro worktree add --detach ../pyro-base-a55cb896 a31bc1784707268cd79df77ead4c7a47062f0193
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/rotary-embedding-torch
        ref: 3e929aa9d018e9401311fbefd48dbab226b89fa4
        fetch-depth: 2
        path: rotary
        persist-credentials: false
    - name: Check out parent of rotary-embedding-torch
      run: git -C rotary worktree add --detach ../rotary-base-a55cb896 6d7071e10d8aefa651526b797c00d33d106f1473
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install CPU test dependencies
      run: 'python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install pytest opt-einsum pyro-api tqdm einops numpy scipy pandas
        matplotlib joblib scikit-learn nbformat nbconvert autograd flaky'
    - name: geomstats public API and regression checks
      run: 'python validation/compare.py geom geom-base-a55cb896 cpu base

        python validation/compare.py geom geom cpu candidate

        python validation/test_suite.py geom'
    - name: pyro public API and regression checks
      run: 'python validation/compare.py pyro pyro-base-a55cb896 cpu base

        python validation/compare.py pyro pyro cpu candidate

        python validation/test_suite.py pyro'
    - name: rotary-embedding-torch public API and regression checks
      run: 'python validation/compare.py rotary rotary-base-a55cb896 cpu base

        python validation/compare.py rotary rotary cpu candidate

        python validation/test_suite.py rotary'
  gpu:
    name: Public API comparisons (RTX 4060)
    runs-on:
    - self-hosted
    - Windows
    - X64
    - geometry-paths-rope-affb889089
    timeout-minutes: 40
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      SCIPY_ARRAY_API: '1'
    steps:
    - *id001
    - name: Mask runner identifiers
      run: 'Write-Output "::add-mask::$env:MASK_MACHINE"

        Write-Output "::add-mask::$env:MASK_USER"'
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/geomstats
        ref: f9768e058f1a14e690cdaf6aa669a2bedfcc573d
        fetch-depth: 2
        path: geom
        persist-credentials: false
    - name: Check out parent of geomstats
      run: git -C geom worktree add --detach ../geom-base-a55cb896 2fc8e25eb8955767292552f9c0c1438be362ba8f
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/pyro
        ref: 3554195ac1973ddec80b6305346ee6806c5a5068
        fetch-depth: 2
        path: pyro
        persist-credentials: false
    - name: Check out parent of pyro
      run: git -C pyro worktree add --detach ../pyro-base-a55cb896 a31bc1784707268cd79df77ead4c7a47062f0193
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/rotary-embedding-torch
        ref: 3e929aa9d018e9401311fbefd48dbab226b89fa4
        fetch-depth: 2
        path: rotary
        persist-credentials: false
    - name: Check out parent of rotary-embedding-torch
      run: git -C rotary worktree add --detach ../rotary-base-a55cb896 6d7071e10d8aefa651526b797c00d33d106f1473
    - name: geomstats public API and regression checks
      run: '& ''C:\PR\pr-followup-20261116-1352\deps\Scripts\python.exe'' validation/compare.py
        geom geom-base-a55cb896 cuda base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-1352\deps\Scripts\python.exe'' validation/compare.py
        geom geom cuda candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }'
    - name: pyro public API and regression checks
      run: '& ''C:\PR\pr-followup-20261116-1352\deps\Scripts\python.exe'' validation/compare.py
        pyro pyro-base-a55cb896 cuda base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-1352\deps\Scripts\python.exe'' validation/compare.py
        pyro pyro cuda candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }'
    - name: rotary-embedding-torch public API and regression checks
      run: '& ''C:\PR\pr-followup-20261116-1352\deps\Scripts\python.exe'' validation/compare.py
        rotary rotary-base-a55cb896 cuda base

        if ($LASTEXITCODE) { throw ''Comparison failed'' }

        & ''C:\PR\pr-followup-20261116-1352\deps\Scripts\python.exe'' validation/compare.py
        rotary rotary cuda candidate

        if ($LASTEXITCODE) { throw ''Comparison failed'' }'
