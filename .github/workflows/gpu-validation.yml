name: STL telemetry and native atomistic neighbor lists
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  mstic:
    name: MSTICPy signed time-series anomalies (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: mstic
        persist-credentials: false
        repository: bingdongni/msticpy
        ref: 56524754fce7388ac6389fc6dbd419df99039337
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - working-directory: mstic
      run: 'python -m pip install ''.[ml]'' pytest-env pytest pytest-check nbformat nbconvert filelock

        python -m pytest -q tests/analysis/test_timeseries.py'
  vesin:
    name: Vesin native PyTorch neighbor lists (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      CMAKE_GENERATOR: Ninja
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: vesin
        persist-credentials: false
        repository: bingdongni/vesin
        ref: aa85c03c989023208472d396364c96e933f1708c
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - working-directory: vesin
      run: 'python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install -U setuptools wheel cmake ninja pytest ase

        python -m pip install --no-build-isolation --no-deps ./python/vesin_torch

        python -m pytest -q python/vesin_torch/tests/test_neighbors.py'
