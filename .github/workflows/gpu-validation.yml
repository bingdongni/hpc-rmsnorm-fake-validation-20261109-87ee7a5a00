name: Memory prefilter literal validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      SHELLM_ENV: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: laude-institute/headlong
          ref: 2e39a3f94fb9acbd0d73f6b0aecc9f83dc14547e
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/headlong
          ref: 2b0afc13e6320d554a06c4c0310612eb6b72372b
          path: patched
          persist-credentials: false
      - name: Set up macOS Bash 3.2 and tools
        if: runner.os == 'macOS'
        run: |
          brew list coreutils >/dev/null 2>&1 || brew install -q coreutils
          brew list jq >/dev/null 2>&1 || brew install -q jq
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Verify pinned sources
        run: |
          python3 -c "import hashlib,pathlib; pairs=[('patched/bin/mem','e0fa83674bd11f140db8a27b3d6e948be87ab210761a52a3980914db2bdeb7c0'),('patched/tests/test_mem_prefilter_literals.sh','d263542126200289af11153bbeee6371efb7870abfab2fbc1115489225c92a02'),('baseline/bin/mem','b0c49a6eaae92f2d5b888f84a4c5cd68d1837e5fe39263603f7a25f5bcbc9d92')]; assert all(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h for p,h in pairs); print('Source hashes verified')"
          bash --version | sed -n '1p'
          echo 'Patched commit: 2b0afc13e6320d554a06c4c0310612eb6b72372b'
      - name: Confirm baseline failure
        run: |
          cp patched/tests/test_mem_prefilter_literals.sh baseline/tests/
          cd baseline
          set +e
          output=$(bash tests/test_mem_prefilter_literals.sh 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output"
          test "$code" -ne 0
          printf '%s\n' "$output" | grep -F 'FAIL literal query api.example.com'
      - name: Run regression and existing memory tests
        working-directory: patched
        run: |
          bash tests/test_mem_prefilter_literals.sh
          bash tests/test_mem_search.sh
          bash tests/test_related_memories.sh
