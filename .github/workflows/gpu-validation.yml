name: FlashQLA simulated SM121 AutoCP regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    runs-on: [self-hosted, Windows, X64, flashqla-sm121-92d6d0d06e]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    env:
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      FLASHQLA_TEST_DEVICE: cuda
      TEMP: 'C:\PR\flashqla-test-tmp-20261111'
      TMP: 'C:\PR\flashqla-test-tmp-20261111'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: QwenLM/FlashQLA
          ref: a14dbf3474514e1674526431e960325f72081e9f
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: QwenLM/FlashQLA
          ref: a14dbf3474514e1674526431e960325f72081e9f
          path: candidate
          persist-credentials: false
      - name: Compare simulated SM121 planning on CUDA
        run: |
          if ((git -C baseline rev-parse HEAD) -ne 'a14dbf3474514e1674526431e960325f72081e9f') { throw 'Wrong baseline' }
          if ((git -C candidate rev-parse HEAD) -ne 'a14dbf3474514e1674526431e960325f72081e9f') { throw 'Wrong candidate base' }
          $patch = Join-Path $env:GITHUB_WORKSPACE 'harness/flashqla-sm121.patch'
          git -C candidate apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch does not apply cleanly' }
          git -C candidate apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch application failed' }
          Copy-Item -LiteralPath 'candidate/tests/test_autocp_arch.py' -Destination 'baseline/tests/test_autocp_arch.py'
          $python = 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe'
          $tests = Join-Path $env:GITHUB_WORKSPACE 'harness/run_flashqla_autocp_tests.py'
          $probe = Join-Path $env:GITHUB_WORKSPACE 'harness/flashqla_sm121_context_probe.py'
          $env:FLASHQLA_TEST_ROOT = Join-Path $env:GITHUB_WORKSPACE 'baseline'
          & $python $tests -q
          if ($LASTEXITCODE -ne 1) { throw 'Baseline did not reproduce the expected failures' }
          Write-Output 'Baseline architecture regression reproduced'
          & $python $probe
          if ($LASTEXITCODE -ne 1) { throw 'Baseline context initialization unexpectedly passed' }
          Write-Output 'Baseline context initialization regression reproduced'
          $env:FLASHQLA_TEST_ROOT = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          & $python $tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Candidate architecture tests failed' }
          & $python $probe
          if ($LASTEXITCODE -ne 0) { throw 'Candidate CUDA context probe failed' }
          Write-Output 'No SM121 TileLang kernels were run in this job'
