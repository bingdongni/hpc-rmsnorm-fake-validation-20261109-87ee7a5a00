name: Validate forecast-revisions algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: forecast-revisions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: Nixtla/utilsforecast
        ref: 5a6ec8dd5280f60929918c3092a91ebcdf7de81d
        persist-credentials: false
    - name: Apply verified change
      shell: bash
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        git diff --check'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run tests
      shell: bash
      run: 'set -euo pipefail

        python -m pip -q install uv

        uv sync --frozen --group dev

        uv run --no-sync pytest -q -o addopts= tests/test_forecast_stability.py tests/test_losses.py
        tests/test_evaluation.py

        uv pip install statsmodels

        echo 
        | base64 -d > /tmp/check-revisions.py

        uv run --no-sync python /tmp/check-revisions.py

        '
