name: Validate survival-leaves algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: survival-leaves
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: sebp/scikit-survival
        ref: 76e43b7aa75b5aead9de43e0ac11bba6884b3685
        persist-credentials: false
    - name: Apply verified change
      shell: bash
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        git diff --check'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run tests
      shell: bash
      run: 'set -euo pipefail

        export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1

        git submodule update --init --depth 1

        python -m pip install --upgrade -q pip

        python -m pip install -q -e . --group test pyarrow

        python -m pytest -q tests/test_tree.py tests/test_forest.py

        echo 
        | base64 -d > /tmp/survival-bench.py

        python /tmp/survival-bench.py

        '
