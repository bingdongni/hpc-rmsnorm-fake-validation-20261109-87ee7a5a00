name: Validate asr-full algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  group0:
    name: Full LibriSpeech test-clean HL vs HLG, speaker group 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - name: Install CPU decoder
      run: python -m pip install 'sherpa-onnx==2.0.3' numpy soundfile rapidfuzz
    - name: Fetch released INT8 model, three graphs and public speech
      run: 'set -euo pipefail

        archive=sherpa-onnx-zipformer-ctc-en-2023-10-02

        curl -fsSL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$archive.tar.bz2
        -o model.tar.bz2

        tar xf model.tar.bz2 --wildcards ''*/model.int8.onnx'' ''*/tokens.txt'' ''*/H*.fst''

        curl -fsSL --retry 3 https://www.openslr.org/resources/12/test-clean.tar.gz
        -o audio.tar.gz

        sha256sum model.tar.bz2 audio.tar.gz

        tar xf audio.tar.gz'
    - name: Evaluate held-out speech
      env:
        SHARD: '0'
      run: "python - <<'PY'\nimport gc\nimport json\nimport os\nimport re\nimport\
        \ time\nfrom collections import defaultdict\nfrom pathlib import Path\nimport\
        \ sherpa_onnx\nimport soundfile as sf\nfrom rapidfuzz.distance import Levenshtein\n\
        \ngroups = defaultdict(list)\nfor transcript in sorted(Path(\"LibriSpeech/test-clean\"\
        ).rglob(\"*.trans.txt\")):\n    for row in transcript.read_text().splitlines():\n\
        \        clip, text = row.split(\" \", 1)\n        groups[clip.split(\"-\"\
        )[0]].append((transcript.with_name(clip + \".flac\"), text))\nassert len(groups)\
        \ == 40 and sum(map(len, groups.values())) == 2620\npart = int(os.environ[\"\
        SHARD\"])\nspeakers = sorted(groups)[part::4]\nmodel = next(Path(\".\").glob(\"\
        sherpa-onnx-zipformer-ctc-en-*/model.int8.onnx\"))\ndef words(text):\n   \
        \ return re.findall(r\"[A-Z]+(?:'[A-Z]+)*\", text.upper())\n\nfor graph in\
        \ [\"HL\", \"HLG\"]:\n    rec = sherpa_onnx.OfflineRecognizer.from_zipformer_ctc(\n\
        \        model=str(model), tokens=str(model.parent / \"tokens.txt\"), num_threads=2,\n\
        \        ctc_graph=str(model.parent / (graph + \".fst\")))\n    for sp in\
        \ speakers:\n        errors = nwords = frames = 0\n        elapsed = 0.\n\
        \        for path, ref in groups[sp]:\n            wave, sr = sf.read(path,\
        \ dtype=\"float32\")\n            assert sr == 16000\n            truth =\
        \ words(ref)\n            t = time.perf_counter()\n            stream = rec.create_stream()\n\
        \            stream.accept_waveform(sr, wave)\n            rec.decode_stream(stream)\n\
        \            hyp = words(stream.result.text)\n            elapsed += time.perf_counter()\
        \ - t\n            errors += Levenshtein.distance(truth, hyp)\n          \
        \  nwords += len(truth)\n            frames += len(wave)\n        print(\"\
        SPEAKER\", json.dumps(dict(graph=graph, speaker=sp, clips=len(groups[sp]),\
        \ words=nwords, errors=errors, seconds=frames/16000, decode=elapsed)), flush=True)\n\
        \    del rec, stream\n    gc.collect()\n\nPY"
