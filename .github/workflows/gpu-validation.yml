name: KDA output buffer validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    runs-on: [self-hosted, Windows, X64, fla-kda-guard-6720677737]
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    env:
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      FLA_CI_ENV: '0'
      CC: 'C:\PR\fla-research-deps-20261110\triton\runtime\tcc\tcc.exe'
      CUDA_PATH: 'C:\PR\fla-research-deps-20261110\triton\backends\nvidia'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: fla-org/flash-linear-attention
          ref: b8da4873fa0834849b64938af9f89bc35a347d90
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/flash-linear-attention
          ref: 9ac47b38bd6a6e6cd4071c05d3b5dc544ea4114d
          path: patched
          persist-credentials: false
      - name: Verify GPU and baseline regression
        run: |
          if ((git -C baseline rev-parse HEAD) -ne 'b8da4873fa0834849b64938af9f89bc35a347d90') { throw 'Wrong baseline' }
          if ((git -C patched rev-parse HEAD) -ne '9ac47b38bd6a6e6cd4071c05d3b5dc544ea4114d') { throw 'Wrong patch' }
          $env:PYTHONPATH = "C:\PR\fla-research-deps-20261110;C:\PR\fla-model-deps-20261110;$env:GITHUB_WORKSPACE\baseline"
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -c "import torch,triton; assert torch.cuda.is_available(); print('GPU:',torch.cuda.get_device_name(0),'PyTorch:',torch.__version__,'Triton:',triton.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'CUDA unavailable' }
          Copy-Item -LiteralPath patched\tests\ops\test_kda.py -Destination baseline\tests\ops\test_kda.py
          Set-Location baseline
          $env:FLA_DISABLE_BACKEND_DISPATCH = '1'
          $output = & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -m pytest tests\ops\test_kda.py -k fused_recurrent_rejects_strided_output -q -o log_cli=false --disable-warnings --tb=no 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 1 -or $output -notmatch '4 failed') { throw 'Unexpected baseline result' }
          exit 0
      - name: Run recurrent correctness tests
        run: |
          $env:PYTHONPATH = "C:\PR\fla-research-deps-20261110;C:\PR\fla-model-deps-20261110;$env:GITHUB_WORKSPACE\patched"
          Remove-Item Env:FLA_DISABLE_BACKEND_DISPATCH -ErrorAction SilentlyContinue
          Set-Location patched
          & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -m pytest tests\ops\test_kda.py -k fused_recurrent -q -o log_cli=false --disable-warnings --tb=short
          if ($LASTEXITCODE -ne 0) { throw 'Recurrent CUDA tests failed' }
      - name: Compare decode timings
        run: |
          $env:FLA_DISABLE_BACKEND_DISPATCH = '1'
          $script = Join-Path $env:GITHUB_WORKSPACE 'harness/fla_kda_guard_benchmark.py'
          foreach ($tree in @('baseline', 'patched')) {
            Write-Host "Benchmark $tree"
            $env:PYTHONPATH = "C:\PR\fla-research-deps-20261110;$env:GITHUB_WORKSPACE\$tree"
            Set-Location (Join-Path $env:GITHUB_WORKSPACE $tree)
            & 'C:\PR\torchao-gpu-venv-20261109\Scripts\python.exe' -u $script
            if ($LASTEXITCODE -ne 0) { throw "Benchmark failed: $tree" }
          }
  precommit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/flash-linear-attention
          ref: 9ac47b38bd6a6e6cd4071c05d3b5dc544ea4114d
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pre-commit
      - run: pre-commit run --files fla/ops/kda/fused_recurrent.py tests/ops/test_kda.py
