name: Validate fci-order algorithm
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: fci-order
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: py-why/causal-learn
        ref: 0dacacf36390e3084704636bc3c36e82e35ee0cc
        persist-credentials: false
    - name: Apply verified change
      shell: bash
      run: 'set -euo pipefail

        echo 
        | base64 -d | git apply -

        git diff --check'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run tests
      shell: bash
      run: 'set -euo pipefail

        export PYTHONHASHSEED=23 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MPLBACKEND=Agg

        sudo apt-get install -y graphviz libgraphviz-dev

        python -m pip install -q -e . pytest pygraphviz

        echo 
        | base64 -d > /tmp/fci-suite.py

        python /tmp/fci-suite.py

        echo 
        | base64 -d > /tmp/fci-permute.py

        python /tmp/fci-permute.py

        echo 
        | base64 -d > /tmp/fci-fixtures.py

        python /tmp/fci-fixtures.py

        '
