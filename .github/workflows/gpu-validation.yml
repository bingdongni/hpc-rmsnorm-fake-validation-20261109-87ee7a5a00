name: Right-padded and empty batches in SoftDTWLossPyTorch
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux:
    name: Soft-DTW batches (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      PYTHONUTF8: '1'
    steps:
    - &id001
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: validation
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/tslearn
        ref: ee66f6b2bf6f651a30552c2acb5d754db4133a35
        fetch-depth: 4
        path: tslearn
        persist-credentials: false
    - name: Check out parent of tslearn
      run: git -C tslearn worktree add --detach ../ts-base-834f4af576 d848642f5c8219126a22b500a975611a38607f20
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install CPU PyTorch and tslearn dependencies
      run: 'python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install pytest numba statsmodels scikit-learn h5py'
    - name: 'tslearn: compare parent, candidate and run tests'
      run: 'python validation/compare.py tslearn ts-base-834f4af576 cpu base

        python validation/compare.py tslearn tslearn cpu candidate

        python validation/test_suite.py tslearn'
  gpu:
    name: Soft-DTW batches (RTX 4060)
    runs-on:
    - self-hosted
    - Windows
    - X64
    - soft-dtw-batches-81f78801c4
    timeout-minutes: 40
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
    - *id001
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: bingdongni/tslearn
        ref: ee66f6b2bf6f651a30552c2acb5d754db4133a35
        fetch-depth: 4
        path: tslearn
        persist-credentials: false
    - name: Check out parent of tslearn
      run: git -C tslearn worktree add --detach ../ts-base-834f4af576 d848642f5c8219126a22b500a975611a38607f20
    - name: 'tslearn: compare parent, candidate and run tests'
      run: '& ''C:\PR\pr-followup-20261116-0830\work-env\Scripts\python.exe'' validation/compare.py
        tslearn ts-base-834f4af576 cuda base

        if ($LASTEXITCODE) { throw ''Public entry point comparison failed'' }

        & ''C:\PR\pr-followup-20261116-0830\work-env\Scripts\python.exe'' validation/compare.py
        tslearn tslearn cuda candidate

        if ($LASTEXITCODE) { throw ''Public entry point comparison failed'' }

        & ''C:\PR\pr-followup-20261116-0830\work-env\Scripts\python.exe'' validation/test_suite.py
        tslearn

        if ($LASTEXITCODE) { throw ''Regression tests failed'' }'
